<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习模式 · 言语理解 · 浙江行测</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--sub:#5d6a7a;--line:#e3e8ee;--brand:#146b58;--warn:#b4530a;--chip:#eef5f3;--ok:#0f7b4f;--bad:#b3261e;--okbg:#e8f6ef;--badbg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1c2129;--ink:#e6ebf2;--sub:#93a1b3;--line:#2b333e;--brand:#4fc3a1;--warn:#f0a35e;--chip:#20322e;--ok:#5ed6a0;--bad:#ff8a80;--okbg:#1b2f26;--badbg:#33201e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
a{color:var(--brand)}
.top{display:flex;gap:10px;margin-bottom:10px}
.top a{font-size:13px;text-decoration:none;border:1px solid var(--line);padding:5px 10px;border-radius:8px;background:var(--card)}
h1{font-size:22px;margin:8px 0 4px}
.lead{color:var(--sub);font-size:13px;margin:0 0 14px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.bar .row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.pb{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:14px}
.gh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.gh b{font-size:17px}
.gh span{font-size:12px;color:var(--warn)}
.qno{font-size:12px;color:var(--sub);margin-bottom:8px}
.stem{font-size:15px;line-height:1.75}
.stem .qimg{max-width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
.opt{display:block;width:100%;text-align:left;margin:8px 0 0;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--chip);font-weight:600}
.opt.right{border-color:var(--ok);background:var(--okbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;opacity:1}
.opt em{font-style:normal;font-weight:700;margin-right:6px;color:var(--brand)}
.opt .lp{color:var(--sub);font-size:12.5px}
.opt.letteronly em{font-size:15px}
.act{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 18px;border-radius:10px;border:0;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.res{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.judge{font-size:14px;font-weight:700;margin-bottom:10px}
.judge.ok{color:var(--ok)} .judge.bad{color:var(--bad)}
.blk{margin:10px 0 0}
.blk h4{margin:0 0 5px;font-size:13px;color:var(--brand);letter-spacing:.5px}
.blk .bd{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px}
.blk .bd ol{margin:0;padding-left:20px}
.blk .bd li{margin:4px 0}
.rule{border-left:3px solid var(--line);padding:6px 0 6px 10px;margin:8px 0}
.rule.hot{border-left:3px solid var(--warn);background:#fff8ef;border-radius:0 8px 8px 0;padding:7px 10px 8px 10px}
@media (prefers-color-scheme:dark){.rule.hot{background:#2a2318}}
.rule .rt{margin-bottom:2px}
.rule b{font-size:13.5px}
.rule.hot b{background:linear-gradient(transparent 55%,#ffe08a 55%);padding:0 1px;border-radius:2px}
@media (prefers-color-scheme:dark){.rule.hot b{background:linear-gradient(transparent 55%,#6b5410 55%)}}
.rule.hot b{color:var(--ink)}
.rule b.hl{background:linear-gradient(transparent 55%,#ffe08a 55%);padding:0 1px;border-radius:2px}
@media (prefers-color-scheme:dark){.rule b.hl{background:linear-gradient(transparent 55%,#6b5410 55%)}}
.flag{display:inline-block;font-size:11px;background:var(--warn);color:#fff;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.rule p{margin:3px 0 0;font-size:13.5px;color:var(--sub)}
.rule.hot p{color:var(--ink)}
.meta{font-size:12px;color:var(--sub);margin-top:8px}
.sum{text-align:center;padding:24px 16px}
.sum .big{font-size:34px;font-weight:700;color:var(--brand)}
.sum p{color:var(--sub);font-size:14px}
.note{margin-top:22px;font-size:12px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px}
.hide{display:none}

.mat{background:#f2f5f8;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.75}
.mat .mt{font-size:12px;color:var(--sub);margin-bottom:4px}
.mat img{max-width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
@media (prefers-color-scheme:dark){.mat{background:#1a2330}}
.qimg{max-width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}

.res .meta.neg{display:block;margin:6px 0 2px;padding:7px 10px;border-radius:8px;background:#fff1f2;color:#9f1239;font-size:13px;line-height:1.55;font-weight:600}
body.markmap-dark .res .meta.neg,html[data-theme="dark"] .res .meta.neg{background:#3b0d16;color:#fda4af}
.opt img.qimg{max-width:100%;height:auto;display:block;margin:3px 0;background:#fff}</style></head><body>

<script id="data" type="application/json">{"groups": [{"gid": "lcy", "title": "逻辑填空 · 成语", "tag": "言语 30 题里 8–10 题", "think": "先在心里把这个空要表达的意思写成一句白话，再逐个比成语：<b>前提条件<\/b>对不对、<b>程度<\/b>轻了还是重了、<b>搭配<\/b>的对象是不是这个。", "rules": [{"t": "逻辑填空 · 总步骤", "f": "① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② 找逻辑：借上下文、关联词、标点判定关系<br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "when": "任何逻辑填空题"}, {"t": "选项辨析 · 拆异字", "f": "<b>把相同字去掉，只辨异字<\/b>：厉（严格）vs 力（尽力）→ 看语境要「严格执行」还是「尽力去做」；再配搭配对象", "when": "四个词长得像（厉行/力行）"}, {"t": "递进标志词（要背）", "f": "更、更加、甚至、进而、而且、况且；尤其、特别、格外、反倒", "when": "判断前后是否递进"}, {"t": "解释关系", "f": "标志：即、也就是说、换言之、就是、例如、冒号、破折号；提示词：无异于、堪称、所谓<br>→ <b>空与提示信息意思相近<\/b>，直接找同义词", "when": "空前后有解释性提示"}, {"t": "对应关系 · 转折", "f": "转折词：但是、可是、然而、却、而、事实上、实际上、殊不知（前后语义相反）<br>对照词：不是…而是…、过去…现在…、只见…不见…、相较于、不同于<br>变化词：转变、转化、演变、变得、从…到…<br>否定词：并非、没有、不会、绝非、脱离、违背", "when": "出现转折词/对照词/变化词/否定词"}, {"t": "褒贬 · 抓基调", "f": "借前后形容词、态度词、评价词定调：<b>前后褒 → 选褒义；批判否定 → 选贬义；纯陈述 → 用中性<\/b>", "when": "空的词要看文段态度"}], "main": [{"id": "zj-2015-A-q21", "stem": "英国车，汽车工艺的代表，处处________出高贵、优雅、灵动、恒久的艺术气质。而这一切，源自于英国<br>人一直________的传统造车技艺——始终以手工进行装嵌。<br>依次填入划横线部分最恰当的一项是:", "options": ["彰显、迷恋", "展示、擅长", "流露、秉承", "体现、坚守"], "answer": 2, "neg": 0, "steps": ["第一步，突破口在第二空。根据文中“一直”“传统”“始终”可知，造车技艺时间之久，且该空搭配“技艺”。 A 项“迷恋”指对事物的喜爱。B 项“擅长”指在某方面有特长。两者均不能体现时间久，可排除 A 项和 B 项。 C 项“秉承”指接受，承接，继承。D 项“坚守”指坚决守卫，不离开，一般搭配原则和信念。两者都能够体现 时间长，但文段搭配的是“技艺”，应有传承、继承的含义，所以 C 项更符合语境。锁定 C 项。", "第二步，验证第一空。C 项“流露气质”，搭配合适。 因此，选择 C 选项。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "递进标志词（要背）", "f": "<p>判断前后是否递进<\/p><b class=\"hl\">更、更加、甚至、进而、而且、况且；尤其、特别、格外、反倒<\/b>", "hot": 1}, {"t": "逻辑填空 · 总步骤", "f": "<p>任何逻辑填空题<\/p>① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② <b class=\"hl\">找逻辑：借上下文、关联词、标点判定关系<\/b><br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "hot": 0}]}, {"id": "zj-2015-A-q25", "stem": "哈佛大学的一位校长曾提出这样的思考：我们培养出来的青年人该用什么样的方式来回报这所学校？是选<br>择自己更好的生活，还是更好地为公众服务？150 年过去了，这个问题仍然可以________当下。这位校长希望<br>有朝一日能够在学校的纪念碑上，________选择后者的毕业生的名字。今天，在中国，已经有越来越多的青年<br>人作出了这样的人生抉择。<br>依次填入划横线部分最恰当的一项是:", "options": ["叩问、雕刻", "质问、铭刻", "拷问、镌刻", "追问、铭记"], "answer": 2, "neg": 0, "steps": ["第一步，分析第一空。所填词语与“当下”搭配。A 项“叩问”指打听、询问，含有尊敬之意，不符合语境， 排除 A 项。B 项“质问”指根据事实问明是非，提出疑问，发出者多为人，不与“这个问题”搭配，排除 B 项。 D 项“追问”指追根究底地问；C 项“拷问”指拷打审问，搭配主语可以是人，也可以是事（多指问题），如“拷 问灵魂”“拷问历史”。二者均与后文“当下”搭配。", "第二步，分析第二空。C 项“镌刻”即雕刻之意，把铭文刻或画在某种坚硬物质上或石头上，与前文“纪念碑” 呼应。D 项“铭记”指牢记在心，不可与“纪念碑”搭配，排除 D 项。 因此，选择 C 选项。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "递进标志词（要背）", "f": "<p>判断前后是否递进<\/p><b class=\"hl\">更、更加、甚至、进而、而且、况且；尤其、特别、格外、反倒<\/b>", "hot": 1}, {"t": "逻辑填空 · 总步骤", "f": "<p>任何逻辑填空题<\/p>① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② <b class=\"hl\">找逻辑：借上下文、关联词、标点判定关系<\/b><br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "hot": 0}]}, {"id": "zj-2015-A-q28", "stem": "今年的“双十一购物节”让外界________中国热闹异常的电子商务产业。美国媒体感叹中国的“双十一”一<br>天的销售规模已经赶超美国两大网上购物日，预计电子商务将________中国在 2015 年成为全球最大的零售市场。<br>依次填入划横线部分最恰当的一项是:", "options": ["惊诧、力推", "关注、助推", "热议、襄助", "聚焦、助力"], "answer": 3, "neg": 0, "steps": ["第一步，分析第一空。根据“热闹异常”“感叹”可知，“双十一购物节”引起外界的注意。A 项“惊诧”后 不直接接宾语，多用作“惊诧于某事”或“某事令人惊诧”，与文段语句搭配不当，排除 A 项。B 项“关注” 语义较轻，无法体现“热闹异常”的程度，排除 B 项。", "第二步，分析第二空。文段的主语是电子商务，C 项“襄助”指从旁帮助，如倾囊相助，主语往往搭配人，不 能与“电子商务”搭配，排除 C 项。D 项“助力”指出力、提供帮助，置于此处，符合语境。 因此，选择 D 选项。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "逻辑填空 · 总步骤", "f": "<p>任何逻辑填空题<\/p>① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② <b class=\"hl\">找逻辑：借上下文、关联词、标点判定关系<\/b><br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "hot": 1}, {"t": "选项辨析 · 拆异字", "f": "<p>四个词长得像（厉行/力行）<\/p><b class=\"hl\"><b>把相同字去掉<\/b>，只辨异字<\/b>：厉（严格）vs 力（尽力）→ 看语境要「严格执行」还是「尽力去做」；再配搭配对象", "hot": 0}]}, {"id": "zj-2015-A-q30", "stem": "造谣传谣行为不但构成违法犯罪，更不断侵蚀社会诚信，________社会道德基础。打击网络“大谣”，净<br>化网络环境，刻不容缓。现实中，互联网的监督涉及部门众多。要及时迅速地________网络谣言，打击“大谣”，<br>需要进一步提高“虚拟社会”的服务和监督水平。<br>依次填入划横线部分最恰当的一项是:", "options": ["侵入、鉴别", "侵袭、认清", "瓦解、甄别", "渗透、破除"], "answer": 2, "neg": 0, "steps": ["第一步，分析第一空。所填词语与前文中“侵蚀”一词并列，且与“基础”搭配。“侵蚀”指逐渐侵害使变坏， 偏消极色彩，因此横线中也应填入消极色彩的词语，与之对应。D 项“渗透”指渗入、透过，比喻某种事物或 势力逐渐进入其他方面，为中性词，与语境不符，排除 D 项。A 项“侵入”指进入内部；B 项“侵袭”侵入袭击。 二者均不可与“基础”搭配，排除 A 项和 B 项。C 项“瓦解”指像瓦片碎裂分离，使对方力量崩溃，与“基础” 搭配得当，且与“侵蚀”词义相近。答案锁定 C 项。", "第二步，验证第二空，C 项“甄别”指鉴别、审察，与“网络谣言”搭配恰当，符合语境。 因此，选择 C 选项。 拓展 鉴别：辨别（真假好坏）。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "递进标志词（要背）", "f": "<p>判断前后是否递进<\/p><b class=\"hl\">更、更加、甚至、进而、而且、况且；尤其、特别、格外、反倒<\/b>", "hot": 1}, {"t": "逻辑填空 · 总步骤", "f": "<p>任何逻辑填空题<\/p>① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② <b class=\"hl\">找逻辑：借上下文、关联词、标点判定关系<\/b><br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "hot": 0}]}], "extra": [{"id": "gk-2026-zf-q36", "stem": "在技术的赋能下，检察机关在办理公益诉讼案件时如同拥有了顺风耳、千里眼，不仅能有效避免“________”式的线索摸排，也能有力确保证据的客观性和准确性，办案将更加精准、规范、高效，国家利益和社会公共利益将得到更好守护，公平正义也将更加可感可触。填入画横线部分最恰当的一项是：", "options": ["刻舟求剑", "管中窥豹", "缘木求鱼", "大海捞针"], "answer": 3, "neg": 0, "steps": ["横线处搭配“线索摸排”且根据“在技术的赋能下，检察机关在办理公益诉讼案件时如 同拥有了顺风耳、千里眼”以及横线前“能有效避免”可知，横线处与“顺风耳”“千里 眼”所代表的高效、精准形成反义并列，应体现技术赋能前线索摸排的艰难和低效之意，D 项“大海捞针”指在大海里捞一根针，比喻极难找到，符合文意，当选。", "A 项“刻舟求剑”比喻办事刻板拘泥，不知根据实际情况处理问题，文段并非强调方法刻 板，而是强调线索寻找过程的艰难，与文意不符，排除；B 项“管中窥豹”指所见不全面， 仅能体现线索摸排的不全面，不及D 项还能体现出该项工作的困难，排除；C 项“缘木求 鱼”指爬到树上去找鱼，比喻方向或方法不对，不可能达到目的，与文意不符，排除。", "故正确答案为D。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "递进标志词（要背）", "f": "<p>判断前后是否递进<\/p><b class=\"hl\">更、更加、甚至、进而、而且、况且；尤其、特别、格外、反倒<\/b>", "hot": 1}, {"t": "逻辑填空 · 总步骤", "f": "<p>任何逻辑填空题<\/p>① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② <b class=\"hl\">找逻辑：借上下文、关联词、标点判定关系<\/b><br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "hot": 0}]}, {"id": "gk-2026-zf-q37", "stem": "在太空实验室开展的脑电测试实验中，航天员戴的“小红帽”叫作脑电帽，里面嵌入了众多微小的触头，它们像一群________的小侦探，精准捕捉大脑每一个微妙的波动。这顶帽子赋予航天员神奇的能力——无须言语，无须动作，仅仅通过思维就能给电脑下指令，操控各种设备。填入画横线部分最恰当的一项是：", "options": ["未卜先知", "明察秋毫", "洞若观火", "随机应变"], "answer": 1, "neg": 0, "steps": ["横线处形容“小侦探”，且根据后文“精准捕捉大脑每一个微妙的波动”可知，横线处 应体现脑电帽中的微小触头能够精准捕捉大脑中的细微信号之意。B 项“明察秋毫”形容 人很精明，对很小的事情也能察看得清清楚楚，符合文意，当选。", "A 项“未卜先知”指没 有占卜便能事先知道，强调“预见性”；C 项“洞若观火”指观察事物如同看火一样清楚， 形容对事情的本质和发展趋势看得非常透彻明了，强调“看透本质”；D 项“随机应变” 指跟着情况的变化，掌握时机，灵活应付，强调“灵活性”，三者均无法体现“精准捕捉 大脑中的细微信号”之意，排除。", "故正确答案为B。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "逻辑填空 · 总步骤", "f": "<p>任何逻辑填空题<\/p>① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② <b class=\"hl\">找逻辑：借上下文、关联词、标点判定关系<\/b><br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "hot": 1}, {"t": "选项辨析 · 拆异字", "f": "<p>四个词长得像（厉行/力行）<\/p><b class=\"hl\"><b>把相同字去掉<\/b>，只辨异字<\/b>：厉（严格）vs 力（尽力）→ 看语境要「严格执行」还是「尽力去做」；再配搭配对象", "hot": 0}]}, {"id": "gk-2026-zf-q38", "stem": "2024年，我国脱贫县农民人均可支配收入增幅高于全国平均水平，脱贫人口务工就业规模保持稳中有增。2025年是巩固拓展脱贫攻坚成果同乡村振兴有效衔接5年过渡期的最后一年，越是这个时候，越要扛稳责任，________，做好监测帮扶工作。填入画横线部分最恰当的一项是：", "options": ["步步为营", "行稳致远", "慎终如始", "绵绵用力"], "answer": 2, "neg": 0, "steps": ["根据横线前“2025 年是巩固拓展脱贫攻坚成果同乡村振兴有效衔接5 年过渡期的最后 一年，越是这个时候，越要扛稳责任”及横线后“做好监测帮扶工作”可知，横线处所填 词语意在表达在最后阶段要“扛稳”责任、“做好”工作，强调最后阶段应与初始阶段保 持一致的工作态度。", "C 项“慎终如始”指谨慎到最后，也像开始时一样，形容始终如一地 谨慎从事，符合文意，当选。A 项，“步步为营”指军队前进一步就设下一道营垒，形容行动谨慎，做事考虑周密，强 调做事注重规划与落实，与文意不符，排除； B 项，“行稳致远”指若想走得远，必须首先走得稳，强调兼顾当下的稳妥与长远的目标， 而文段重在强调守住现有成果，并非强调长远发展，与文意不符，排除； D 项，“绵绵用力”指连续不断地，长久坚持做某事，强调的是持续努力，与文意不符， 排除。", "故正确答案为C。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "逻辑填空 · 总步骤", "f": "<p>任何逻辑填空题<\/p>① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② <b class=\"hl\">找逻辑：借上下文、关联词、标点判定关系<\/b><br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "hot": 1}, {"t": "选项辨析 · 拆异字", "f": "<p>四个词长得像（厉行/力行）<\/p><b class=\"hl\"><b>把相同字去掉<\/b>，只辨异字<\/b>：厉（严格）vs 力（尽力）→ 看语境要「严格执行」还是「尽力去做」；再配搭配对象", "hot": 0}]}]}, {"gid": "lcs", "title": "逻辑填空 · 实词搭配", "tag": "与成语题同一套动作", "think": "实词题比成语题更看「搭配」和「语体」：先定这个空的主语是谁、动作指向谁，再排除搭配不成立的项。", "rules": [{"t": "逻辑填空 · 总步骤", "f": "① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② 找逻辑：借上下文、关联词、标点判定关系<br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "when": "任何逻辑填空题"}, {"t": "选项辨析 · 常见易混组", "f": "蔓延（火/疫病扩散，贬）vs 漫延（水漫开）；防止（事前）vs 防范（对象更笼统）vs 提防（防人）<br>不容置疑（结论无争议）vs 不容置喙（不许插嘴）；骇人听闻（事真可怕）vs 耸人听闻（故意夸大）", "when": "遇到形近音近词"}, {"t": "轻重 · 定程度", "f": "① 贴合语境尺度：看修饰词、限定词，语力度要匹配，不夸大不弱化<br>② 递进关系：前轻后重<br>③ 日常事理：过激过重、微弱过轻都排除", "when": "两个近义词只差程度"}, {"t": "语言风格 · 政论/官样文风", "f": "特征：正式、严谨、宏大叙事<br>高频词：推进、构建、彰显、倒逼、审慎、亟待、统筹、协同、夯实、引领<br>多用并列/递进/对策句", "when": "文段像政府报告、政策评论"}, {"t": "填空顺序 · 先易后难", "f": "先做<b>提示信息最明确<\/b>的那一空（常有原词复现/解释句），用一空定两三个选项，再用另一空二选一 —— 别按顺序硬啃", "when": "一空四选项都难辨"}], "main": [{"id": "zj-2015-A-q24", "stem": "求学者如果孜孜于衣食居住的安适，一定谈不上好学。同样，好学的目的也不是为了________，心灵之养<br>甚于居养之安。学习的目的是成为“有道”之人，名闻利养并非先务。这不是________物质，而是强调学习就<br>是学习，不要附带上物质目的。<br>依次填入划横线部分最恰当的一项是：", "options": ["养尊处优、否定", "丰衣足食、摈斥", "锦衣玉食、排斥", "肥马轻裘、抵触"], "answer": 2, "neg": 0, "steps": ["第一步，分析第一空。根据“衣食居住的安适”可知，该空要体现“衣食居住的安适与优越”之意。A 项“养 尊处优”多用于描写性情骄纵、不能吃苦的人，与文意不符，排除 A 项。B 项“丰衣足食”意为穿的吃的都很 丰富充足，侧重强调生活达到温饱水平线以上，并没有达到文段中“衣食居住的安适与优越”的程度，故排除 B 项。", "第二步，分析第二空。根据“不是……而是……不要附带上物质目的”可知，该空要体现“反对、不要”之意， 且跟“物质”搭配。C 项“排斥”指排挤斥逐，符合语境。D 项“抵触”指撞击、顶撞或触犯、冒犯，一般跟情 绪、心理、人搭配，不与“物质”搭配，排除 D 项。 因此，选择 C 选项。 拓展 锦衣玉食：精美的衣食，形容豪华奢侈的生活。肥马轻裘：骑肥壮的马，穿轻暖的皮衣，形容阔绰。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "逻辑填空 · 总步骤", "f": "<p>任何逻辑填空题<\/p>① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② <b class=\"hl\">找逻辑：借上下文、关联词、标点判定关系<\/b><br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "hot": 1}, {"t": "选项辨析 · 常见易混组", "f": "<p>遇到形近音近词<\/p><b class=\"hl\">蔓延（火/疫病扩散<\/b>，贬）vs 漫延（水漫开）；防止（事前）vs 防范（对象更笼统）vs 提防（防人）<br>不容置疑（结论无争议）vs 不容置喙（不许插嘴）；骇人听闻（事真可怕）vs 耸人听闻（故意夸大）", "hot": 0}]}, {"id": "zj-2015-A-q27", "stem": "中国改革已进入攻坚期和深水区，需要解决的问题格外艰巨，都是难啃的硬骨头。这个时候就要一鼓作气，<br>________、畏葸不前不仅不能前进，而且可能________。<br>依次填入划横线部分最恰当的一项是:", "options": ["优柔寡断、半途而废", "三心二意、功败垂成", "迟疑不决、功亏一篑", "瞻前顾后、前功尽弃"], "answer": 3, "neg": 0, "steps": ["第一步，突破口在第二空。根据“不仅不能前进，而且……”可知，该空比“不前进”语义要重，即体现“后 退”之意，也就是过去取得的成就没有了。A 项“半途而废”比喻事情没做完就停止，不能善始善终，侧重主 观上放弃，并没有体现“过去取得的成就没有了”，排除 A 项。B 项“功亏一篑”和 C 项“功败垂成”均侧重 快成功的时候却遭到了失败，文段并没有提及“中国改革要成功了”，不符合语境，排除 B 项和 C 项。D 项“前 功尽弃”指以前的努力完全白费，符合“改革进入攻坚期和深水区”的语境。答案锁定 D 选项。", "第二步，验证第一空。根据空后“、”可知，该空与“畏葸不前”语义相近，“畏葸不前”指畏惧退缩，不敢 前进。D 项“瞻前顾后”形容顾虑过多，犹豫不决，可以与“畏葸不前”构成并列关系。 因此，选择 D 选项。 拓展 优柔寡断：做事犹豫，缺乏决断。三心二意：指做事不专心。迟疑不决：形容拿不定主意。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "逻辑填空 · 总步骤", "f": "<p>任何逻辑填空题<\/p>① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② <b class=\"hl\">找逻辑：借上下文、关联词、标点判定关系<\/b><br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "hot": 1}, {"t": "选项辨析 · 常见易混组", "f": "<p>遇到形近音近词<\/p><b class=\"hl\">蔓延（火/疫病扩散<\/b>，贬）vs 漫延（水漫开）；防止（事前）vs 防范（对象更笼统）vs 提防（防人）<br>不容置疑（结论无争议）vs 不容置喙（不许插嘴）；骇人听闻（事真可怕）vs 耸人听闻（故意夸大）", "hot": 0}]}, {"id": "zj-2015-A-q32", "stem": "在如今浅阅读盛行的时代，一边是快餐式、碎片式阅读的轻松，一边是慢读、细读的沉重，经典自然免不<br>了有点________的味道。就阅读是一种学习、一种对自我的提升而言，浅阅读并不是真正的阅读，长久沉浸在<br>浅阅读的习惯之中，也只会让人离那些最好的书籍愈来愈远。然而，只是________对经典的珍重，却不如对于<br>经典真实的理解更为重要。<br>依次填入划横线部分最恰当的一项是:", "options": ["阳春白雪、提倡", "曲高和寡、呼唤", "孤芳自赏、强调", "凄风苦雨、苛求"], "answer": 1, "neg": 0, "steps": ["第一步，分析第一空。根据“在如今浅阅读盛行的时代”可知，阅读经典的人比较少。A 项“阳春白雪”泛指 高深的、不通俗的文学艺术，不作定语，排除 A 项。B 项“曲高和寡”指言论或作品意思高深，人们不容易理 解和接受，符合文意。C 项“孤芳自赏”比喻自命清高、自我欣赏，往往修饰人，不能修饰“经典”，排除 C 项。D 项“凄风苦雨”比喻境遇悲惨凄凉，不符合文意，排除 D 项。答案锁定 B 选项。", "第二步，验证第二空。根据“却不如对于经典真实的理解更为重要”可知，作者强调应从实践层面去“理解经 典”。故该空应与“从实践层面去理解”相对应，即体现“只是在口头上或意识层面上强调珍重经典”的含义。 “呼唤”有口头强调的意思，“呼唤对经典的珍重”指在口头上叫人们来重视经典，符合文意。 因此，选择 B 选项。 拓展 提倡：指鼓励大家使用或实行。强调：特别着重或着重提出。苛求：过严地要求。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "逻辑填空 · 总步骤", "f": "<p>任何逻辑填空题<\/p>① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② <b class=\"hl\">找逻辑：借上下文、关联词、标点判定关系<\/b><br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "hot": 1}, {"t": "选项辨析 · 常见易混组", "f": "<p>遇到形近音近词<\/p><b class=\"hl\">蔓延（火/疫病扩散<\/b>，贬）vs 漫延（水漫开）；防止（事前）vs 防范（对象更笼统）vs 提防（防人）<br>不容置疑（结论无争议）vs 不容置喙（不许插嘴）；骇人听闻（事真可怕）vs 耸人听闻（故意夸大）", "hot": 0}]}, {"id": "zj-2015-A-q33", "stem": "一个国家的文学能在世界范围内引起关注，必然是因为其________的特质。这种特质包含两个向度的价值，<br>一是基于民族文化________的优秀特性，二是给出开放性意义的体系。<br>依次填入划横线部分最恰当的一项是:", "options": ["不可替代、禀赋", "难以复制、禀性", "无与伦比、传统", "独一无二、渊源"], "answer": 0, "neg": 0, "steps": ["第一步，分析第一空。该空搭配“特质”，“特质”指特有的性质或品质。A 项“不可替代”指某人或某物是 不能够用他人或他物来进行代替的；B 项“难以复制”指不容易被复制；D 项“独一无二”指没有相同的，没有 可以相比的。三者均可体现“特有性”，与“特质”搭配得当，符合文意。C 项“无与伦比”强调事物完美， 不能体现“特有性”，不符合文意，排除 C 项。", "第二步，分析第二空。该空搭配“民族文化”和“特性”，“特性”指某人或某事物所特有的性质。A 项“禀 赋”强调先天条件不同于其他，可搭配“民族文化”且可与“特性”相对应，符合文意。B 项“禀性”侧重强 调人的性格，与“民族文化”搭配不当，排除 B 项。D 项“渊源”指事物产生的本源，不能与“特性”对应， 排除 D 项。 因此，选择 A 选项。 获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 8 - 拓展 传统：①世代相传、具有特点的社会因素，如文化、道德、思想、制度等；②世代相传或相沿已久并具有特点 的；③守旧；保守。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "逻辑填空 · 总步骤", "f": "<p>任何逻辑填空题<\/p>① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② <b class=\"hl\">找逻辑：借上下文、关联词、标点判定关系<\/b><br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "hot": 1}, {"t": "选项辨析 · 常见易混组", "f": "<p>遇到形近音近词<\/p><b class=\"hl\">蔓延（火/疫病扩散<\/b>，贬）vs 漫延（水漫开）；防止（事前）vs 防范（对象更笼统）vs 提防（防人）<br>不容置疑（结论无争议）vs 不容置喙（不许插嘴）；骇人听闻（事真可怕）vs 耸人听闻（故意夸大）", "hot": 0}]}], "extra": [{"id": "gk-2026-zf-q39", "stem": "通用人工智能对重大情报的挖掘和精确预测，确实能够提高情报准确性，有利于减少误判；但有时也可能会使人类盲目自信，刺激其________，通用人工智能带来的进攻优势，导致最佳防御战略就是“________”，这会打破进攻与防御的平衡，引发新型安全困境，反而增加了战争爆发的风险。依次填入画横线部分最恰当的一项是：", "options": ["孤注一掷、避实击虚", "轻举妄动、以攻为守", "刚愎自用、攻其不备", "铤而走险、先发制人"], "answer": 3, "neg": 0, "steps": ["第一空，根据“通用人工智能······可能会使人类盲目自信”可知，横线处所填 成语应表达人类因盲目自信而导致的行为。A 项“孤注一掷”比喻在危急时用尽所有力量 作最后一次冒险，D 项“铤而走险”指在无路可走的时候采取冒险行动，均符合文意，保 留。", "B 项“轻举妄动”指不经慎重考虑，轻率地采取行动，侧重草率行动，没有体现盲目 自信，排除；C 项“刚愎自用”指十分固执自信，不考虑别人的意见，侧重固执己见，多 形容人的性格，无法与后文的“行为”构成对应，不符合文意，排除。", "第二空，根据“通用人工智能带来的进攻优势”以及“这会打破进攻与防御的平衡，引发 新型安全困境，反而增加了战争爆发的风险”可知，横线处所填成语应体现采取“进攻” 手段，可能挑起战争之意。", "D 项“先发制人”指争取主动，先动手来制服对方，符合文意， 当选。A 项“避实击虚”指避开敌人的主力，找敌人的弱点进攻，侧重攻击对方弱点，未 体现主动挑起战争之意，不符合文意，排除。", "故正确答案为D。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "逻辑填空 · 总步骤", "f": "<p>任何逻辑填空题<\/p>① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② <b class=\"hl\">找逻辑：借上下文、关联词、标点判定关系<\/b><br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "hot": 1}, {"t": "选项辨析 · 常见易混组", "f": "<p>遇到形近音近词<\/p><b class=\"hl\">蔓延（火/疫病扩散<\/b>，贬）vs 漫延（水漫开）；防止（事前）vs 防范（对象更笼统）vs 提防（防人）<br>不容置疑（结论无争议）vs 不容置喙（不许插嘴）；骇人听闻（事真可怕）vs 耸人听闻（故意夸大）", "hot": 0}]}, {"id": "gk-2026-zf-q40", "stem": "面对技术突破催生的新产品和新服务，市场响应往往具有________。在层出不穷的技术供给面前，市场选择是审慎、挑剔的，具有一定的随机性。对于一些技术虽然先进，但应用前景不明朗、难以迅速形成现金流的企业，市场通常会选择放弃。从这个角度看，瞪羚企业、独角兽企业都是经受住市场________的胜出者。依次填入画横线部分最恰当的一项是：", "options": ["滞后性、大浪淘沙", "差异性、精挑细选", "被动性、优胜劣汰", "模糊性、千锤百炼"], "answer": 0, "neg": 0, "steps": ["第一空，根据“在层出不穷的技术供给面前，市场选择是审慎、挑剔的”可知，横线处 所填词语应体现市场对新产品和新服务的响应并不是快速的。A 项“滞后性”指某个过程 或现象发生后，才对之前的状况作出反应或调整，符合文意，保留。", "B 项“差异性”指不 同对象之间有差别，C 项“被动性”指受外力推动才行动，D 项“模糊性”指不清晰，文段 强调市场对新产品和新服务并非立即跟随，均与文意不符，排除。第二空，代入验证，根据“应用前景不明朗、难以迅速形成现金流的企业，市场通常会选 择放弃”可知，横线处成语应表达瞪羚企业、独角兽企业经受住了市场的考验和筛选，A 项“大浪淘沙”比喻在激烈的斗争中经受考验、筛选，符合文意，当选。", "故正确答案为A。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "逻辑填空 · 总步骤", "f": "<p>任何逻辑填空题<\/p>① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② <b class=\"hl\">找逻辑：借上下文、关联词、标点判定关系<\/b><br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "hot": 1}, {"t": "选项辨析 · 常见易混组", "f": "<p>遇到形近音近词<\/p><b class=\"hl\">蔓延（火/疫病扩散<\/b>，贬）vs 漫延（水漫开）；防止（事前）vs 防范（对象更笼统）vs 提防（防人）<br>不容置疑（结论无争议）vs 不容置喙（不许插嘴）；骇人听闻（事真可怕）vs 耸人听闻（故意夸大）", "hot": 0}]}, {"id": "gk-2026-zf-q41", "stem": "把握好动静之度，是解决问题的关键。过度求静易陷入消极懈怠、________的泥潭。在面对新问题时，往往会因为害怕承担责任或者担心打破现有秩序，一味地观望等待，致使问题越积越多。相反，情况不明时过于求动会让很多事情变得杂乱无章，往往________。依次填入画横线部分最恰当的一项是：", "options": ["安于现状、分身乏术", "固步自封、事与愿违", "裹足不前、措手不及", "自暴自弃、适得其反"], "answer": 1, "neg": 0, "steps": ["第一空，根据“、”可知，横线处和“消极懈怠”构成并列，且根据“往往会因为害怕 承担责任或者担心打破现有秩序，一味地观望等待”可知，横线处应体现因过度求静而停 滞不前之意，A 项“安于现状”指对当前状况习惯而不愿改变，B 项“固步自封”比喻守着 老一套，不求进步，C 项“裹足不前”比喻有所顾忌，不愿去做，均符合文意，保留。", "D 项 “自暴自弃”指自己瞧不起自己，甘于落后或堕落，侧重于自我放弃，与文意不符，排除。第二空，根据“情况不明时过于求动会让很多事情变得杂乱无章”可知，横线处应体现过 于求动会带来不利结果，达不到预期之意，B 项“事与愿违”指事情的发展跟主观愿望相 反，符合文意，当选。", "A 项“分身乏术”形容非常繁忙，无法兼顾他事，文段并非表达事 务的繁忙，而是强调处理事情做法不当而带来的消极结果，与文意不符，排除；C 项“措 手不及”形容事出意外或太突然，来不及应付处理，文段并非表达事出突然，而是强调情 况不明时过于求动会让事情变糟，与文意不符，排除。", "故正确答案为B。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "逻辑填空 · 总步骤", "f": "<p>任何逻辑填空题<\/p>① 通读文段，把握<b>行文风格、感情色彩、语义轻重<\/b><br>② <b class=\"hl\">找逻辑：借上下文、关联词、标点判定关系<\/b><br>③ 辨析词义：语义侧重、褒贬、轻重、搭配、用法", "hot": 1}, {"t": "选项辨析 · 常见易混组", "f": "<p>遇到形近音近词<\/p><b class=\"hl\">蔓延（火/疫病扩散<\/b>，贬）vs 漫延（水漫开）；防止（事前）vs 防范（对象更笼统）vs 提防（防人）<br>不容置疑（结论无争议）vs 不容置喙（不许插嘴）；骇人听闻（事真可怕）vs 耸人听闻（故意夸大）", "hot": 0}]}]}, {"gid": "ppz", "title": "片段阅读 · 中心理解", "tag": "主旨/意在说明/关键词", "think": "先判结构（总-分、分-总、转折、并列、问题+对策），据此锁定<b>关键句<\/b>，再提炼<b>主题词<\/b>；不含主题词的选项直接排除。", "rules": [{"t": "中心理解 · 做题两步", "f": "第一步：从文段里<b>锁定关键句<\/b><br>第二步：从关键句提炼<b>主题词<\/b> —— 正确选项必须含主题词，不含的直接排除", "when": "问「意在说明 / 主要 / 主旨 / 关键词」"}, {"t": "找关键句 · 五条优先级", "f": "① 有对策句 → 对策最关键<br>② 没对策 → 褒贬词句为重<br>③ 情感色彩相异 → <b>后置语句优先<\/b><br>④ 全是中性陈述 → 统筹整体研判<br>⑤ 分句并列 → 综合全局，不能只取一半", "when": "读不懂哪句最重要时"}, {"t": "文段结构 · 总-分", "f": "主旨＝首句；后面全是支撑，选项若只覆盖某个例子 → 以偏概全", "when": "首句概括、后面举例或展开"}, {"t": "文段结构 · 转折", "f": "转折之后是重点；<b>转折前的内容是陷阱<\/b>，尤其「很多人认为…」后面必反", "when": "出现「但是 / 然而 / 其实 / 事实上」"}, {"t": "文段结构 · 并列", "f": "并列要<b>全面概括<\/b>；只答一半的选项错，正确答案往往有「都 / 均 / 共同 / 各自」这类总括词", "when": "出现「同时 / 此外 / 一方面…另一方面」"}, {"t": "文段结构 · 问题 + 对策", "f": "主旨落在对策上；如果只有问题没对策，主旨才是「指出问题/危害」", "when": "前面摆问题，后面给办法"}, {"t": "四类干扰项（片段通用）", "f": "① <b>偷换概念<\/b>（主语/范围被换）② <b>以偏概全<\/b>（只覆盖一个例子）③ <b>无中生有<\/b>（原文没有）④ <b>过度推断<\/b>（推出原文没有的态度/建议）", "when": "两个选项都像主旨"}], "main": [{"id": "zj-2015-A-q39", "stem": "“商业信誉”无疑指向的就是“信用”和“名誉”。它是指社会公众对具体商业主体的经济能力、信用状<br>况等所给予的社会评价。在刑法上，并不是所有“损害”商业信誉的行为都将构成犯罪。如该商业主体自身存<br>在问题，经媒体曝光后信用大跌、名誉扫地，这种损害实则是由主体自身的问题所带来的。而媒体行使舆论监<br>督权并无违法，反而应该得到法律的保护。<br>这段文字意在强调:", "options": ["媒体曝光商家不守商业信誉的行为不违法", "商家自身问题造成信誉损害不受法律保护", "法律对损害商业信誉行为的认定十分审慎", "应出台法律保护媒体对商家进行舆论监督"], "answer": 0, "neg": 0, "steps": ["第一步，分析文段。文段先讲“商业信誉”的含义，然后提出“并不是所有‘损害’商业信誉的行为都将构成 犯罪”，之后进一步说明商家自身问题造成信誉损害就不受法律保护，最后强调媒体曝光不违法,应得到法律保 获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 9 - 护。文段结构为“分—总”，主要讲的是媒体曝光商家不守商业信誉的行为不违法。", "第二步，对比选项。A 项是对文段主旨的同义替换，符合文段意图。 因此，选择 A 选项。 拓展 B 项：缺少核心话题词“媒体”。C 项：法律对于损害商业信誉行为的认定问题文段并没有提到，属于无中生有。 D 项：表述错误，根据文段可知已经有法律保护媒体，而不需要再“出台法律”。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "文段结构 · 问题 + 对策", "f": "<p>前面摆问题，后面给办法<\/p>主旨落在<b class=\"hl\">对策<\/b>上；如果只有问题没对策，主旨才是「指出问题/危害」", "hot": 1}, {"t": "找关键句 · 五条优先级", "f": "<p>读不懂哪句最重要时<\/p>① 有<b class=\"hl\">对策句<\/b> → 对策最关键<br>② 没对策 → 褒贬词句为重<br>③ 情感色彩相异 → <b>后置语句优先<\/b><br>④ 全是中性陈述 → 统筹整体研判<br>⑤ 分句并列 → 综合全局，不能只取一半", "hot": 0}]}, {"id": "zj-2015-A-q46", "stem": "近年来，我国中小学音乐课程在许多地区还是没有受到足够的重视，教材内容不能与时俱进，一些音乐教<br>师只注重技能培养而忽略了音乐教育的主旨首先应当是“树德立志”。在教授学生一部音乐作品之前，教师首<br>先应该理解其中所表现的道德思想，然后以多样化的形式对学生的身心进行正面教育。作为音乐教师当以此为<br>己任，使孩子们真正热爱音乐，在他们的心灵中种下一颗真、善、美的健康种子。<br>这段文字意在强调:", "options": ["音乐教育应注重作品的道德教化", "教师应以培养孩子真善美为己任", "音乐教育以强调树德立志为主旨", "音乐教育的内容、主旨都需转变"], "answer": 0, "neg": 0, "steps": ["第一步，分析文段。文段首先指出“近年来，我国中小学音乐教育存在的问题”，即“……忽略了音乐教育的 主旨首先应当是‘树德立志’”，之后提出如何解决现存的问题，即“教师首先应该理解其中所表现的道德思 想……作为音乐教师当以此为己任……”。文段是“提出问题—解决问题”的结构，对策是重点，即教师在音 乐教学中首先应理解作品所表现的道德思想，再对学生的身心进行正面教育。", "第二步，对比选项。A 项是对策的同义替换。 因此，选择 A 选项。 拓展 B 项：话题不一致，缺少核心话题“音乐教育”。C 项：只说到音乐教育的主旨是什么，未提及怎样去做，非对 策。D 项：“主旨需改变”表述不正确。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "文段结构 · 问题 + 对策", "f": "<p>前面摆问题，后面给办法<\/p>主旨落在<b class=\"hl\">对策<\/b>上；如果只有问题没对策，主旨才是「指出问题/危害」", "hot": 1}, {"t": "找关键句 · 五条优先级", "f": "<p>读不懂哪句最重要时<\/p>① 有<b class=\"hl\">对策句<\/b> → 对策最关键<br>② 没对策 → 褒贬词句为重<br>③ 情感色彩相异 → <b>后置语句优先<\/b><br>④ 全是中性陈述 → 统筹整体研判<br>⑤ 分句并列 → 综合全局，不能只取一半", "hot": 0}]}, {"id": "zj-2016-A-q36", "stem": "秦汉四百年间，政治与文化相互推动，形成互补机制，其效应是：统一被认为是合理的、正常的，分裂则<br>被认为是违理的、反常的。秦汉文化造成的这一定势，深刻地影响了此后两千年的中国历史。国家统一，使多<br>元文化整合的速度与力度加强；而整合后的一统文化，具有强大的凝聚力和向心力，又反过来强化了政治一统。<br>这段文字意在强调：", "options": ["政治与文化存在紧密联系", "秦汉文化对于后世影响深远", "中国文化具有强大的向心力", "国家统一的前提是文化的一统整合"], "answer": 1, "neg": 0, "steps": ["第一步，分析文段。第二句话“秦汉文化造成的这一定势，深刻地影响了此后两千年的中国历史”，起了承上 启下的作用。其中的“这一定势”是对前文的概括，而具体怎样影响了以后的中国历史，第三句话进一步阐述， 即国家统一加强了文化的整合，反过来文化的整合又强化了政治统一即国家统一。可以判断整个文段是“分— 总—分”的行文结构，第二句是重点，因此作者的意图应该是强调秦汉文化的重大影响。", "第二步，对比选项。B 项“秦汉文化对于后世影响深远”符合作者意图。 因此，选择B 选项。 拓展 A 项：“政治与文化存在紧密联系”，是根据最后一句话得出的，尾句是解释说明，并非重点句，另外A 项没 有提到“秦汉文化”这个话题。C 项：“中国文化具有强大的向心力”，文段论述的话题并非“中国文化”， 而是“秦汉文化”。D 项：“国家统一的前提是文化的一统整合”，是文段后面解释部分内容，不是重点。"], "judge": "", "has_img": false, "paper": "zj-2016-A", "rules": [{"t": "文段结构 · 问题 + 对策", "f": "<p>前面摆问题，后面给办法<\/p>主旨落在<b class=\"hl\">对策<\/b>上；如果只有问题没对策，主旨才是「指出问题/危害」", "hot": 1}, {"t": "找关键句 · 五条优先级", "f": "<p>读不懂哪句最重要时<\/p>① 有<b class=\"hl\">对策句<\/b> → 对策最关键<br>② 没对策 → 褒贬词句为重<br>③ 情感色彩相异 → <b>后置语句优先<\/b><br>④ 全是中性陈述 → 统筹整体研判<br>⑤ 分句并列 → 综合全局，不能只取一半", "hot": 0}]}, {"id": "zj-2016-A-q38", "stem": "汪曾祺曾说，语言不是外部的东西，它是和内在的思想同时存在，不可剥离的。在他看来写小说就是写语<br>言，语文课学的是语言，但语言不是空壳，而是要承载各种各样的思想、哲学、伦理、道德的。怎么做人，如<br>何对待父母兄弟姐妹，如何对待朋友，如何对待民族、国家和自己的劳动等，这些在语文课里是与语言并存的。<br>从这个意义来讲，语文教育必须吸收和继承传统文化，而诗歌无疑是传统文化的集大成者。<br>这段文字意在说明：", "options": ["诗歌中包含丰富的思想、伦理和道德元素", "脱离内在思想的语文教育是空洞无物的", "必须重视诗歌在语文教育中的作用", "语文教育需要和思想品德教育同步进行"], "answer": 2, "neg": 0, "steps": ["第一步，分析文段。第一句话援引汪曾祺的观点，“语言不是外部的东西，它是和内在的思想同时存在”。第 二、三句话都是在解释这个观点。最后一句话得出结论“语文教育必须吸收和继承传统文化，而诗歌无疑是传 统文化的集大成者”。文段结构是“分—总”结构，最后一句是主旨句，即强调诗歌对语文教育的重要性。", "第二步，对比选项。C 项是对文段主旨句的同义替换，符合文段意图。 因此，选择C 选项。 获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 10 - 拓展 A 项：为解释汪曾祺观点的内容，非重点部分。B 项：未突出主体词“诗歌”的作用。D 项：“思想品德教育” 在文段未涉及，无中生有。"], "judge": "", "has_img": false, "paper": "zj-2016-A", "rules": [{"t": "文段结构 · 并列", "f": "<p>出现「同时 / 此外 / 一方面…另一方面」<\/p><b class=\"hl\">并列<\/b>要<b>全面概括<\/b>；只答一半的选项错，正确答案往往有「都 / 均 / 共同 / 各自」这类总括词", "hot": 1}, {"t": "中心理解 · 做题两步", "f": "<p>问「意在说明 / 主要 / 主旨 / 关键词」<\/p><b class=\"hl\">第一步：从文段里<b>锁定关键句<\/b><\/b><br>第二步：从关键句提炼<b>主题词<\/b> —— 正确选项必须含主题词，不含的直接排除", "hot": 0}]}], "extra": [{"id": "gk-2026-zf-q52", "stem": "生态保护修复工程的人工修复工程投资和建设周期一般为3到5年，而高寒地区生态群落完成自然演替往往需要几十年乃至更长的时间。以拉萨河流域山水林田湖草生态保护修复试点工程为例，在工程验收时植被覆盖度显著增加，但群落自然演替尚未完成，生态系统的稳定性仍然较低。由于现有生态修复工程的相关投资多用于工程实施周期内，工程周期结束后大多依靠高寒生态系统自然恢复，在管护力度不足的情况下，生态系统容易发生再次退化，威胁生态修复工程效益的长期可持续性。这段文字意在说明，高寒地区生态系统修复工程要：", "options": ["保障后期管护与可持续性", "充分发挥系统的内在恢复能力", "科学规划投资和建设周期", "强调验收流程的规范性与科学性"], "answer": 0, "neg": 0, "steps": ["文段开篇指出生态保护修复工程的人工修复周期较短，而高寒地区生态群落的自然演替 需要几十年甚至更长时间，二者存在明显的时间差。接着以拉萨河流域生态保护修复试点 工程为例，以工程验收时生态系统仍不稳定详细阐述首句体现的这种时间差。", "随后进一步 指出，现有工程投资多用于施工期，后期若管护不足易导致退化，威胁长期效益。因此， 文段通过层层铺垫，最终落脚于工程周期结束后因管护不足导致的退化风险，意在强调高 寒地区生态修复工程必须重视后期管护，以保障长期可持续性，对应A 项。", "B 项，“充分发挥系统的内在恢复能力”与文意相悖，文段指出仅依靠生态系统自然恢复 容易导致再次退化，因此需要加强人工管护，而非仅依赖系统内在恢复能力，排除； C 项，“科学规划投资和建设周期”偏离文段重点，文段强调工程结束后的管护问题，而 非前期规划，排除； D 项，“强调验收流程的规范性与科学性”文段未提及，属于无中生有，排除。", "故正确答案为A。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "文段结构 · 问题 + 对策", "f": "<p>前面摆问题，后面给办法<\/p>主旨落在<b class=\"hl\">对策<\/b>上；如果只有问题没对策，主旨才是「指出问题/危害」", "hot": 1}, {"t": "找关键句 · 五条优先级", "f": "<p>读不懂哪句最重要时<\/p>① 有<b class=\"hl\">对策句<\/b> → 对策最关键<br>② 没对策 → 褒贬词句为重<br>③ 情感色彩相异 → <b>后置语句优先<\/b><br>④ 全是中性陈述 → 统筹整体研判<br>⑤ 分句并列 → 综合全局，不能只取一半", "hot": 0}]}, {"id": "gk-2026-zf-q54", "stem": "随着人工智能时代的到来，“未来人”和“远方的陌生人”问题逐渐进入人类的伦理视界。传统伦理学是“近的伦理学”，强调人与人之间的直接交往，行为双方是熟悉的、共同在场的，道德时空是近距离的。科技深度介入使人类的道德空间和行为性质发生改变，一些新的对象（如人工智能）逐渐进入我们为之负责和道德关切的领域。人工智能作为新科技，给人类的伦理世界和道德空间带来了深刻变革，它以虚拟化和拟人化的方式与人类建立了新的交往关系，伦理关系从“人与人”“人与动物”“人与自然”扩展到“人与人工智能”。这段文字接下来最可能介绍：", "options": ["未来人工智能技术的发展趋势", "人工智能时代人际交往模式的新变化", "影响人类道德空间的技术因素", "人工智能带来的伦理挑战和道德困境"], "answer": 3, "neg": 0, "steps": ["文段开篇介绍在人工智能时代的大背景下，一些问题进入伦理视界，接着指出传统伦理 学是近距离的、熟悉的直接交往，科技的深度介入使人工智能逐渐进入到我们为之负责和 道德关切的领域。最后强调人工智能给人类的伦理世界和道德空间带来深刻变革，伦理关 系从原来的“人与人”“人与动物”“人与自然”扩展到“人与人工智能”。", "故文段最后 介绍的是人工智能给伦理世界和道德空间带来变革，接下来应继续围绕这一话题展开，对 应D 项。A、C 两项，均仅提及“人工智能”，未提及“伦理和道德”，偏离文段最后谈论的核心话 题，衔接不当，排除； B 项，“技术因素”范围扩大，且未提及“伦理和道德”，偏离文段最后谈论的核心话题， 衔接不当，排除。", "故正确答案为D。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "中心理解 · 做题两步", "f": "<p>问「意在说明 / 主要 / 主旨 / 关键词」<\/p><b class=\"hl\">第一步：从文段里<b>锁定关键句<\/b><\/b><br>第二步：从关键句提炼<b>主题词<\/b> —— 正确选项必须含主题词，不含的直接排除", "hot": 1}, {"t": "四类干扰项（片段通用）", "f": "<p>两个选项都像主旨<\/p>① <b>偷换概念<\/b>（主语/范围被换）② <b>以偏概全<\/b>（只覆盖一个例子）③ <b>无中生有<\/b>（原文没有）④ <b>过度推断<\/b>（推出原文没有的态度/建议）", "hot": 0}]}, {"id": "gk-2026-zf-q55", "stem": "随着我国城镇化率逐步提高，城市已经成为人口集聚的主要空间，要实现智慧城市的发展目标，必须紧跟新一代数字技术发展趋势，找准数字技术融入市域社会治理的“小切口”，促进两者深度融合，可建设区、街、社（村）三层结构的数智化基层治理平台，覆盖社区治理全域组织工作场景，有效破解基层治理“小马拉大车”的突出问题。通过建设数智化基层治理平台，加快实现市域社会管理手段、管理模式、管理理念创新、推动城市治理和运行从数字化到智能化再到智慧化的转型升级。最适合做这段文字标题的是：", "options": ["变“治理”为“智理”，提升城市智治水平", "从“数字”到“数智”，打造基层治理平台", "数字技术：提升基层治理的新手段", "基层治理：从末梢发力向智慧升级"], "answer": 0, "neg": 0, "steps": ["文段开篇交代背景，即我国城镇化率提高，城市成为人口集聚的主要空间。随后指出要 实现智慧城市发展目标，需紧跟新一代数字技术发展趋势，让数字技术与市域社会治理相 融合。后文给出明确对策，即建设区、街、社（村）三层结构的数智化基层治理平台。", "尾 句进一步强调，该平台可推动城市治理实现从数字化到智能化再到智慧化的转型升级。故 文段重点在对策部分，强调通过建设数智化基层治理平台可以实现城市治理的智慧化转型 升级，A 项精准概括了文段从“治理手段创新”到“智慧化升级”的核心脉络，其中“智 理”一词巧妙呼应“智慧治理”，形象贴切，契合主旨，当选。", "B 项，“打造基层治理平台”表述片面，文段的落脚点不仅仅是“打造平台”，而是通过 这个平台实现城市治理的智慧化转型升级，排除； C 项，“数字技术”表述不明确，未体现“数智化平台”与“城市治理智慧化”之间的关 系，排除； D 项，“基层治理”概念偷换，且未表明“数智化”，排除。", "故正确答案为A。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "文段结构 · 问题 + 对策", "f": "<p>前面摆问题，后面给办法<\/p>主旨落在<b class=\"hl\">对策<\/b>上；如果只有问题没对策，主旨才是「指出问题/危害」", "hot": 1}, {"t": "找关键句 · 五条优先级", "f": "<p>读不懂哪句最重要时<\/p>① 有<b class=\"hl\">对策句<\/b> → 对策最关键<br>② 没对策 → 褒贬词句为重<br>③ 情感色彩相异 → <b>后置语句优先<\/b><br>④ 全是中性陈述 → 统筹整体研判<br>⑤ 分句并列 → 综合全局，不能只取一半", "hot": 0}]}]}, {"gid": "ppx", "title": "片段阅读 · 细节与词句", "tag": "细节判断/词句理解/接语", "think": "细节题先把选项拆成「主语+动作+限定词」，再回原文定位比对；偷换一个限定词就是错的。", "rules": [{"t": "细节判断 · 看清问法", "f": "先勾出<b>否定词<\/b>；<b>未涉及<\/b>＝全文完全没提；<b>未解释<\/b>＝提到了但没讲缘由/含义/原理 —— 两者不是一回事", "when": "问「符合 / 不符合 / 理解正确 / 未涉及」"}, {"t": "细节判断 · 三步定位", "f": "① 抓选项里的<b>专有名词/数字/时间<\/b>回文定位<br>② 只读定位句前后一句<br>③ 逐字比对：偷换主语、换时间、换范围、换程度 四类改动必错", "when": "长文段细节题"}, {"t": "细节判断 · 无中生有四类", "f": "① 强加因果或比较（出现 比 / 更 / 越来越）② 夸大程度（取代 / 替代 / 彻底）③ 主观臆断（正比 / 决定）④ 四字选项的科普演变类描述，最容易凭空捏造", "when": "选项说得很顺但与原文对不上"}, {"t": "词句理解 · 就近原则", "f": "① 定位原文，锁定词句所在语境<br>② <b>就近<\/b>找指代或解释（前一句、后一句、冒号后）<br>③ 选项若把词拆开按字面解释 → 多半错", "when": "问「XX 一词指代的是 / 含义是」"}, {"t": "接语推断 · 抓尾句新话题", "f": "第一：锁定<b>尾句<\/b>；第二：答案必须含<b>尾句的主题词<\/b>；<b>不能选上文已经讲过的内容<\/b>（重复项是最大陷阱）", "when": "问「接下来最可能讲什么」"}], "main": [{"id": "zj-2015-A-q37", "stem": "随着计算机技术向着千万亿次乃至更高的级别迈进，处理器速度已经超越了传输速度，这就在应用领域产<br>生了一个技术瓶颈，阻碍了应用的进一步发展。任何尝试过拨号上网看流媒体视频的人都有所体会，再快的处<br>理器也不能提高文件加载速度。而在大数据和云计算的当今，在服务器之间有大量的信息进行交互。一种激光<br>器件——垂直腔面发射激光器，可以用来在光纤网络中高速传输数据。其相比传统电缆系统可以以更快的速度<br>传输更大的数据量。<br>下列说法与原文不符的是:", "options": ["计算机处理器与数据传输速度不成正比", "计算机处理器速度已不能满足应用需求", "数据高速传输技术长期未取得实质突破", "科学家在激光通讯技术上取得重要进展"], "answer": 1, "neg": 0, "steps": ["第一步，通读原文，将选项与原文一一对应。", "第二步，对比选项。A 项从“处理器速度已经超越了传输速度”可知，“处理器速度”与“数据传输速度”是 不成正比的，A 项符合文意。B 项对应原文的第一、二句，通过理解可知，是“计算机的传输技术不能满足现在 的技术发展”，B 项偷换概念，不符合文意。C 项从“处理器速度已经超越了传输速度，这就在应用领域产生了 一个技术瓶颈，阻碍了应用的进一步发展”可知 C 项符合文意。D 项从原文“在服务器之间有大量的信息进行 交互……可以用来在光纤网络中高速传输数据”可知，D 项表述符合文意。 因此，选择 B 选项。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "细节判断 · 三步定位", "f": "<p>长文段细节题<\/p>① 抓选项里的<b>专有名词/数字/时间<\/b>回文<b class=\"hl\">定位<\/b><br>② 只读定位句前后一句<br>③ 逐字比对：偷换主语、换时间、换范围、换程度 四类改动必错", "hot": 1}, {"t": "细节判断 · 无中生有四类", "f": "<p>选项说得很顺但与原文对不上<\/p>① 强加因果或比较（出现 比 / 更 / 越来越）② 夸大程度（取代 / 替代 / 彻底）③ 主观臆断（正比 / 决定）④ 四字选项的科普演变类描述，最容易凭空捏造", "hot": 0}]}, {"id": "zj-2015-A-q43", "stem": "相对于影响范围较小、较方便找到污染源头的水污染、噪音污染，大气污染的成因复杂，往往是跨地域的<br>工业污染、汽车排放乃至烹饪油烟等，再加上特定的天气因素共同造成了雾霾等灾害性天气。这就很难将某天<br>的雾霾归因于具体的哪个、哪几个企业的污染，那么受大气污染损害的公民该向谁索赔？又如何抗辩自身罹患<br>的疾病等是由大气污染造成，而不是其他原因造成的？如果公民真的起诉一长串的可能的污染企业，那么结果<br>就是众多污染企业摊薄了赔偿款，不能起到震慑污染企业的作用。<br>作者接下来最有可能讲述的是：", "options": ["介绍大气污染索赔的成功案例", "如何规制企业的大气污染行为", "进行大气污染索赔的法律依据", "进行大气污染索赔的现实困境"], "answer": 0, "neg": 0, "steps": ["第一步，快速浏览文段，重点分析尾句，判别文段话题落脚点。文段主要介绍目前进行大气污染索赔的现实困 境，尾句通过反面论证提出如果公民真的起诉一长串的可能的污染企业那是没有效果的，也就是说不应该这样 做。所以文段接下来最有可能衔接该话题讲述怎样索赔才是正确的做法。", "第二步，对比选项。A 项“介绍大气污染索赔的成功案例”与尾句话题相符。 因此，选择 A 选项。 拓展 B 项：“规制企业的大气污染行为”与尾句话题不一致，文段说的是“如何索赔”。C 项：“法律依据”文段未 提及，属于无中生有。D 项：“困境”为前文论述过的内容，下文不会再论述。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "接语推断 · 抓尾句新话题", "f": "<p>问「接下来最可能讲什么」<\/p>第一：锁定<b>尾句<\/b>；第二：答案必须含<b>尾句的主题词<\/b>；<b>不能选上文已经讲过的内容<\/b>（重复项是最大陷阱）", "hot": 1}, {"t": "细节判断 · 看清问法", "f": "<p>问「符合 / 不符合 / 理解正确 / 未涉及」<\/p>先勾出<b>否定词<\/b>；<b>未涉及<\/b>＝全文完全没提；<b>未解释<\/b>＝提到了但没讲缘由/含义/原理 —— 两者不是一回事", "hot": 0}]}, {"id": "zj-2016-A-q39", "stem": "当前，对于大部分消费者来说，智能化家居产品既熟悉又陌生，很多人的概念还停留在电动窗帘或别墅防<br>盗系统。从技术层面来说，一键控制、远程遥控、感应人体、自动开启这些电影里才出现的产品如今并非“高<br>科技”，但由于价格昂贵等原因，智能家居并未普及。<br>根据这段文字，以下说法正确的是：", "options": ["智能化已成为家居业未来的发展方向", "目前技术上实现智能家居已无屏障", "普及智能家居必须降低生产成本", "智能家居的概念模糊影响其普及程度"], "answer": 1, "neg": 0, "steps": ["第一步，分析文段，将选项与文段一一对应。", "第二步，辨析选项。A 项“已成为家居业未来的发展方向”文段并未提及，属于无中生有，不符合原文。B 项对 应“从技术层面来说，一键控制、远程遥控、感应人体、自动开启这些电影才出现的产品如今并非‘高科技’”， 由此可知目前在技术上已无障碍，可以实现智能家居，符合原文。C 项对应“由于价格昂贵等原因，智能家居 并未普及”，由此可知“价格昂贵”只是智能家居未普及的原因之一，不能由此断定，普及智能家居必须要降 低成本，同时“价格昂贵”也不能等同于“成本高”，属于曲解文意，不符合原文。D 项“概念模糊”文段并 未提及，也没有论述“概念模糊”与“普及程度”之间的关系，属于无中生有，不符合原文。 因此，选择B 选项。"], "judge": "", "has_img": false, "paper": "zj-2016-A", "rules": [{"t": "细节判断 · 三步定位", "f": "<p>长文段细节题<\/p>① 抓选项里的<b>专有名词/数字/时间<\/b>回文<b class=\"hl\">定位<\/b><br>② 只读定位句前后一句<br>③ 逐字比对：偷换主语、换时间、换范围、换程度 四类改动必错", "hot": 1}, {"t": "细节判断 · 无中生有四类", "f": "<p>选项说得很顺但与原文对不上<\/p>① 强加因果或比较（出现 比 / 更 / 越来越）② 夸大程度（取代 / 替代 / 彻底）③ 主观臆断（正比 / 决定）④ 四字选项的科普演变类描述，最容易凭空捏造", "hot": 0}]}, {"id": "zj-2016-A-q40", "stem": "由于冰河期消失、气候转暖，中石器时代的绘画由洞窟转移到露天岩壁。随着人们狩猎工具的进步，对大<br>自然征服力的增强，动物形象在绘画中逐渐减少并失去原始的野性，而人类活动开始成为绘画描绘的主要对象。<br>岩画主要分布在北欧和西班牙的拉文特地区。它们以人类狩猎为主要情节，以表现人物、动物的运动和速度为<br>特点，把运动中的形象表现成剪影效果或带状样式，以拉长的四肢和夸张的动作强调动势，表现狩猎场面中的<br>紧张和活力。构图具有浓厚的情节性和生活气息，但忽略细节刻画，用色单纯。<br>根据这段文字，关于中石器时代的岩画，以下说法正确的是：", "options": ["风格细腻而精致", "多表现动物野性", "表现了人类生活", "色彩鲜艳、丰富"], "answer": 2, "neg": 0, "steps": ["第一步，分析文段，将选项与文段一一对应。", "第二步，辨析选项。A 项对应文段结尾的“忽略细节刻画”，说明“风格细腻”不符合文意。B 项对应文段第二 句“动物形象在绘画中逐渐减少并失去原始的野性……”，“多表现动物野性”与之相矛盾，不符合文意。C 项对应“人类活动开始成为绘画描绘的主要对象”“以人类狩猎为主要情节”，这些说明中石器时代的岩画表 现了人类生活，符合文意。D 项对应文段最后一句“用色单纯”，“色彩鲜艳、丰富”与之相悖，不符合文意。 因此，选择C 选项。"], "judge": "", "has_img": false, "paper": "zj-2016-A", "rules": [{"t": "细节判断 · 三步定位", "f": "<p>长文段细节题<\/p>① 抓选项里的<b>专有名词/数字/时间<\/b>回文<b class=\"hl\">定位<\/b><br>② 只读定位句前后一句<br>③ 逐字比对：偷换主语、换时间、换范围、换程度 四类改动必错", "hot": 1}, {"t": "细节判断 · 无中生有四类", "f": "<p>选项说得很顺但与原文对不上<\/p>① 强加因果或比较（出现 比 / 更 / 越来越）② 夸大程度（取代 / 替代 / 彻底）③ 主观臆断（正比 / 决定）④ 四字选项的科普演变类描述，最容易凭空捏造", "hot": 0}]}], "extra": [{"id": "gk-2026-zf-q53", "stem": "条叶庭荠和四齿芥是沙漠中常见的两种短命植物，其新成熟种子具有生理休眠特性，传播后的种子能在夏季高温中通过后熟作用，进入非休眠状态，随后在秋季土壤湿度适宜时萌发。未能在秋季萌发的种子，则会在冬季重新休眠。在早春湿润的雪融期，部分种子通过低温层积作用再次结束休眠，在早春季节萌发。这种一年两次的休眠循环机制使其能在一年内形成两个不同的萌发幼苗群体。这种适应策略可能是植物长期适应荒漠降水和温度胁迫生境的一种“两头下注”策略，有助于它们在极端环境下的维持和繁衍。““两头下注”策略”指的是：", "options": ["一年中在不同季节发生两次休眠", "在休眠与非休眠状态间随机切换", "形成两个环境适应性不同的幼苗群体", "能同时应对降水和温度两种极端环境"], "answer": 2, "neg": 0, "steps": ["本题为词句理解题，“‘两头下注’策略”位于文段结尾，需结合前文内容进行理解。前文指出，条叶庭荠和四齿芥的种子在一年内通过秋季和早春两次萌发机会，形成两个不 同的萌发幼苗群体，这种机制是植物长期适应荒漠环境的一种策略，有助于在极端环境下 维持和繁衍。", "因此，“两头下注”策略指的是植物为应对环境不确定性，在不同季节安排 萌发，从而形成两个幼苗群体以增加生存几率的适应方式，对应C 项。A 项，“两次休眠”偏离重点，文段强调的是萌发时机的分化，而非休眠次数，排除； B 项，“随机切换”表述错误，休眠与萌发的转换是有条件的规律性过程，并非随机，排 除； D 项，“能同时应对降水和温度两种极端环境”更类似于这一策略所要达到的目的或效果， 不是对“‘两头下注’策略”的直接解释，并且文段中“‘两头下注’策略”是针对不同 季节的萌发机会分配，并非直接同时应对“降水”和“温度”两种环境，排除。", "故正确答案为C。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "词句理解 · 就近原则", "f": "<p>问「XX 一词指代的是 / 含义是」<\/p><b class=\"hl\">① 定位原文<\/b>，锁定词句所在语境<br>② <b>就近<\/b>找指代或解释（前一句、后一句、冒号后）<br>③ 选项若把词拆开按字面解释 → 多半错", "hot": 1}, {"t": "细节判断 · 三步定位", "f": "<p>长文段细节题<\/p>① 抓选项里的<b>专有名词/数字/时间<\/b>回文<b class=\"hl\">定位<\/b><br>② 只读定位句前后一句<br>③ 逐字比对：偷换主语、换时间、换范围、换程度 四类改动必错", "hot": 0}]}, {"id": "gk-2026-zf-q59", "stem": "民主真正落地，需基于明确、可操作的行动指南，行动指南要依托科学规范的程序文本来呈现，在这个意义上，科学民主的程序文本是民主得以从理念转化为现实不可或缺的载体，也是维护民主之实的基本保证。一方面，可借鉴他山之石，一定程度地吸纳其他国家较为成熟的、基于民主、公正、法治原则所建立起的议事规则；另一方面，须扎根实际，不能将程序简单视为政治制度的“飞来峰”，照抄照搬或简而化之，需要注重历史和现实、理论和实践、形式和内容有机统一，找到正确的方式方法。此外，还应构建长效化的程序完善机制，不断夯实程序之基。最适合做这段文字标题的是：", "options": ["以程序保障之力强化实质民主之效", "以程序运行之效提升实质民主之质", "以程序内容之基筑牢实质民主之实", "以程序科学之道阐释实质民主之义"], "answer": 1, "neg": 0, "steps": ["文段开篇指出民主真正落地需要明确可操作的行动指南，而行动指南则需要依托科学规 范的程序文本来呈现，引出“民主落地”和“程序文本”的话题，接着强调科学民主的程 序文本对民主从理念转化为现实以及维护民主之实的重要作用。", "然后通过三方面进行具体 的解释说明，一是借鉴他国成熟议事规则，二是扎根实际，注重历史与现实等有机统一找 到正确方法，三是构建长效化程序完善机制。故文段重在强调要以科学规范的程序文本， 即程序内容为基础来筑牢实质民主，对应B 项。", "A 项，文段强调以“程序文本”为基础，“以程序保障之力”表述不明确，排除； C 项，文段重点围绕“程序文本”展开，未涉及“程序的运行”，无中生有，排除； D 项，文段强调以“程序文本”为基础，“以程序科学之道”表述不明确，且“民主之义” 偏离重点，文段侧重讨论民主如何落到实处，排除。", "故正确答案为B。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "细节判断 · 三步定位", "f": "<p>长文段细节题<\/p>① 抓选项里的<b>专有名词/数字/时间<\/b>回文<b class=\"hl\">定位<\/b><br>② 只读定位句前后一句<br>③ 逐字比对：偷换主语、换时间、换范围、换程度 四类改动必错", "hot": 1}, {"t": "细节判断 · 无中生有四类", "f": "<p>选项说得很顺但与原文对不上<\/p>① 强加因果或比较（出现 比 / 更 / 越来越）② 夸大程度（取代 / 替代 / 彻底）③ 主观臆断（正比 / 决定）④ 四字选项的科普演变类描述，最容易凭空捏造", "hot": 0}]}, {"id": "gk-2026-zf-q60", "stem": "半规管原本是感知头部运动的器官，目前尚不清楚它是如何捕捉气压变化的。当半规管感知气压降低，会将信息传递给前庭神经，再传递给下丘脑。下丘脑负责调整自主神经。自主神经是维持体内状态不变、使身体适应外界变化的神经，分为交感神经和副交感神经，前者负责将身体切换到“战斗模式”，后者负责切换到“放松模式”。当下丘脑因气压变化受到刺激时，自主神经的功能就会紊乱，导致精神状态不佳。交感神经过度活跃时，身体会处于紧张状态，产生焦虑感；交感神经不能正常工作时，人就会无精打采。根据这段文字，下列说法正确的是：", "options": ["交感神经负责使人进入放松状态", "气压变化时人的前庭神经最先感知", "副交感神经过度活跃使人产生焦虑感", "气压变化通过下丘脑影响人的精神状态"], "answer": 3, "neg": 0, "steps": ["A 项，根据文段“分为交感神经和副交感神经，前者负责将身体切换到‘战斗模式’， 后者负责切换到‘放松模式’”可知，交感神经负责将身体切换到“战斗模式”而非放松 状态，偷换概念，排除； B 项，根据文段“半规管原本是感知头部运动的器官，目前尚不清楚它是如何捕捉气压变 化的。", "当半规管感知气压降低，会将信息传递给前庭神经”可知，气压变化的信息是通过 半规管传递给前庭神经的，故最先感知气压变化的并非前庭神经，表述错误，排除； C 项，根据文段“交感神经过度活跃时，身体会处于紧张状态，产生焦虑感”可知，是“交 感神经”过度活跃时，身体会产生焦虑感，而非“副交感神经”，偷换概念，排除； D 项，根据文段“当下丘脑因气压变化受到刺激时，自主神经的功能就会紊乱，导致精神 状态不佳”可知，气压变化通过影响下丘脑，进而影响人的精神状态，表述正确，当选。", "故正确答案为D。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "细节判断 · 三步定位", "f": "<p>长文段细节题<\/p>① 抓选项里的<b>专有名词/数字/时间<\/b>回文<b class=\"hl\">定位<\/b><br>② 只读定位句前后一句<br>③ 逐字比对：偷换主语、换时间、换范围、换程度 四类改动必错", "hot": 1}, {"t": "细节判断 · 无中生有四类", "f": "<p>选项说得很顺但与原文对不上<\/p>① 强加因果或比较（出现 比 / 更 / 越来越）② 夸大程度（取代 / 替代 / 彻底）③ 主观臆断（正比 / 决定）④ 四字选项的科普演变类描述，最容易凭空捏造", "hot": 0}]}]}, {"gid": "yjs", "title": "语句表达 · 排序与填空", "tag": "排序/语句填空/接语", "think": "排序先定<b>首句<\/b>（排除代词开头、关联词开头、反面论证开头），再找<b>捆绑<\/b>（指代词、关联词、时间顺序）；填空看空在段首还是段尾。", "rules": [{"t": "语句排序 · 定首句", "f": "适合做首句：<b>下定义的句子、外延大的句子、比喻句<\/b>、被解释的对象（当 X 可以解释 Y → Y 适合做首句）<br>不适合：含指代词、含关联词后半段、含「因此/所以」", "when": "给 6 个句子排序"}, {"t": "语句排序 · 定捆绑", "f": "找<b>指代词<\/b>（这/那/其/该）→ 前面必有指代对象；找<b>关联词对<\/b>（虽然…但是、不仅…而且）；找<b>时间/逻辑顺序<\/b>；代词单独成组最牢", "when": "首句排除后还剩两个选项"}, {"t": "语句填空 · 段首", "f": "只能往下文找线索：<b>下文的解释就是横线的意思<\/b>；横线常是总起句/话题引入", "when": "横线在段首"}, {"t": "语句填空 · 段尾", "f": "只能往上文找线索：横线是<b>总结句<\/b>，要对上文做归纳或收束", "when": "横线在段尾"}, {"t": "语句填空 · 段中", "f": "上下都要看：横线要<b>承上启下<\/b>，前半句接上文、后半句引下文；注意关联词与代词指代", "when": "横线在段落中间"}, {"t": "接语推断 · 抓尾句新话题", "f": "第一：锁定<b>尾句<\/b>；第二：答案必须含<b>尾句的主题词<\/b>；<b>不能选上文已经讲过的内容<\/b>（重复项是最大陷阱）", "when": "问「接下来最可能讲什么」"}], "main": [{"id": "zj-2015-A-q45", "stem": "①员工一般通过深层扮演和表层扮演这两种方式来实现情绪劳动<br>②情绪劳动是指员工为了给顾客提供更为优质的服务而表达出组织所需情绪的行为<br>③此时员工的情绪体验并没有改变，改变的只是对其服务对象的情绪表达<br>④从本质上来说，深层扮演是员工改变自己情绪体验的过程<br>⑤情绪劳动对组织而言有更多的积极效应，对员工个人来说则消极影响更多<br>⑥表层扮演是员工通过掩饰、夸大或抑制等方式来调整自己的情绪表达<br>将以上 6 个句子重新排列，语序正确的是:", "options": ["②③①④⑥⑤", "②①④⑥③⑤", "⑤②③①④⑥", "⑤①④⑥②③"], "answer": 1, "neg": 0, "steps": ["第一步，观察选项特征，确定首句。②句是情绪劳动的定义，引出“情绪劳动”话题，⑤句是对情绪劳动的影 响的解释。根据行文逻辑，先引出话题再进行具体阐释，故②句更适合做首句，排除 C 项和 D 项。", "第二步，对比 A 项和 B 项差异，判断②后面接①还是③。①句论述实现情绪劳动的方式，与②句话题一致，可 以相连。③句由代词“此时”引导，故前句应为某个时刻，而②句为情绪劳动的定义，②③不能相连，排除 A 项。 因此，选择 B 选项。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "语句填空 · 段中", "f": "<p>横线在段落中间<\/p><b class=\"hl\">上下都要看：横线要<b>承上启下<\/b><\/b>，前半句接上文、后半句引下文；注意关联词与代词指代", "hot": 1}, {"t": "语句排序 · 定首句", "f": "<p>给 6 个句子排序<\/p>适合做<b class=\"hl\">首句<\/b>：<b>下定义的句子、外延大的句子、比喻句<\/b>、被解释的对象（当 X 可以解释 Y → Y 适合做首句）<br>不适合：含指代词、含关联词后半段、含「因此/所以」", "hot": 0}]}, {"id": "zj-2017-A-q21", "stem": "大数据时代，正是通过挖掘个人选择偏好、生活轨迹、金融信用等数据，把握社会整体的需要、供给和趋势，<br>进而更好地造福社会。有了大数据，企业可以据此实现颠覆式创新，创造个性化、定制化的产品。政府部门可以<br>据此提高治理效能，相关政策可以更好辨证施治。对于个人而言，大数据带来的是更方便、更精准、更有效率。<br>可以说，________，正在成为现代社会最重要的进步动力之一。<br>填入画横线部分最恰当的一项是：", "options": ["大数据使得统计上显著的相关关系越来越多", "大数据日益改变着人类日益普及的网络行为", "大数据利用信息技术创造持久有力的竞争优势", "大数据将信息从知识的载体进化为智慧的源泉"], "answer": 3, "neg": 0, "steps": ["文段首先阐述了大数据的积极作用，即可以利用数据更好造福社会，接着从企业、政府部门、个人三个角度 分析了利用大数据带来的好处，最后以“可以说”表示总结，故横线处是对前文的概括，强调大数据的重要作用。", "A 项“在统计上的相关关系”无中生有，文中并未涉及，排除； B 项“改变网络行为”表述错误，文段中的“定制化产品”及“给个人带来的方便”，均是现实行为，排除； C 项“利用信息技术创造”且仅能对应“企业”一个主体，表述片面，排除； D 项“进化为智慧的源泉”恰好体现前文大数据的作用，且“进化”与后文“进步”对应恰当，符合文意。"], "judge": "", "has_img": false, "paper": "zj-2017-A", "rules": [{"t": "语句填空 · 段中", "f": "<p>横线在段落中间<\/p><b class=\"hl\">上下都要看：横线要<b>承上启下<\/b><\/b>，前半句接上文、后半句引下文；注意关联词与代词指代", "hot": 1}, {"t": "语句排序 · 定首句", "f": "<p>给 6 个句子排序<\/p>适合做<b class=\"hl\">首句<\/b>：<b>下定义的句子、外延大的句子、比喻句<\/b>、被解释的对象（当 X 可以解释 Y → Y 适合做首句）<br>不适合：含指代词、含关联词后半段、含「因此/所以」", "hot": 0}]}, {"id": "gk-2026-zf-q56", "stem": "①原子时能够满足对时间间隔均匀性的要求，但它的时刻却没有具体的物理含义<br>②它是采用原子时的秒长，利用原子时的均匀性，通过闰秒，保证时刻与世界时在一定程度相符的时间尺度<br>③世界时的时刻对应太阳在天空中的特定位置，反映地球在空间旋转时自转的角度和地轴方位<br>④1972年，国际上规定“协调世界时”成为新的国际标准时间，并沿用至今<br>⑤因此，为了兼顾人们对时刻和时间间隔的测量应用需要，定义了“协调世界时”<br>⑥但是地球自转不均匀等特性，使得世界时的秒长大致呈逐年变长的趋势<br>将以上6个句子重新排列，语序正确的一项是：", "options": ["④③①⑥②⑤", "④①⑤③②⑥", "③⑥①⑤②④", "③①②⑥⑤④"], "answer": 2, "neg": 0, "steps": ["对比选项，确定首句。③句介绍世界时的定义和特点，④句讲述1972 年“协调世界时” 成为国际标准时间，均可以作为首句，不好判断。继续寻找其他线索，发现⑤句出现结论词“因此”，并指出为了兼顾人们对时刻和时间间 隔的需要，定义了“协调世界时”，故⑤句前应指出为何要定义协调世界时的相关内容， ⑤句前有①句、②句、⑥句，①句介绍“原子时能够满足对时间间隔均匀性的要求，但它 的时刻却没有具体的物理含义”的缺陷，可与⑤句构成因果关系，保留B、C 两项。", "②句介 绍了一种新的时间尺度，⑥句仅指出世界时的秒长大致呈逐年变长的趋势，均无法与⑤句 构成因果关系，排除A、D 两项。继续寻找其他线索，发现⑥句出现转折词“但是”，指出地球自转不均匀等特性使得世界 时的秒长逐年变长，故可利用转折词捆绑解题，⑥句前有②句和③句，③句指出世界时反 映地球在空间旋转时自转的角度和地轴方位，与⑥句话题一致，且符合转折关系，对应C 项。", "②句介绍了协调世界时的原理，与⑥句内容无关，无法构成转折关系，排除B 项。故正确答案为C。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "语句填空 · 段中", "f": "<p>横线在段落中间<\/p><b class=\"hl\">上下都要看：横线要<b>承上启下<\/b><\/b>，前半句接上文、后半句引下文；注意关联词与代词指代", "hot": 1}, {"t": "语句排序 · 定首句", "f": "<p>给 6 个句子排序<\/p>适合做<b class=\"hl\">首句<\/b>：<b>下定义的句子、外延大的句子、比喻句<\/b>、被解释的对象（当 X 可以解释 Y → Y 适合做首句）<br>不适合：含指代词、含关联词后半段、含「因此/所以」", "hot": 0}]}, {"id": "gk-2026-zf-q57", "stem": "①它的形成过程与火星上的风力，风向等因素密切相关，是科学家研究火星气候特征的重要对象，可以帮助人们推测火星的古气候环境<br>②火星上常年风沙肆虐，岩土遍布，形成了许多不同形态的风沙地貌<br>③更有趣的是，火星上横向风成脊的两翼方向指向南方——只有在北风之下才能形成这样的形态<br>④科学家通过计算祝融号着陆区横向风成脊的脊线、顺风剖面和风成床的形态特征，惊喜地发现，其与地球上存在的巨型沙波纹形态参数较为相似<br>⑤综合祝融号测量到的火星风场信息，我们可以推断，火星上古时期也许时常刮起北风<br>⑥在祝融号的着陆区中，有一种典型的风沙地貌——横向风成脊<br>将以上6个句子重新排列，语序正确的一项是：", "options": ["⑥②①③④⑤", "⑥④③②⑤①", "②④⑤⑥③①", "②⑥①④③⑤"], "answer": 3, "neg": 0, "steps": ["对比选项，确定首句。②句介绍火星上有多种不同形态的风沙地貌，⑥句具体论述祝融 号着陆区的一种典型的风沙地貌，按照逻辑顺序应先提出观点，再通过例子进行解释说明， 故②句应在⑥句之前，②句更适合作为首句，排除A、B 两项。", "对比C、D 两项，②句后所接句子分别为④句和⑥句，⑥句引出横向风成脊的话题，④句介 绍科学家计算横向风成脊的脊线、顺风剖面和风成床的形态特征，并有所发现，按照逻辑 顺序，应先提出话题，再具体论述，故⑥句应在④句之前，排除C 项，锁定D 项。", "故正确答案为D。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "语句填空 · 段中", "f": "<p>横线在段落中间<\/p><b class=\"hl\">上下都要看：横线要<b>承上启下<\/b><\/b>，前半句接上文、后半句引下文；注意关联词与代词指代", "hot": 1}, {"t": "语句排序 · 定首句", "f": "<p>给 6 个句子排序<\/p>适合做<b class=\"hl\">首句<\/b>：<b>下定义的句子、外延大的句子、比喻句<\/b>、被解释的对象（当 X 可以解释 Y → Y 适合做首句）<br>不适合：含指代词、含关联词后半段、含「因此/所以」", "hot": 0}]}], "extra": [{"id": "gk-2026-zf-q58", "stem": "液晶显示器是一种光偏振调制的显示器件。当白光光源射入显示器时，通过入射偏振片，自然光被转换为线偏振光。未施加外来电场时，入射偏振光会顺着液晶分子的排列旋转前进，在正常黑色操作模式下，偏振光被出射偏振片阻挡并吸收，显示器画面呈现暗态；当施加电压时，液晶分子倾向平行于施加电场的方向，线偏振光直接到达出射偏振片，由于入射偏振光的偏振状态不受此液晶分子的影响，并保持与出射偏振片穿透轴方向一致，故能通过出射偏振片形成亮态。所以________。填入画横线部分最恰当的一项是：", "options": ["电场不够强时显示器呈半透明的中间灰度状态", "利用适当驱动电压即可得到明暗对比的显示效果", "液晶分子的旋转作用可以有效控制光线的穿透", "站在不同视角看显示屏时显示效果会有很大差异"], "answer": 1, "neg": 0, "steps": ["横线位于文段结尾，且横线前出现结论词“所以”，故需对前文内容进行总结。文段开 篇介绍液晶显示器是光偏振调制显示器件，并指出自然光通过入射偏振片会变为线偏振光， 后文通过分号引导的并列结构介绍施加或不施加电压可以控制液晶分子的倾向，从而影响 线偏振光的通过与否，实现暗态和亮态的显示。", "故横线处应总结前文，强调利用适当的驱 动电压可以控制光的通过情况，形成明暗对比的显示效果，对应B 项。A 项，“中间灰度状态”文段并未提及，文段仅提及“明暗两种状态”，无法衔接前文， 排除； C 项，“液晶分子的旋转作用”偏离前文重点，前文重点围绕电压与显示效果的关系展开 论述，无法衔接前文，排除； D 项，“站在不同视角看显示屏”文段并提及，无中生有，无法衔接前文，排除。", "故正确答案为B。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "语句填空 · 段中", "f": "<p>横线在段落中间<\/p><b class=\"hl\">上下都要看：横线要<b>承上启下<\/b><\/b>，前半句接上文、后半句引下文；注意关联词与代词指代", "hot": 1}, {"t": "语句排序 · 定首句", "f": "<p>给 6 个句子排序<\/p>适合做<b class=\"hl\">首句<\/b>：<b>下定义的句子、外延大的句子、比喻句<\/b>、被解释的对象（当 X 可以解释 Y → Y 适合做首句）<br>不适合：含指代词、含关联词后半段、含「因此/所以」", "hot": 0}]}, {"id": "gk-2026-zf-q63", "stem": "行政决策要遵循科学、民主和依法的原则，但________。按照行政决策的性质及目标划分，行政决策可分为经营性决策和管理型决策。经营性决策是政府为履行发展职能，促进经济社会发展而实施的决策，如制定产业政策、作出招商引资决定等，涉及经济社会发展，因而需要更多遵循经济规律，面向市场进行成本效益分析，量力而行。管理型决策则是直接涉及行政相对人的利益，如公共福利政策制定、生态环境保护措施等，需要更多的开放性和公众参与。凡是利益相关者，都应赋予其表达意见、参与决策的权利。填入画横线部分最恰当的一项是：", "options": ["要注意倾听各利益相关群体的不同声音", "应根据现实中的具体情况进行适当调整", "仍然需要完善相关制度以确保其规范运行", "具体要求则因行政决策性质的不同而有差异"], "answer": 3, "neg": 0, "steps": ["横线出现在文段开头，且为首句中的分句，需结合首句及后文内容分析。文段开篇指出 行政决策要遵循的原则，横线后指出按照行政决策的性质及目标，将其分为经营性决策和 管理型决策。后文针对经营性决策和管理型决策的区别详细介绍。", "故文段强调了行政决策 需要根据性质及目标不同，采取不同的行政决策模式，对应D 项。A 项，仅对应后文“管理型决策”的相关内容，表述片面，排除； B 项，“具体情况”表述笼统，且缺少核心话题“行政决策”，排除； C 项，“完善相关制度以确保其规范运行”文段并未涉及相关内容，无法与后文衔接，排 除。", "故正确答案为D。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "语句填空 · 段中", "f": "<p>横线在段落中间<\/p><b class=\"hl\">上下都要看：横线要<b>承上启下<\/b><\/b>，前半句接上文、后半句引下文；注意关联词与代词指代", "hot": 1}, {"t": "语句排序 · 定首句", "f": "<p>给 6 个句子排序<\/p>适合做<b class=\"hl\">首句<\/b>：<b>下定义的句子、外延大的句子、比喻句<\/b>、被解释的对象（当 X 可以解释 Y → Y 适合做首句）<br>不适合：含指代词、含关联词后半段、含「因此/所以」", "hot": 0}]}, {"id": "gk-2025-fu-q36", "stem": "<div class=\"mat\"><div class=\"mt\">📄 材料 1（材料在下面，先读材料再做题）<\/div>①中国古代早期的农作物种植结构，尤其是在先秦时期，可以简单分为以长江中下游地区为代表的典型稻作单一农作物种植制度和以中原地区为代表的多品种农作物种植制度。其中，中原地区实施多品种农作物种植制度，包括了粟、黍、稻米、大豆等生长条件需求不同的农作物品种。②中原地区先秦时期农作物种植结构方面经历了数次重大变化：从裴李岗时期到仰韶时代早期，黍一直是最为重要的农作物资源，对黍这种耐寒、耐贫瘠但产量较低作物的重视，与当时社会以狩猎采集为主、农业种植为辅的生计模式相契合；庙底沟时期以后，更为高产的粟取代黍成为主体农作物，这一时期人们获取食物的主要来源从狩猎采集转变为农耕生产，而大豆的少量出现可能源于人们对植物蛋白的诉求；中原地区在龙山时期时，稻米和大豆的重要性有了明显提升，显示了本区域对不适于旱作生产低洼地的开发以及通过大豆的种植一定程度恢复地力；二里岗时期，郑州地区小麦数量增多，可能是人力资源充沛的条件下人们为缓解春荒采取的重要举措所致；东周时期，小麦重要性的进一步提升，以及红小豆的普遍出现，则可能与“两年三熟轮作制”的实施有着直接关系。③《尔雅·释地》中记载：“田一岁曰菑，二岁曰新田，三岁曰畲”，《诗经·小雅》中也提及土地“薄言采芑，于彼新田，呈此菑亩”，说明商周时期种植制度中存在“菑”“新”“畲”，虽然各家对这几个词的解读说法不一，但当时存在撂荒、休耕制度是肯定的。在《周礼》中出现的“田莱制”和“易田制”，一方面说明休耕制度的普遍存在，另一方面显示已经不再实行一致休耕，而是根据土地肥沃或贫瘠的不同确定休耕的长短。④人们对土地的利用方式，普遍经历了从长期休耕、短期休耕，再到连年复种、多茬复种的过程。而其中土地种植方式的转变，也受到了诸多因素的影响，比如可供选择的农作物品种，可利用的耕地条件、水源条件，可选用的肥料来源，是否有便利的生产工具，等等。但是向农业集约化转变的决定性因素，在于人口密度是否已经达到了原有土地利用方式难以满足的程度。我们同样可以从植物考古的相关研究中梳理出先秦时期中原地区几千年来土地利用方式的演变。⑤裴李岗时期的中原地区，以粗放型的黍为主要作物，农业占比不高，遗址中多见来自森林山麓地区的核果、浆果类植物遗存，几乎不见农田杂草，应该属于长期休耕或“森林休耕”的范畴。这一土地利用方式可能一直延续到了庙底沟时期，随着庙底沟文化的急剧发展，人口和聚落数量大增，河谷平原地区成为遗址的集中分布区，高产的粟代替黍成为主粮，在采集类植物遗存锐减的同时，农田杂草可能开始大量出现，这一阶段土地的利用率明显提高，休耕时长可能大大缩短，我们认为该阶段从“森林休耕”转变为“灌木休耕”。⑥进入龙山晚期，中原地区迎来了人口和聚落数量的高峰，这一时期气候和降水变动剧烈，大豆在多数遗址的重要性增加，显示了人们对保持土壤肥力的重视，农田杂草在种类上的增多，可能反映了大量新拓荒的耕地或土地休耕时长的进一步缩短，从龙山晚期到夏商时期，可能已经进入了“短期休耕”或“草地休耕”的阶段。至迟在战国时期，我们认为复种制度已经出现在了中原地区，尤其是人口密度最高的河谷区域，一方面铁器和犁耕的普及极大地提高了生产力水平，另一方面豆类作物和小麦的重要性显著提高，&lt;u&gt;                    &lt;/u&gt;。<\/div>下面这段文字最适合填入文中哪个位置?<br>不论是粟对黍的取代，还是稻米、大豆的加入，再到小麦重要性的提升，以及红小豆被纳入轮作体系，都是该地区人们逐渐提高土地利用率的结果。", "options": ["①和②之间", "②和③之间", "③和④之间", "⑥之后"], "answer": 1, "neg": 0, "steps": ["题干文字论述粟对黍的取代、稻米和大豆的加入、小麦重要性的提升以及红小豆被纳入轮作体系，并出现指代词“该地区”，强调该地区农作物种植的转变是当地人们提高土地利用率的结果，故前文应介绍某地区发生农作物种植的转变且有提高土地利用率的举措。", "②处详细介绍了中原地区先秦时期农作物种植结构方面经历的变化，皆对应题干中涉及的种植结构的转变，且“人们为缓解春荒采取的重要举措”“‘两年三熟轮作制’的实施”等对应“提高土地利用率的举措”，故题干文字应置于②处之后，对上文内容起到概括总结的作用，对应B项。", "A、C、D三项：①处介绍中国古代早期的农作物种植结构，并未提及提高土地利用率的相关内容，③处介绍商周时期存在撂荒、休耕制度，并未涉及具体的“地区”，⑥处介绍从龙山晚期至战国时期种植制度的变化，虽涉及土地利用率的相关内容，但未体现粟、黍等农作物种植的转变，均无法与题干内容衔接，排除。", "故正确答案为B。【文段出处】人民日报《考古中的早期农作物种植制度（博古知今）》"], "judge": "", "has_img": false, "paper": "gk-2025-fu", "rules": [{"t": "语句填空 · 段中", "f": "<p>横线在段落中间<\/p><b class=\"hl\">上下都要看：横线要<b>承上启下<\/b><\/b>，前半句接上文、后半句引下文；注意关联词与代词指代", "hot": 1}, {"t": "语句排序 · 定首句", "f": "<p>给 6 个句子排序<\/p>适合做<b class=\"hl\">首句<\/b>：<b>下定义的句子、外延大的句子、比喻句<\/b>、被解释的对象（当 X 可以解释 Y → Y 适合做首句）<br>不适合：含指代词、含关联词后半段、含「因此/所以」", "hot": 0}]}]}]}</script>

  head.appendChild(el('span',null,g.tag));
  c.appendChild(head);
  c.appendChild(el('div','qno','第 '+(st.qi+1)+' / '+list.length+' 题'+(st.qi===0&&!extraMode?'（主讲题，先自己做，别急着看答案）':'（强化题）')));
  var sd=el('div','stem',q.stem);
  if(q.judge){ sd.appendChild(el('span','meta','题型判定：'+q.judge)); }
  c.appendChild(sd);
  var box=el('div','opts');
  q.options.forEach(function(o,i){
    var t=String(o).replace(/<[^>]+>/g,'').trim();
    var hasimg=/<img/i.test(String(o)); var dup=(!hasimg)&&((t.length<=1)||t===L(i));   /* 图推：选项就是题干图里的 A/B/C/D 四个图 */
    var b=el('button','opt'+(dup?' letteronly':''),'<em>'+L(i)+'</em>'+(dup?'<span class="lp">题干图中的 '+L(i)+' 选项</span>':o));
    b.onclick=function(){ if(submitted)return; chosen=i;
      Array.prototype.forEach.call(box.children,function(x,j){x.classList.toggle('sel',j===i);});
      sub.disabled=false; };
    box.appendChild(b);
  });
  c.appendChild(box);
  var act=el('div','act');
  var sub=el('button','btn','提交答案'); sub.disabled=true;
  sub.onclick=function(){ if(submitted||chosen<0)return; doSubmit(c,box,sub,q,g); };
  act.appendChild(sub);
  act.appendChild(el('span','meta','（计时中，提交后才显示用时）'));
  c.appendChild(act);
  wrap.appendChild(c);
  t0=Date.now();
  // 进度条
  $('#ptext').textContent='已做 '+doneMain()+' / '+totalMain()+' 题';
  $('#pfill').style.width=(doneMain()/totalMain()*100)+'%';
  window.scrollTo({top:0,behavior:'smooth'});
  if(location.search.indexOf('autotest')>=0){
    setTimeout(function(){var o=document.querySelector('.opt');if(o)o.click();
      var s=document.querySelector('.act .btn');if(s)s.click();},40);
  }
}

function doSubmit(card,box,sub,q,g){
  submitted=true;
  var ms=Date.now()-t0, sec=Math.round(ms/1000);
  var ok=(chosen===q.answer);
  st.ans[q.id]={c:chosen,ok:ok,sec:sec};
  save();
  $('#ptext').textContent='已做 '+doneMain()+' / '+totalMain()+' 题';
  $('#pfill').style.width=(doneMain()/totalMain()*100)+'%';
  Array.prototype.forEach.call(box.children,function(x,i){
    x.disabled=true; x.classList.remove('sel');
    if(i===q.answer)x.classList.add('right');
    if(i===chosen&&!ok)x.classList.add('wrong');
  });
  sub.style.display='none';
  card.querySelector('.act .meta').textContent='';
  if(!ok) groupWrong++;

  var res=el('div','res');
  var j=el('div','judge '+(ok?'ok':'bad'),
     (ok?'✔ 答对了':'✘ 答错了')+'　正确答案 '+L(q.answer)+(ok?'':' ｜ 你选了 '+L(chosen))+'');
  res.appendChild(j); if(q.neg){res.appendChild(el('div','meta neg','⚠ 本题是选非题：正确答案＝「不正确／不属于／不能／除外」的那一项。解析里说「正确」的选项都是干扰项，别按常识去选对的那个。'));}
  res.appendChild(el('div','meta','用时 '+sec+' 秒'+(sec>90?'（偏慢，本模块目标 ≤75 秒/题）':'')+'　·　题源 '+q.paper+' '+q.id));

  // 思路
  var b1=el('div','blk');
  b1.appendChild(el('h4',null,'一、这道题怎么想'));
  b1.appendChild(el('div','bd',g.think+(q.judge?'<br><b>本题判定：</b>'+q.judge:'')));
  res.appendChild(b1);

  // 分步
  var b2=el('div','blk');
  b2.appendChild(el('h4',null,'二、分步解法'));
  var ol=el('ol');
  (q.steps.length?q.steps:['官方解析缺失，请对照原卷']).forEach(function(s){ ol.appendChild(el('li',null,s)); });
  b2.appendChild(el('div','bd','')).appendChild(ol);
  res.appendChild(b2);

  // 本题用到的套路（只截这一题用得上的，主用的高亮）
  var b3=el('div','blk');
  b3.appendChild(el('h4',null,'三、这一题要用的套路（抄在题干旁，下次照这个做）'));
  var rw=el('div','bd');
  (q.rules||[]).forEach(function(r){
    var d=el('div','rule'+(r.hot?' hot':''));
    d.appendChild(el('div','rt',(r.hot?'<span class="flag">本题主用</span>':'')+'<b>'+r.t+'</b>'));
    d.appendChild(el('p','',r.f));
    rw.appendChild(d);
  });
  b3.appendChild(rw);
  res.appendChild(b3);

  var act=el('div','act');
  var nx=el('button','btn','下一题 →');
  nx.onclick=function(){ st.qi++; save(); groupWrong=0; render(); };
  act.appendChild(nx);
  res.appendChild(act);
  card.appendChild(res);
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function groupEnd(g){
  wrap.innerHTML='';
  var c=el('div','card sum');
  var total=g.main.length, right=0, secs=0;
  g.main.forEach(function(q){var a=st.ans[q.id];if(a){if(a.ok)right++;secs+=a.sec;}});
  c.appendChild(el('div','big',right+' / '+total));
  c.appendChild(el('p','','本组《'+g.title+'》对 '+right+' 题，平均每题 '+(secs?Math.round(secs/total):0)+' 秒'));
  var advice = right>=3 ? '达标（≥3/4）。可以进下一组。'
             : '没达标（'+right+'/4）。先用下面「再来 3 题」同考点加练，练完再进下一组。';
  c.appendChild(el('p','',advice));
  var act=el('div','act');
  if(right<3 && g.extra.length){
    var more=el('button','btn','再来 '+g.extra.length+' 题同考点加练');
    more.onclick=function(){ extraMode=true;st.qi=0;save();render();};
    act.appendChild(more);
  }
  var next=el('button','btn ghost',(st.gi+1<D.groups.length)?'进下一组：'+D.groups[st.gi+1].title:'看总成绩');
  next.onclick=function(){ st.gi++;st.qi=0;extraMode=false;groupWrong=0;save();render();};
  act.appendChild(next);
  c.appendChild(act);
  wrap.appendChild(c);
  $('#ptext').textContent='已做 '+doneMain()+' / '+totalMain()+' 题';
  $('#pfill').style.width=(doneMain()/totalMain()*100)+'%';
}

function summary(){
  wrap.innerHTML='';
  var c=el('div','card sum');
  var right=doneMain();
  c.appendChild(el('div','big',right+' / '+totalMain()));
  var secs=0;Object.keys(st.ans).forEach(function(k){secs+=st.ans[k].sec||0;});
  c.appendChild(el('p','','言语理解学习模式全部做完，总用时 '+Math.round(secs/60)+' 分钟'));
  var by={};
  D.groups.forEach(function(g){var r=0;g.main.forEach(function(q){if(st.ans[q.id]&&st.ans[q.id].ok)r++;});by[g.title]=r+'/'+g.main.length;});
  Object.keys(by).forEach(function(k){c.appendChild(el('p','',k+'：'+by[k]));});
  var act=el('div','act');
  var re=el('button','btn ghost','重新练一遍（清空本页记录）');
  re.onclick=function(){ if(confirm('确定清空本页记录？')){ localStorage.removeItem(KEY); st={gi:0,qi:0,ans:{},done:false}; save(); render(); } };
  act.appendChild(re);
  c.appendChild(act);
  wrap.appendChild(c);
}

window.__learn={render:render,state:st};
(function(){
  var q=location.search;
  if(q.indexOf('demo1')>=0){        // 渲染「本组小结」用于自检
    D.groups[0].main.forEach(function(it,i){ st.ans[it.id]={c:it.answer,ok:i===0,sec:55}; });
    st.gi=0; st.qi=D.groups[0].main.length; groupEnd(D.groups[0]); return;
  }
  if(q.indexOf('demo2')>=0){        // 渲染「总成绩」用于自检
    D.groups.forEach(function(g){ g.main.forEach(function(it){ st.ans[it.id]={c:it.answer,ok:true,sec:48}; }); });
    st.done=true; summary(); return;
  }
  var mg=/[?&]g=(\d+)/.exec(q);      // 跳到第 N 组自检用
  if(mg){ st.gi=Math.min(D.groups.length-1,Math.max(0,parseInt(mg[1],10)-1)); st.qi=0; }
})();
render();
})();
</script>
</body></html>
