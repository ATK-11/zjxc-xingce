<title>学习模式 · 常识判断 · 浙江行测</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--sub:#5d6a7a;--line:#e3e8ee;--brand:#146b58;--warn:#b4530a;--chip:#eef5f3;--ok:#0f7b4f;--bad:#b3261e;--okbg:#e8f6ef;--badbg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1c2129;--ink:#e6ebf2;--sub:#93a1b3;--line:#2b333e;--brand:#4fc3a1;--warn:#f0a35e;--chip:#20322e;--ok:#5ed6a0;--bad:#ff8a80;--okbg:#1b2f26;--badbg:#33201e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
a{color:var(--brand)}
.top{display:flex;gap:10px;margin-bottom:10px}
.top a{font-size:13px;text-decoration:none;border:1px solid var(--line);padding:5px 10px;border-radius:8px;background:var(--card)}
h1{font-size:22px;margin:8px 0 4px}
.lead{color:var(--sub);font-size:13px;margin:0 0 14px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.bar .row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.pb{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:14px}
.gh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.gh b{font-size:17px}
.gh span{font-size:12px;color:var(--warn)}
.qno{font-size:12px;color:var(--sub);margin-bottom:8px}
.stem{font-size:15px;line-height:1.75}
.stem .qimg{max-width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
.opt{display:block;width:100%;text-align:left;margin:8px 0 0;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--chip);font-weight:600}
.opt.right{border-color:var(--ok);background:var(--okbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;opacity:1}
.opt em{font-style:normal;font-weight:700;margin-right:6px;color:var(--brand)}
.opt .lp{color:var(--sub);font-size:12.5px}
.opt.letteronly em{font-size:15px}
.act{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 18px;border-radius:10px;border:0;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.res{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.judge{font-size:14px;font-weight:700;margin-bottom:10px}
.judge.ok{color:var(--ok)} .judge.bad{color:var(--bad)}
.blk{margin:10px 0 0}
.blk h4{margin:0 0 5px;font-size:13px;color:var(--brand);letter-spacing:.5px}
.blk .bd{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px}
.blk .bd ol{margin:0;padding-left:20px}
.blk .bd li{margin:4px 0}
.rule{border-left:3px solid var(--line);padding:6px 0 6px 10px;margin:8px 0}
.rule.hot{border-left:3px solid var(--warn);background:#fff8ef;border-radius:0 8px 8px 0;padding:7px 10px 8px 10px}
@media (prefers-color-scheme:dark){.rule.hot{background:#2a2318}}
.rule .rt{margin-bottom:2px}
.rule b{font-size:13.5px}
.rule.hot b{background:linear-gradient(transparent 55%,#ffe08a 55%);padding:0 1px;border-radius:2px}
@media (prefers-color-scheme:dark){.rule.hot b{background:linear-gradient(transparent 55%,#6b5410 55%)}}
.rule.hot b{color:var(--ink)}
.rule b.hl{background:linear-gradient(transparent 55%,#ffe08a 55%);padding:0 1px;border-radius:2px}
@media (prefers-color-scheme:dark){.rule b.hl{background:linear-gradient(transparent 55%,#6b5410 55%)}}
.flag{display:inline-block;font-size:11px;background:var(--warn);color:#fff;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.rule p{margin:3px 0 0;font-size:13.5px;color:var(--sub)}
.rule.hot p{color:var(--ink)}
.meta{font-size:12px;color:var(--sub);margin-top:8px}
.sum{text-align:center;padding:24px 16px}
.sum .big{font-size:34px;font-weight:700;color:var(--brand)}
.sum p{color:var(--sub);font-size:14px}
.note{margin-top:22px;font-size:12px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px}
.hide{display:none}

.mat{background:#f2f5f8;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.75}
.mat .mt{font-size:12px;color:var(--sub);margin-bottom:4px}
.mat img{max-width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
@media (prefers-color-scheme:dark){.mat{background:#1a2330}}
.qimg{max-width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}

.res .meta.neg{display:block;margin:6px 0 2px;padding:7px 10px;border-radius:8px;background:#fff1f2;color:#9f1239;font-size:13px;line-height:1.55;font-weight:600}
body.markmap-dark .res .meta.neg,html[data-theme="dark"] .res .meta.neg{background:#3b0d16;color:#fda4af}</style></head><body>

<script id="data" type="application/json">{"groups": [{"gid": "fl", "title": "法律常识", "tag": "每年 2–4 题，最稳的送分点", "think": "法律题先看设问「正确/不正确」，再逐项抠<b>主体<\/b>和<b>权限<\/b>：谁做的、有没有权做、程序对不对。", "rules": [{"t": "法律·年龄与责任", "f": "不满 14 周岁：完全不负刑事责任<br>14—16 周岁：只对八类重罪负责（故意杀人、故意伤害致重伤/死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质）<br>16 周岁以上：完全负责<br>民事责任：8 周岁以下无、8—18 限制、18 以上完全", "when": "刑事责任年龄、民事行为能力、行政处罚权限，是浙江卷最稳的法律考点。"}, {"t": "法律·宪法与权限", "f": "宪法日 12 月 4 日；宪法修改需全国人大 <b>2/3<\/b> 以上多数<br>只有<b>行政机关<\/b>能作罚款等行政处罚；派出所只能罚 <b>500 元以下<\/b>或警告<br>限制人身自由的处罚只能由<b>法律<\/b>设定", "when": "考「谁有权做什么」：立法、处罚、征收、许可。"}, {"t": "常识·做题三步", "f": "① <b>选非题先圈「非」<\/b>，做完回头再核一遍，每年都有人看反<br>② 拿不准就找「绝对词」（唯一/必须/全部/最早），绝对词多是错的<br>③ 四个选项里通常有两个能一眼排除，别在冷门细节上空耗", "when": "先看设问是「正确」还是「不正确」（选非题圈「非」打×）；再逐项找硬伤；最后凭「绝对化/时间错位/主体错位」排除。"}], "main": [{"id": "zj-2016-A-q20", "stem": "下列不属于夫妻共同财产的是：", "options": ["婚前房屋在婚后所得的租金", "夫妻关系存续期间，军人的复员费和自主择业费", "婚后由一方父母出资购买的不动产，产权登记在出资人子女名下", "婚姻存续期间虽未实际取得，但明确可以取得的知识产权收益"], "answer": 2, "neg": 1, "steps": ["第一步，本题考查“夫妻共同财产”并选错误项。", "第二步，《最高人民法院关于适用若干问题的解释（三）》第7 条规定，婚后由一方父母出资为子女购买的不 动产，产权登记在出资人子女名下的，可按照婚姻法第十八条第（三）项的规定，视为只对自己子女一方的赠 与，该不动产应认定为夫妻一方的个人财产。 因此，选择C 选项。 拓展 A 项：生产、经营的收益，属于夫妻共同财产。《最高人民法院关于适用〈中华人民共和国婚姻法〉若干问题 的解释（三）》第5 条规定，夫妻一方个人财产在婚后产生的收益，除孳息和自然增值外，应认定为夫妻共同 财产。虽然房屋租金在民法理论上属于法定孳息，但在司法实践中，租金的获取与房屋的管理密切相关，需要 夫妻双方投入一定的管理和劳务，故法院常将房屋租金认定为经营性收益。因此关于房屋租金，常以推定共同 所有为原则，以认定个人财产为例外。 B 项：属于夫妻共同财产。《最高人民法院关于适用〈中华人民共和国婚姻法〉若干问题的解释（二）》第14 条第1 款规定，人民法院审理离婚案件，涉及分割发放到军人名下的复员费、自主择业费等一次性费用的，以 夫妻婚姻关系存续年限乘以年平均值，所得数额为夫妻共同财产。 D 项：知识产权的收益，属于夫妻共同财产。《婚姻法》第17 条规定，夫妻在婚姻关系存续期间所得的下列财 获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 6 - 产，归夫妻共同所有：（一）工资、奖金；（二）生产、经营的收益；（三）知识产权的收益；（四）继承或 赠与所得的财产，但本法第十八条第三项规定的除外；（五）其他应当归共同所有的财产。《最高人民法院关 于适用若干问题的解释（二）》第12 条规定，婚姻法第十七条第三项规定的“知识产权的收益”，是指婚姻关 系存续期间，实际取得或者已经明确可以取得的财产性收益。由此可知，对于选项中“婚姻存续期间虽未实际 取得，但明确可以取得的知识产权收益”应属于夫妻共同财产。"], "judge": "", "has_img": false, "paper": "zj-2016-A", "rules": [{"t": "法律·宪法与权限", "f": "<p>考「谁有权做什么」：立法、处罚、征收、许可。<\/p><b class=\"hl\">宪法日 12 月 4 日；宪法修改需全国人大 <b>2/3<\/b> 以上多数 申请在先", "可以由商标局自由裁定"], "answer": 0, "neg": 0, "steps": ["第一步，本题考查《商标法》。", "第二步，《商标法》第31 条规定，申请在先是原则，使用在先是例外。本题中甲乙二人同时申请，但甲使用在 先，故应当初步审定并公告甲的申请。 因此，选择A 选项。 拓展 《商标法》第31 条规定，两个或者两个以上的商标注册申请人，在同一种商品或者类似商品上，以相同或者近 似的商标申请注册的，初步审定并公告申请在先的商标；同一天申请的，初步审定并公告使用在先的商标，驳 回其他人的申请，不予公告。"], "judge": "", "has_img": false, "paper": "zj-2016-A", "rules": [{"t": "法律·宪法与权限", "f": "<p>考「谁有权做什么」：立法、处罚、征收、许可。<\/p><b class=\"hl\">宪法日 12 月 4 日；宪法修改需全国人大 <b>2/3<\/b> 以上多数<\/b><br>只有<b>行政机关<\/b>能作罚款等行政处罚；派出所只能罚 <b>500 元以下<\/b>或警告<br>限制人身自由的处罚只能由<b>法律<\/b>设定", "hot": 1}, {"t": "常识·做题三步", "f": "<p>先看设问是「正确」还是「不正确」（选非题圈「非」打×）；再逐项找硬伤；最后凭「绝对化/时间错位/主体错位」排除。<\/p><b class=\"hl\">① <b>选非题先圈「非」<\/b><\/b>，做完回头再核一遍，每年都有人看反<br>② 拿不准就找「绝对词」（唯一/必须/全部/最早），绝对词多是错的<br>③ 四个选项里通常有两个能一眼排除，别在冷门细节上空耗", "hot": 0}]}, {"id": "zj-2016-A-q11", "stem": "关于国家征收农民集体所有土地补偿的规定，下列说法错误的是：", "options": ["征收农民集体土地，需要按照被征收土地的原用途予以补偿", "征收耕地以外其他土地的补偿标准由省、自治区、直辖市规定", "被征收土地上的附着物和青苗的补偿标准，由市、县人民政府规定", "征收耕地应给予土地补偿费、安置补助费、地上附着物和青苗的补偿费"], "answer": 2, "neg": 1, "steps": ["第一步，本题考查《土地管理法》并选错误项。", "第二步，《土地管理法》第47 条第4 款规定，被征收土地上的附着物和青苗的补偿标准，由省、自治区、直辖 市规定。由此可知，由市、县人民政府规定的说法错误。 因此，选择C 选项。 拓展 A 项：《土地管理法》第47 条第1 款规定，征收土地的，按照被征收土地的原用途给予补偿。 B 项：《土地管理法》第47 条第3 款规定，征收其他土地的土地补偿费和安置补助费标准，由省、自治区、直 辖市参照征收耕地的土地补偿费和安置补助费的标准规定。 D 项：《土地管理法》第47 条第2 款规定，征收耕地的补偿费用包括土地补偿费、安置补助费以及地上附着物 和青苗的补偿费。"], "judge": "", "has_img": false, "paper": "zj-2016-A", "rules": [{"t": "法律·宪法与权限", "f": "<p>考「谁有权做什么」：立法、处罚、征收、许可。<\/p><b class=\"hl\">宪法日 12 月 4 日；宪法修改需全国人大 <b>2/3<\/b> 以上多数<\/b><br>只有<b>行政机关<\/b>能作罚款等行政处罚；派出所只能罚 <b>500 元以下<\/b>或警告<br>限制人身自由的处罚只能由<b>法律<\/b>设定", "hot": 1}, {"t": "常识·做题三步", "f": "<p>先看设问是「正确」还是「不正确」（选非题圈「非」打×）；再逐项找硬伤；最后凭「绝对化/时间错位/主体错位」排除。<\/p><b class=\"hl\">① <b>选非题先圈「非」<\/b><\/b>，做完回头再核一遍，每年都有人看反<br>② 拿不准就找「绝对词」（唯一/必须/全部/最早），绝对词多是错的<br>③ 四个选项里通常有两个能一眼排除，别在冷门细节上空耗", "hot": 0}]}], "extra": [{"id": "gk-2026-zf-q11", "stem": "习近平总书记高度重视战略思维，多次强调党员领导干部要加强战略思维，增强战略定力。下列体现战略思维的说法，正确的有几项？<br>①粮食多一点少一点是战略问题，粮食安全是战术问题<br>②统战工作的本质要求是大团结大联合，解决的是人心和力量问题<br>③要心怀“国之大者”  "neg": 0, "steps": ["第一步，本题考查微波相关知识。", "第二步，在微波长段的电磁波所对应的频率范围是300MHz（0.3GHz）—300GHz，这就意味着微波通信设备的通 频带可以做得很宽，通讯容量比较大。微波通信质量好，抗干扰能力强，并可传至很远的距离，是国家通信网 的一种重要通信手段，也普遍适用于各种专用通信网。 因此，选择D 选项。 拓展 A 项：微波是无线电波中一个有限频带的简称，是分米波、厘米波、毫米波的统称。微波频率比一般的无线电 波频率高，通常也称为“超高频电磁波”。 B 项：微波炉加热食物的原理，简单来说就是当微波辐射到食品上时，食品中含有一定量的水分，而水是由极 性分子组成的，极性分子的取向会随微波场的变化而变动，由于食品中水的极性分子的这种运动，以及相邻分 子间的相互作用，产生了类似摩擦的现象，使水温升高，因此，食品的温度也就上升了。由此可知，食品中含 水量的多少对微波加热效果会有比较大的影响。 C 项：对于玻璃、塑料和瓷器，微波几乎是穿越而不被吸收，而金属类东西，则会反射微波。 获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 4 -"], "judge": "", "has_img": false, "paper": "zj-2016-A", "rules": [{"t": "科技·物理生活", "f": "<p>生活现象考原理对应：先判能量/力/光/声，再对选项。<\/p><b class=\"hl\">彩虹<\/b>＝折射+反射+色散；微波加热＝水分子振动（不是辐射残留）；高压锅＝气压升高沸点升高<br>霜/露/雾/云：凝华/液化/液化/液化+凝华", "hot": 1}, {"t": "常识·做题三步", "f": "<p>先看设问是「正确」还是「不正确」（选非题圈「非」打×）；再逐项找硬伤；最后凭「绝对化/时间错位/主体错位」排除。<\/p><b class=\"hl\">① <b>选非题先圈「非」<\/b><\/b>，做完回头再核一遍，每年都有人看反<br>② 拿不准就找「绝对词」（唯一/必须/全部/最早），绝对词多是错的<br>③ 四个选项里通常有两个能一眼排除，别在冷门细节上空耗", "hot": 0}]}, {"id": "zj-2016-A-q13", "stem": "如图所示的是哪种典型地貌：", "options": ["风蚀地貌", "冰川地貌", "丹霞地貌", "喀斯特地貌"], "answer": 0, "neg": 0, "steps": ["第一步，本题考查典型地貌。", "第二步，观察图片，会发现图中地貌处在比较干旱的地区，属于雅丹地貌，雅丹地貌是风蚀地貌的一种，主要 分布于我国西北部的戈壁地区，由于常年的风力吹蚀和磨蚀作用，会在地表面形成非常独特的土墩，其典型代 表为准噶尔盆地的魔鬼城。 因此，选择A 选项。 拓展 B 项：冰川地貌是由冰川作用形成的地表形态，属于气候地貌范畴。其典型代表为青藏高原。 C 项：丹霞地貌主要是红色砂岩受流水的侵蚀作用形成的。其典型代表为福建武夷山、广东丹霞山等。 D 项：喀斯特地貌是具有溶蚀力的水对可溶性岩石（大多为石灰岩）进行溶蚀作用等而形成的地表和地下形态 的总称，又称岩溶地貌。其典型代表为四川九寨沟、桂林山水等。"], "judge": "", "has_img": false, "paper": "zj-2016-A", "rules": [{"t": "科技·物理生活", "f": "<p>生活现象考原理对应：先判能量/力/光/声，再对选项。<\/p><b class=\"hl\">彩虹<\/b>＝折射+反射+色散；微波加热＝水分子振动（不是辐射残留）；高压锅＝气压升高沸点升高<br>霜/露/雾/云：凝华/液化/液化/液化+凝华", "hot": 1}, {"t": "常识·做题三步", "f": "<p>先看设问是「正确」还是「不正确」（选非题圈「非」打×）；再逐项找硬伤；最后凭「绝对化/时间错位/主体错位」排除。<\/p><b class=\"hl\">① <b>选非题先圈「非」<\/b><\/b>，做完回头再核一遍，每年都有人看反<br>② 拿不准就找「绝对词」（唯一/必须/全部/最早），绝对词多是错的<br>③ 四个选项里通常有两个能一眼排除，别在冷门细节上空耗", "hot": 0}]}, {"id": "zj-2016-A-q15", "stem": "关于疫苗，下列说法错误的是：", "options": ["根据费用支付方式，分政府免费提供和公民自费自愿接种两类", "牛痘疫苗彻底消灭天花，是人类用疫苗迎战病毒的首次胜利", "接种疫苗是预防传染病最有效、最经济的手段", "目前乙肝疫苗是世界上使用量最大的一种疫苗"], "answer": 3, "neg": 1, "steps": ["第一步，本题考查疫苗并选错误项。", "第二步，流感疫苗在全球已经使用超过60 年，目前每年使用量都以亿计，是全球使用量最大的一种疫苗。 因此，选择D 选项。 拓展 A 项：疫苗分为一类疫苗和二类疫苗。一类疫苗是指政府免费向公民提供，公民应当依照政府的规定受种的疫 苗。二类疫苗是指由公民自费并且自愿受种的其他疫苗。 B 项：疫苗的发现是人类发展史上一件具有里程碑意义的事件，威胁人类几百年的天花病毒在牛痘疫苗出现后 便被彻底消灭了，迎来了人类用疫苗迎战病毒的第一个胜利。 C 项：抑制传染病关键在于切断传染源，即控制传染源，切断传播途径，保护易感人群。其中接种疫苗是保护 易感人群、预防传染病最有效、最经济的手段。"], "judge": "", "has_img": false, "paper": "zj-2016-A", "rules": [{"t": "科技·生物三开关", "f": "<p>生物题只考三件事：遗传、生态、代谢。<\/p><b class=\"hl\">无氧呼吸<\/b>：人体产乳酸、酵母产酒精<br>生态系统＝生产者+消费者+分解者+非生物环境，缺一不可<br>疫苗＝抗原，让人体自己产生抗体（不是直接给抗体）", "hot": 1}, {"t": "科技·物理生活", "f": "<p>生活现象考原理对应：先判能量/力/光/声，再对选项。<\/p><b class=\"hl\">彩虹<\/b>＝折射+反射+色散；微波加热＝水分子振动（不是辐射残留）；高压锅＝气压升高沸点升高<br>霜/露/雾/云：凝华/液化/液化/液化+凝华", "hot": 0}]}], "extra": [{"id": "gk-2026-zf-q119", "stem": "<div class=\"mat\"><div class=\"mt\">📄 材料 2（材料在下面，先读材料再做题）<\/div>2024年，我国企业发明专利产业化平均收益（平均每件已产业化的有效专利产生的收益）为869.5万元/件，较上年增长4.8％。其中，战略性新兴产业和未来产业领域的企业发明专利产业化平均收益分别为939.1万元/件和1132.7万元/件。分企业规模看，中型企业发明专利产业化平均收益最高，为991.9万元/件，其次为大型企业和小型企业，分别为953.9万元/件和752.4万元/件，微型企业相对最低，为260.1万元/件。&lt;p style=\"margin-top:10px\"&gt;2020~2024 年我国企业专利产业化率（单位：%）&lt;table border=\"1\" cellspacing=\"0\" cellpadding=\"3\" style=\"border-collapse:collapse\"&gt;&lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;2020年&lt;/th&gt;&lt;th&gt;2021年&lt;/th&gt;&lt;th&gt;2022年&lt;/th&gt;&lt;th&gt;2023年&lt;/th&gt;&lt;th&gt;2024年&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;发明专利&lt;/td&gt;&lt;td&gt;44.9&lt;/td&gt;&lt;td&gt;46.8&lt;/td&gt;&lt;td&gt;48.1&lt;/td&gt;&lt;td&gt;51.3&lt;/td&gt;&lt;td&gt;53.3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;　其中：大型企业&lt;/td&gt;&lt;td&gt;45.9&lt;/td&gt;&lt;td&gt;47.1&lt;/td&gt;&lt;td&gt;50.9&lt;/td&gt;&lt;td&gt;51.0&lt;/td&gt;&lt;td&gt;49.5&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;　　　　中型企业&lt;/td&gt;&lt;td&gt;46.8&lt;/td&gt;&lt;td&gt;54.6&lt;/td&gt;&lt;td&gt;55.4&lt;/td&gt;&lt;td&gt;57.9&lt;/td&gt;&lt;td&gt;61.4&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;　　　　小型企业&lt;/td&gt;&lt;td&gt;46.1&lt;/td&gt;&lt;td&gt;47.7&lt;/td&gt;&lt;td&gt;45.3&lt;/td&gt;&lt;td&gt;53.9&lt;/td&gt;&lt;td&gt;57.8&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;　　　　微型企业&lt;/td&gt;&lt;td&gt;32.4&lt;/td&gt;&lt;td&gt;26.6&lt;/td&gt;&lt;td&gt;22.0&lt;/td&gt;&lt;td&gt;33.8&lt;/td&gt;&lt;td&gt;36.7&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;实用新型专利&lt;/td&gt;&lt;td&gt;42.0&lt;/td&gt;&lt;td&gt;46.2&lt;/td&gt;&lt;td&gt;44.9&lt;/td&gt;&lt;td&gt;57.1&lt;/td&gt;&lt;td&gt;54.9&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;外观设计专利&lt;/td&gt;&lt;td&gt;51.6&lt;/td&gt;&lt;td&gt;52.3&lt;/td&gt;&lt;td&gt;58.7&lt;/td&gt;&lt;td&gt;66.0&lt;/td&gt;&lt;td&gt;63.5&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;2023~2024 年我国不同行业企业发明专利产业化率：<br><img class=\"qimg\" src=\"../assets/data/real/img/gk2026-mat2-chart.png\" />&lt;p style=\"font-size:12px;color:#666\"&gt;注：专利产业化率＝已产业化的有效专利数量÷拥有的有效专利总量×100%。<\/div>资料所列13个行业中，2024年企业发明专利产业化率同比增量超过3个百分点的有几个？", "options": ["5", "6", "7", "8"], "answer": 2, "neg": 0, "steps": ["根据题干“2024 年······同比增量超过······有几个”，可判定本题为 增长量计算问题。定位统计图可知2023 年及2024 年我国不同行业企业发明专利产业化率。根据公式：增长量=现期量-基期量，本题所求企业发明专利产业化率的增长量，2024 年企 业发明专利产业化率相当于现期量，2023 年企业发明专利产业化率相当于基期量，故2024 年各行业企业发明专利产业化率的同比增量如下： 研究和试验发展：32.5%-31.9%=0.6 个百分点，不符合； 专业技术服务业：34.2%-29.6%=4.6 个百分点，符合； 医药制造业：46.8%-43.0%=3.8 个百分点，符合； 计算机、通信和其他电子设备制造业：50.8%<52.2%，即同比减少，不符合； 软件和信息技术服务业：54.9%<55.3%，即同比减少，不符合； 汽车制造业：62.2%<63.3%，即同比减少，不符合； 非金属矿物制造业：63.7%-57.8%=5.9 个百分点，符合； 橡胶和塑料制品业：63.8%-62.5%=1.3 个百分点，不符合； 化学原料和化学制品制造业：64.4%-57.4%=7.0 个百分点，符合； 金属制品业：64.9%-58.1%=6.8 个百分点，符合； 通用设备制造业：67.5%-61.6%=5.9 个百分点，符合； 专用设备制造业：68.9%-66.9%=2.0 个百分点，不符合； 电气机械和器材制造业：71.2%-63.8%=7.4 个百分点，符合。", "综上，资料所列13 个行业中，2024 年企业发明专利产业化率同比增量超过3 个百分点的 有7 个。故正确答案为C。"], "judge": "", "has_img": true, "paper": "gk-2026-zf", "rules": [{"t": "科技·物理生活", "f": "<p>生活现象考原理对应：先判能量/力/光/声，再对选项。<\/p><b class=\"hl\">彩虹<\/b>＝折射+反射+色散；微波加热＝水分子振动（不是辐射残留）；高压锅＝气压升高沸点升高<br>霜/露/雾/云：凝华/液化/液化/液化+凝华", "hot": 1}, {"t": "常识·做题三步", "f": "<p>先看设问是「正确」还是「不正确」（选非题圈「非」打×）；再逐项找硬伤；最后凭「绝对化/时间错位/主体错位」排除。<\/p><b class=\"hl\">① <b>选非题先圈「非」<\/b><\/b>，做完回头再核一遍，每年都有人看反<br>② 拿不准就找「绝对词」（唯一/必须/全部/最早），绝对词多是错的<br>③ 四个选项里通常有两个能一眼排除，别在冷门细节上空耗", "hot": 0}]}, {"id": "gk-2026-zf-q14", "stem": "中国式现代化要靠科技现代化作支撑，实现高质量发展要靠科技创新培育新动能。关于建成科技强国的举措，下列说法正确的是：", "options": ["要坚持有所为有所不为，突出经济发展需求，在重要领域实施科技战略部署", "要充分发挥人才在科技资源配置中的决定性作用，调动产学研各环节的积极性", "要充分发挥科技领军企业龙头作用，鼓励中小企业和民营企业科技创新，支持企业牵头或参与国家重大科技项目", "要降低基础研究组织化程度，强化自由探索，鼓励面向重大科学问题的协同攻关"], "answer": 2, "neg": 0, "steps": ["2024 年6 月24 日，习近平总书记在全国科技大会、国家科学技术奖励大会、两院院士 大会上发表重要讲话（以下简称讲话）。A 项错误，习总书记在讲话中指出：“要保持战略定力，坚持有所为有所不为，突出国家 战略需求，在若干重要领域实施科技战略部署，凝练实施一批新的重大科技项目，形成竞 争优势，赢得战略主动。", "”故“突出经济发展需求”表述错误，应为“突出国家战略需求”。B 项错误，习总书记在讲话中指出：“要充分发挥市场在科技资源配置中的决定性作用， 更好发挥政府各方面作用，调动产学研各环节的积极性，形成共促关键核心技术攻关的工 作格局。", "”故“人才”表述错误，应为“市场”。C 项正确，习总书记在讲话中指出：“融合的关键是强化企业科技创新主体地位。要充分 发挥科技领军企业龙头作用，鼓励中小企业和民营企业科技创新，支持企业牵头或参与国 家重大科技项目。", "” D 项错误，习总书记在讲话中指出：“要提高基础研究组织化程度，完善竞争性支持和稳 定支持相结合的投入机制，强化面向重大科学问题的协同攻关，同时鼓励自由探索，努力 提出原创基础理论、掌握底层技术原理，筑牢科技创新根基和底座。", "”故“降低基础研究 组织化程度”“强化自由探索”“鼓励面向重大科学问题的协同攻关”表述错误，应为“提 高基础研究组织化程度”“鼓励自由探索”“强化面向重大科学问题的协同攻关”。故正确答案为C。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "科技·物理生活", "f": "<p>生活现象考原理对应：先判能量/力/光/声，再对选项。<\/p><b class=\"hl\">彩虹<\/b>＝折射+反射+色散；微波加热＝水分子振动（不是辐射残留）；高压锅＝气压升高沸点升高<br>霜/露/雾/云：凝华/液化/液化/液化+凝华", "hot": 1}, {"t": "常识·做题三步", "f": "<p>先看设问是「正确」还是「不正确」（选非题圈「非」打×）；再逐项找硬伤；最后凭「绝对化/时间错位/主体错位」排除。<\/p><b class=\"hl\">① <b>选非题先圈「非」<\/b><\/b>，做完回头再核一遍，每年都有人看反<br>② 拿不准就找「绝对词」（唯一/必须/全部/最早），绝对词多是错的<br>③ 四个选项里通常有两个能一眼排除，别在冷门细节上空耗", "hot": 0}]}, {"id": "gk-2026-zf-q16", "stem": "坚持问题导向是习近平新时代中国特色社会主义思想的世界观和方法论的重要内容。关于坚持问题导向，下列说法不准确的是：", "options": ["坚持问题导向是马克思主义的鲜明特点", "坚持问题导向要抓住人民最关心最直接最现实的利益问题", "坚持问题导向体现了矛盾的普遍性和客观性", "坚持问题导向本质是变与不变、继承与发展的辩证统一"], "answer": 3, "neg": 0, "steps": ["A 项正确，在习近平新时代中国特色社会主义思想中，必须坚持问题导向并非一般性的 要求，而是上升到了世界观和方法论的高度，具有深刻的哲学内涵。必须坚持问题导向是 马克思主义的鲜明特点，是党的十八大以来党治国理政的突出特点，是推进马克思主义中 国化时代化的现实着眼点。", "B 项正确，习近平总书记强调，要增强问题意识，聚焦人民群众急难愁盼问题等一系列重 大问题。人民最关心最直接最现实的利益问题正是群众急难愁盼问题，坚持问题导向必然 要求抓住这类问题，并以此为着力点制定政策、推进工作，切实解决群众诉求。", "C 项正确，问题是事物矛盾的表现形式，矛盾无处不在、无时不有（普遍性），矛盾是客 观存在的（客观性）。坚持问题导向，就是承认矛盾、分析矛盾、解决矛盾，这直接体现 了矛盾的普遍性和客观性。", "D 项错误，体现变与不变、继承与发展辩证统一的是“坚持守正创新”，而非“坚持问题 导向”。守正意味着坚守马克思主义基本原理、党的根本宗旨等不变的原则，创新则是结 合时代发展推出新理念新思路新办法，二者的结合正是这种辩证统一的体现。", "而坚持问题 导向的本质是实事求是、一切从实际出发，核心是不断认识矛盾、解决矛盾以推动事物发 展。本题为选非题，故正确答案为D。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "科技·物理生活", "f": "<p>生活现象考原理对应：先判能量/力/光/声，再对选项。<\/p><b class=\"hl\">彩虹<\/b>＝折射+反射+色散；微波加热＝水分子振动（不是辐射残留）；高压锅＝气压升高沸点升高<br>霜/露/雾/云：凝华/液化/液化/液化+凝华", "hot": 1}, {"t": "常识·做题三步", "f": "<p>先看设问是「正确」还是「不正确」（选非题圈「非」打×）；再逐项找硬伤；最后凭「绝对化/时间错位/主体错位」排除。<\/p><b class=\"hl\">① <b>选非题先圈「非」<\/b><\/b>，做完回头再核一遍，每年都有人看反<br>② 拿不准就找「绝对词」（唯一/必须/全部/最早），绝对词多是错的<br>③ 四个选项里通常有两个能一眼排除，别在冷门细节上空耗", "hot": 0}]}]}, {"gid": "rw", "title": "人文 · 历史文学地理", "tag": "题量最大的一类", "think": "人文题靠「三对」：朝代—人物—作品、战役—计谋、地理—界线数值。错一项就整项排除。", "rules": [{"t": "人文·朝代人物作品", "f": "《史记》司马迁（西汉）；《资治通鉴》司马光（北宋）；《本草纲目》李时珍（明）<br>诸子：孔子仁、孟子仁政、荀子性恶、老子无为、庄子逍遥、韩非法术势、墨子兼爱非攻", "when": "朝代—人物—作品三段对应，错一个就整项错。"}, {"t": "人文·战役与地理", "f": "巨鹿（项羽）、官渡（曹操）、赤壁（孙刘）、淝水（谢安）＝以少胜多<br>秦岭—淮河：800mm 等降水量线、1 月 0℃ 等温线、亚热带与暖温带分界", "when": "战役对应「以少胜多」，地理对应「界线数值」。"}, {"t": "常识·经济与国情", "f": "财政政策（政府花钱/收税）与货币政策（利率/存款准备金率）方向相反记<br>价格由供求决定；互补品一涨另一需求降，替代品一涨另一需求升", "when": "经济常识抓「宏观调控三工具」和「供求关系」。"}, {"t": "常识·做题三步", "f": "① <b>选非题先圈「非」<\/b>，做完回头再核一遍，每年都有人看反<br>② 拿不准就找「绝对词」（唯一/必须/全部/最早），绝对词多是错的<br>③ 四个选项里通常有两个能一眼排除，别在冷门细节上空耗", "when": "先看设问是「正确」还是「不正确」（选非题圈「非」打×）；再逐项找硬伤；最后凭「绝对化/时间错位/主体错位」排除。"}], "main": [{"id": "zj-2018-A-q76", "stem": "下列关于天文知识的说法正确的是：", "options": ["太阳系中体积最小的行星是海王星", "最早进入太空的航天员是美国的阿姆斯特朗", "世界公认最早的太阳黑子记录出自《春秋》", "地球通常在7 月初经过远日点"], "answer": 3, "neg": 0, "steps": ["本题主要考查地理常识，主要涉及天文知识。A 项错误，太阳系有八大行星，包括水星、金星、地球、火星、木星、土星、天王星和海王星，其中体积最小 的行星是水星。B 项错误，最早进入太空的是苏联航天员加加林，他于1961 年乘坐东方1 号宇宙飞船进入太空。", "美国宇航员 阿姆斯特朗是第一个踏上月球的人，登月时间为1969 年。C 项错误，目前世界上公认最早记录太阳黑子的是东汉班固所写的《汉书•五行志》，记录了发生在公元前28 年的太阳黑子现象。", "D 项正确，地球公转轨道一个是近似正圆的椭圆形轨道，太阳位于椭圆的一个焦点上。每年的7 月初，地球距 离太阳最远，这个位置叫远日点。"], "judge": "", "has_img": false, "paper": "zj-2018-A", "rules"   if(!q){ // 本组主线结束
    if(!extraMode){ return groupEnd(g); }
    st.gi++;st.qi=0;extraMode=false;save();return render();
  }
  cur=q;chosen=-1;submitted=false;
  wrap.innerHTML='';
  var c=el('div','card');
  var head=el('div','gh');
  head.appendChild(el('b',null,'第 '+(st.gi+1)+' 组 · '+g.title));
  head.appendChild(el('span',null,g.tag));
  c.appendChild(head);
  c.appendChild(el('div','qno','第 '+(st.qi+1)+' / '+list.length+' 题'+(st.qi===0&&!extraMode?'（主讲题，先自己做，别急着看答案）':'（强化题）')));
  var sd=el('div','stem',q.stem);
  if(q.judge){ sd.appendChild(el('span','meta','题型判定：'+q.judge)); }
  c.appendChild(sd);
  var box=el('div','opts');
  q.options.forEach(function(o,i){
    var t=String(o).replace(/<[^>]+>/g,'').trim();
    var dup=(t.length<=1)||t===L(i);   /* 图推：选项就是题干图里的 A/B/C/D 四个图 */
    var b=el('button','opt'+(dup?' letteronly':''),'<em>'+L(i)+'</em>'+(dup?'<span class="lp">题干图中的 '+L(i)+' 选项</span>':o));
    b.onclick=function(){ if(submitted)return; chosen=i;
      Array.prototype.forEach.call(box.children,function(x,j){x.classList.toggle('sel',j===i);});
      sub.disabled=false; };
    box.appendChild(b);
  });
  c.appendChild(box);
  var act=el('div','act');
  var sub=el('button','btn','提交答案'); sub.disabled=true;
  sub.onclick=function(){ if(submitted||chosen<0)return; doSubmit(c,box,sub,q,g); };
  act.appendChild(sub);
  act.appendChild(el('span','meta','（计时中，提交后才显示用时）'));
  c.appendChild(act);
  wrap.appendChild(c);
  t0=Date.now();
  // 进度条
  $('#ptext').textContent='已做 '+doneMain()+' / '+totalMain()+' 题';
  $('#pfill').style.width=(doneMain()/totalMain()*100)+'%';
  window.scrollTo({top:0,behavior:'smooth'});
  if(location.search.indexOf('autotest')>=0){
    setTimeout(function(){var o=document.querySelector('.opt');if(o)o.click();
      var s=document.querySelector('.act .btn');if(s)s.click();},40);
  }
}

function doSubmit(card,box,sub,q,g){
  submitted=true;
  var ms=Date.now()-t0, sec=Math.round(ms/1000);
  var ok=(chosen===q.answer);
  st.ans[q.id]={c:chosen,ok:ok,sec:sec};
  save();
  $('#ptext').textContent='已做 '+doneMain()+' / '+totalMain()+' 题';
  $('#pfill').style.width=(doneMain()/totalMain()*100)+'%';
  Array.prototype.forEach.call(box.children,function(x,i){
    x.disabled=true; x.classList.remove('sel');
    if(i===q.answer)x.classList.add('right');
    if(i===chosen&&!ok)x.classList.add('wrong');
  });
  sub.style.display='none';
  card.querySelector('.act .meta').textContent='';
  if(!ok) groupWrong++;

  var res=el('div','res');
  var j=el('div','judge '+(ok?'ok':'bad'),
     (ok?'✔ 答对了':'✘ 答错了')+'　正确答案 '+L(q.answer)+(ok?'':' ｜ 你选了 '+L(chosen))+'');
  res.appendChild(j); if(q.neg){res.appendChild(el('div','meta neg','⚠ 本题是选非题：正确答案＝「不正确／不属于／不能／除外」的那一项。解析里说「正确」的选项都是干扰项，别按常识去选对的那个。'));}
  res.appendChild(el('div','meta','用时 '+sec+' 秒'+(sec>90?'（偏慢，本模块目标 ≤75 秒/题）':'')+'　·　题源 '+q.paper+' '+q.id));

  // 思路
  var b1=el('div','blk');
  b1.appendChild(el('h4',null,'一、这道题怎么想'));
  b1.appendChild(el('div','bd',g.think+(q.judge?'<br><b>本题判定：</b>'+q.judge:'')));
  res.appendChild(b1);

  // 分步
  var b2=el('div','blk');
  b2.appendChild(el('h4',null,'二、分步解法'));
  var ol=el('ol');
  (q.steps.length?q.steps:['官方解析缺失，请对照原卷']).forEach(function(s){ ol.appendChild(el('li',null,s)); });
  b2.appendChild(el('div','bd','')).appendChild(ol);
  res.appendChild(b2);

  // 本题用到的套路（只截这一题用得上的，主用的高亮）
  var b3=el('div','blk');
  b3.appendChild(el('h4',null,'三、这一题要用的套路（抄在题干旁，下次照这个做）'));
  var rw=el('div','bd');
  (q.rules||[]).forEach(function(r){
    var d=el('div','rule'+(r.hot?' hot':''));
    d.appendChild(el('div','rt',(r.hot?'<span class="flag">本题主用</span>':'')+'<b>'+r.t+'</b>'));
    d.appendChild(el('p','',r.f));
    rw.appendChild(d);
  });
  b3.appendChild(rw);
  res.appendChild(b3);

  var act=el('div','act');
  var nx=el('button','btn','下一题 →');
  nx.onclick=function(){ st.qi++; save(); groupWrong=0; render(); };
  act.appendChild(nx);
  res.appendChild(act);
  card.appendChild(res);
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function groupEnd(g){
  wrap.innerHTML='';
  var c=el('div','card sum');
  var total=g.main.length, right=0, secs=0;
  g.main.forEach(function(q){var a=st.ans[q.id];if(a){if(a.ok)right++;secs+=a.sec;}});
  c.appendChild(el('div','big',right+' / '+total));
  c.appendChild(el('p','','本组《'+g.title+'》对 '+right+' 题，平均每题 '+(secs?Math.round(secs/total):0)+' 秒'));
  var advice = right>=3 ? '达标（≥3/4）。可以进下一组。'
             : '没达标（'+right+'/4）。先用下面「再来 3 题」同考点加练，练完再进下一组。';
  c.appendChild(el('p','',advice));
  var act=el('div','act');
  if(right<3 && g.extra.length){
    var more=el('button','btn','再来 '+g.extra.length+' 题同考点加练');
    more.onclick=function(){ extraMode=true;st.qi=0;save();render();};
    act.appendChild(more);
  }
  var next=el('button','btn ghost',(st.gi+1<D.groups.length)?'进下一组：'+D.groups[st.gi+1].title:'看总成绩');
  next.onclick=function(){ st.gi++;st.qi=0;extraMode=false;groupWrong=0;save();render();};
  act.appendChild(next);
  c.appendChild(act);
  wrap.appendChild(c);
  $('#ptext').textContent='已做 '+doneMain()+' / '+totalMain()+' 题';
  $('#pfill').style.width=(doneMain()/totalMain()*100)+'%';
}

function summary(){
  wrap.innerHTML='';
  var c=el('div','card sum');
  var right=doneMain();
  c.appendChild(el('div','big',right+' / '+totalMain()));
  var secs=0;Object.keys(st.ans).forEach(function(k){secs+=st.ans[k].sec||0;});
  c.appendChild(el('p','','常识判断学习模式全部做完，总用时 '+Math.round(secs/60)+' 分钟'));
  var by={};
  D.groups.forEach(function(g){var r=0;g.main.forEach(function(q){if(st.ans[q.id]&&st.ans[q.id].ok)r++;});by[g.title]=r+'/'+g.main.length;});
  Object.keys(by).forEach(function(k){c.appendChild(el('p','',k+'：'+by[k]));});
  var act=el('div','act');
  var re=el('button','btn ghost','重新练一遍（清空本页记录）');
  re.onclick=function(){ if(confirm('确定清空本页记录？')){ localStorage.removeItem(KEY); st={gi:0,qi:0,ans:{},done:false}; save(); render(); } };
  act.appendChild(re);
  c.appendChild(act);
  wrap.appendChild(c);
}

window.__learn={render:render,state:st};
(function(){
  var q=location.search;
  if(q.indexOf('demo1')>=0){        // 渲染「本组小结」用于自检
    D.groups[0].main.forEach(function(it,i){ st.ans[it.id]={c:it.answer,ok:i===0,sec:55}; });
    st.gi=0; st.qi=D.groups[0].main.length; groupEnd(D.groups[0]); return;
  }
  if(q.indexOf('demo2')>=0){        // 渲染「总成绩」用于自检
    D.groups.forEach(function(g){ g.main.forEach(function(it){ st.ans[it.id]={c:it.answer,ok:true,sec:48}; }); });
    st.done=true; summary(); return;
  }
  var mg=/[?&]g=(\d+)/.exec(q);      // 跳到第 N 组自检用
  if(mg){ st.gi=Math.min(D.groups.length-1,Math.max(0,parseInt(mg[1],10)-1)); st.qi=0; }
})();
render();
})();
</script>
</body></html>
