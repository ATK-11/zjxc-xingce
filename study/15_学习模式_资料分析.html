<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习模式 · 资料分析 · 浙江行测</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--sub:#5d6a7a;--line:#e3e8ee;--brand:#146b58;--warn:#b4530a;--chip:#eef5f3;--ok:#0f7b4f;--bad:#b3261e;--okbg:#e8f6ef;--badbg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1c2129;--ink:#e6ebf2;--sub:#93a1b3;--line:#2b333e;--brand:#4fc3a1;--warn:#f0a35e;--chip:#20322e;--ok:#5ed6a0;--bad:#ff8a80;--okbg:#1b2f26;--badbg:#33201e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
a{color:var(--brand)}
.top{display:flex;gap:10px;margin-bottom:10px}
.top a{font-size:13px;text-decoration:none;border:1px solid var(--line);padding:5px 10px;border-radius:8px;background:var(--card)}
h1{font-size:22px;margin:8px 0 4px}
.lead{color:var(--sub);font-size:13px;margin:0 0 14px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.bar .row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.pb{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:14px}
.gh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.gh b{font-size:17px}
.gh span{font-size:12px;color:var(--warn)}
.qno{font-size:12px;color:var(--sub);margin-bottom:8px}
.stem{font-size:15px;line-height:1.75}
.stem .qimg{max-width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
.opt{display:block;width:100%;text-align:left;margin:8px 0 0;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--chip);font-weight:600}
.opt.right{border-color:var(--ok);background:var(--okbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;opacity:1}
.opt em{font-style:normal;font-weight:700;margin-right:6px;color:var(--brand)}
.opt .lp{color:var(--sub);font-size:12.5px}
.opt.letteronly em{font-size:15px}
.act{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 18px;border-radius:10px;border:0;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.res{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.judge{font-size:14px;font-weight:700;margin-bottom:10px}
.judge.ok{color:var(--ok)} .judge.bad{color:var(--bad)}
.blk{margin:10px 0 0}
.blk h4{margin:0 0 5px;font-size:13px;color:var(--brand);letter-spacing:.5px}
.blk .bd{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px}
.blk .bd ol{margin:0;padding-left:20px}
.blk .bd li{margin:4px 0}
.rule{border-left:3px solid var(--line);padding:6px 0 6px 10px;margin:8px 0}
.rule.hot{border-left:3px solid var(--warn);background:#fff8ef;border-radius:0 8px 8px 0;padding:7px 10px 8px 10px}
@media (prefers-color-scheme:dark){.rule.hot{background:#2a2318}}
.rule .rt{margin-bottom:2px}
.rule b{font-size:13.5px}
.rule.hot b{background:linear-gradient(transparent 55%,#ffe08a 55%);padding:0 1px;border-radius:2px}
@media (prefers-color-scheme:dark){.rule.hot b{background:linear-gradient(transparent 55%,#6b5410 55%)}}
.rule.hot b{color:var(--ink)}
.rule b.hl{background:linear-gradient(transparent 55%,#ffe08a 55%);padding:0 1px;border-radius:2px}
@media (prefers-color-scheme:dark){.rule b.hl{background:linear-gradient(transparent 55%,#6b5410 55%)}}
.flag{display:inline-block;font-size:11px;background:var(--warn);color:#fff;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.rule p{margin:3px 0 0;font-size:13.5px;color:var(--sub)}
.rule.hot p{color:var(--ink)}
.meta{font-size:12px;color:var(--sub);margin-top:8px}
.sum{text-align:center;padding:24px 16px}
.sum .big{font-size:34px;font-weight:700;color:var(--brand)}
.sum p{color:var(--sub);font-size:14px}
.note{margin-top:22px;font-size:12px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px}
.hide{display:none}

.mat{background:#f2f5f8;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.75}
.mat .mt{font-size:12px;color:var(--sub);margin-bottom:4px}
.mat img{max-width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
@media (prefers-color-scheme:dark){.mat{background:#1a2330}}
.qimg{max-width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}

.res .meta.neg{display:block;margin:6px 0 2px;padding:7px 10px;border-radius:8px;background:#fff1f2;color:#9f1239;font-size:13px;line-height:1.55;font-weight:600}
body.markmap-dark .res .meta.neg,html[data-theme="dark"] .res .meta.neg{background:#3b0d16;color:#fda4af}
.opt img.qimg{max-width:100%;height:auto;display:block;margin:3px 0;background:#fff}</style></head><body>

构成的完善成熟的多层次资本市场体系。近年由于金融海啸、欧债危机等因素影响，台湾多层次资本市场总体成交值从2010至2012年连续3年下降，2012年较2011年衰退23.28%。周转率也呈现逐年下降趋势，2012年证券交易所集中市场周转率为97%，上柜市场周转率为175%，兴柜市场周转率为27%。<img class=\"qimg\" src=\"../assets/data/real/img/zj2015-mat-3.webp\" />台湾资本市场第一层次是证券交易所集中市场。在准入门槛方面，台湾证交所要求上市企业实收资本6亿新台币以上；从设立年限来看，要求上市企业设立满3年以上；从获利能力来看，要求上市企业最近1个会计年度无累计亏损，且税前利润占财务报表中的比率最近5个年度达到3%以上，或最近2个年度都达6%。至2012年底，上市公司有809家，资本额6.384兆新台币，台湾证券交易所总市值在世界交易所联合会（WFE）会员中排名与前一年份相同，为第22名，所占比重仍为1.34%；成交值排名第15名，排名不变，所占比重由1.41%略微降至1.39%；周转率排名为第9名，较2011年下降2名。台湾资本市场第二层次是上柜市场。在准入门槛方面，上柜市场要求公司实收资本额必须在新台币5000万元以上；从获利能力来看，上柜公司要求个别及合并财务报表获利能力最近年度达4%以上，且其最近一个会计年度结算无累积亏损，或最近二个年度获利能力均达2%以上。至2012年底，上柜公司有638家，资本额0.667兆新台币，总市值1.737兆新台币。台湾资本市场第三层次是兴柜市场。在准入门槛方面，兴柜市场没有营业利润、资本额、设立年限的限制，只须符合已经申报上市或上柜辅导且有两家以上证券商书面推荐。至2012年底，兴柜公司有285家，资本额0.335兆新台币，总市值0.538兆新台币<\/div>2012 年台湾证券交易所集中市场平均每家公司成交值是兴柜市场平均每家公司成交值的倍数为：", "options": ["17.6", "27.6", "37.6", "47.6"], "answer": 3, "neg": 0, "steps": ["第一步，本题考查平均数与倍数杂糅计算。", "第二步，定位表格，“证交所集中市场挂牌公司数为 809 家，总成交值 20789×10 亿新台币；兴柜市场 285 家， 总成交值 154×10 亿新台币”。", "第三步，根据公式，倍数＝前/后、平均数＝总数/总份数，代入数据得， 倍。 因此，选择 D 选项。"], "judge": "", "has_img": true, "paper": "zj-2015-A", "rules": [{"t": "平均数与倍数", "f": "<p>「人均/单位面积/户均」「A 是 B 的几倍」<\/p><b class=\"hl\">平均数<\/b> = 总数 ÷ 总份数；倍数 = A ÷ B<br>「均前每后」的量作分母；出现「年均/月均/日均」要除以对应时间", "hot": 1}, {"t": "截位估算 / 拆分法", "f": "<p>选项差距大 / 要求很精确<\/p><b class=\"hl\">截位<\/b>：分子分母各取「老大」，四舍五入留两位，其余按老大舍的位数截<br>拆分：把数拆成好算的两块相加", "hot": 0}]}, {"id": "zj-2018-A-q123", "stem": "<div class=\"mat\"><div class=\"mt\">📄 材料一（材料在下面，先读材料再做题）<\/div>2015 年 7 月，京津冀区域 13 个城市空气质量超标天数平均占当月总天数的<img class=\"qimg\" src=\"../assets/data/real/img/zj2018-mat-1-g1-inl0.webp\" />，平均达标天数比上年同<br>期下降 6 个百分点。与全国 74 个城市相比，京津冀区域平均重度污染天数占比高 4.4 个百分点。而与上年同期<br>相比，74 个城市平均达标天数占比也由<img class=\"qimg\" src=\"../assets/data/real/img/zj2018-mat-1-g1-inl1.webp\" />下降到<img class=\"qimg\" src=\"../assets/data/real/img/zj2018-mat-1-g1-inl2.webp\" />。<br>与上年同期相比，2015 年 7 月京津冀区域 13 个城市平均 PM2.5 和 PM10 浓度分别上升<img class=\"qimg\" src=\"../assets/data   c.appendChild(el('div','qno','第 '+(st.qi+1)+' / '+list.length+' 题'+(st.qi===0&&!extraMode?'（主讲题，先自己做，别急着看答案）':'（强化题）')));
  var sd=el('div','stem',q.stem);
  if(q.judge){ sd.appendChild(el('span','meta','题型判定：'+q.judge)); }
  c.appendChild(sd);
  var box=el('div','opts');
  q.options.forEach(function(o,i){
    var t=String(o).replace(/<[^>]+>/g,'').trim();
    var hasimg=/<img/i.test(String(o)); var dup=(!hasimg)&&((t.length<=1)||t===L(i));   /* 图推：选项就是题干图里的 A/B/C/D 四个图 */
    var b=el('button','opt'+(dup?' letteronly':''),'<em>'+L(i)+'</em>'+(dup?'<span class="lp">题干图中的 '+L(i)+' 选项</span>':o));
    b.onclick=function(){ if(submitted)return; chosen=i;
      Array.prototype.forEach.call(box.children,function(x,j){x.classList.toggle('sel',j===i);});
      sub.disabled=false; };
    box.appendChild(b);
  });
  c.appendChild(box);
  var act=el('div','act');
  var sub=el('button','btn','提交答案'); sub.disabled=true;
  sub.onclick=function(){ if(submitted||chosen<0)return; doSubmit(c,box,sub,q,g); };
  act.appendChild(sub);
  act.appendChild(el('span','meta','（计时中，提交后才显示用时）'));
  c.appendChild(act);
  wrap.appendChild(c);
  t0=Date.now();
  // 进度条
  $('#ptext').textContent='已做 '+doneMain()+' / '+totalMain()+' 题';
  $('#pfill').style.width=(doneMain()/totalMain()*100)+'%';
  window.scrollTo({top:0,behavior:'smooth'});
  if(location.search.indexOf('autotest')>=0){
    setTimeout(function(){var o=document.querySelector('.opt');if(o)o.click();
      var s=document.querySelector('.act .btn');if(s)s.click();},40);
  }
}

function doSubmit(card,box,sub,q,g){
  submitted=true;
  var ms=Date.now()-t0, sec=Math.round(ms/1000);
  var ok=(chosen===q.answer);
  st.ans[q.id]={c:chosen,ok:ok,sec:sec};
  save();
  $('#ptext').textContent='已做 '+doneMain()+' / '+totalMain()+' 题';
  $('#pfill').style.width=(doneMain()/totalMain()*100)+'%';
  Array.prototype.forEach.call(box.children,function(x,i){
    x.disabled=true; x.classList.remove('sel');
    if(i===q.answer)x.classList.add('right');
    if(i===chosen&&!ok)x.classList.add('wrong');
  });
  sub.style.display='none';
  card.querySelector('.act .meta').textContent='';
  if(!ok) groupWrong++;

  var res=el('div','res');
  var j=el('div','judge '+(ok?'ok':'bad'),
     (ok?'✔ 答对了':'✘ 答错了')+'　正确答案 '+L(q.answer)+(ok?'':' ｜ 你选了 '+L(chosen))+'');
  res.appendChild(j); if(q.neg){res.appendChild(el('div','meta neg','⚠ 本题是选非题：正确答案＝「不正确／不属于／不能／除外」的那一项。解析里说「正确」的选项都是干扰项，别按常识去选对的那个。'));}
  res.appendChild(el('div','meta','用时 '+sec+' 秒'+(sec>90?'（偏慢，本模块目标 ≤75 秒/题）':'')+'　·　题源 '+q.paper+' '+q.id));

  // 思路
  var b1=el('div','blk');
  b1.appendChild(el('h4',null,'一、这道题怎么想'));
  b1.appendChild(el('div','bd',g.think+(q.judge?'<br><b>本题判定：</b>'+q.judge:'')));
  res.appendChild(b1);

  // 分步
  var b2=el('div','blk');
  b2.appendChild(el('h4',null,'二、分步解法'));
  var ol=el('ol');
  (q.steps.length?q.steps:['官方解析缺失，请对照原卷']).forEach(function(s){ ol.appendChild(el('li',null,s)); });
  b2.appendChild(el('div','bd','')).appendChild(ol);
  res.appendChild(b2);

  // 本题用到的套路（只截这一题用得上的，主用的高亮）
  var b3=el('div','blk');
  b3.appendChild(el('h4',null,'三、这一题要用的套路（抄在题干旁，下次照这个做）'));
  var rw=el('div','bd');
  (q.rules||[]).forEach(function(r){
    var d=el('div','rule'+(r.hot?' hot':''));
    d.appendChild(el('div','rt',(r.hot?'<span class="flag">本题主用</span>':'')+'<b>'+r.t+'</b>'));
    d.appendChild(el('p','',r.f));
    rw.appendChild(d);
  });
  b3.appendChild(rw);
  res.appendChild(b3);

  var act=el('div','act');
  var nx=el('button','btn','下一题 →');
  nx.onclick=function(){ st.qi++; save(); groupWrong=0; render(); };
  act.appendChild(nx);
  res.appendChild(act);
  card.appendChild(res);
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function groupEnd(g){
  wrap.innerHTML='';
  var c=el('div','card sum');
  var total=g.main.length, right=0, secs=0;
  g.main.forEach(function(q){var a=st.ans[q.id];if(a){if(a.ok)right++;secs+=a.sec;}});
  c.appendChild(el('div','big',right+' / '+total));
  c.appendChild(el('p','','本组《'+g.title+'》对 '+right+' 题，平均每题 '+(secs?Math.round(secs/total):0)+' 秒'));
  var advice = right>=3 ? '达标（≥3/4）。可以进下一组。'
             : '没达标（'+right+'/4）。先用下面「再来 3 题」同考点加练，练完再进下一组。';
  c.appendChild(el('p','',advice));
  var act=el('div','act');
  if(right<3 && g.extra.length){
    var more=el('button','btn','再来 '+g.extra.length+' 题同考点加练');
    more.onclick=function(){ extraMode=true;st.qi=0;save();render();};
    act.appendChild(more);
  }
  var next=el('button','btn ghost',(st.gi+1<D.groups.length)?'进下一组：'+D.groups[st.gi+1].title:'看总成绩');
  next.onclick=function(){ st.gi++;st.qi=0;extraMode=false;groupWrong=0;save();render();};
  act.appendChild(next);
  c.appendChild(act);
  wrap.appendChild(c);
  $('#ptext').textContent='已做 '+doneMain()+' / '+totalMain()+' 题';
  $('#pfill').style.width=(doneMain()/totalMain()*100)+'%';
}

function summary(){
  wrap.innerHTML='';
  var c=el('div','card sum');
  var right=doneMain();
  c.appendChild(el('div','big',right+' / '+totalMain()));
  var secs=0;Object.keys(st.ans).forEach(function(k){secs+=st.ans[k].sec||0;});
  c.appendChild(el('p','','资料分析学习模式全部做完，总用时 '+Math.round(secs/60)+' 分钟'));
  var by={};
  D.groups.forEach(function(g){var r=0;g.main.forEach(function(q){if(st.ans[q.id]&&st.ans[q.id].ok)r++;});by[g.title]=r+'/'+g.main.length;});
  Object.keys(by).forEach(function(k){c.appendChild(el('p','',k+'：'+by[k]));});
  var act=el('div','act');
  var re=el('button','btn ghost','重新练一遍（清空本页记录）');
  re.onclick=function(){ if(confirm('确定清空本页记录？')){ localStorage.removeItem(KEY); st={gi:0,qi:0,ans:{},done:false}; save(); render(); } };
  act.appendChild(re);
  c.appendChild(act);
  wrap.appendChild(c);
}

window.__learn={render:render,state:st};
(function(){
  var q=location.search;
  if(q.indexOf('demo1')>=0){        // 渲染「本组小结」用于自检
    D.groups[0].main.forEach(function(it,i){ st.ans[it.id]={c:it.answer,ok:i===0,sec:55}; });
    st.gi=0; st.qi=D.groups[0].main.length; groupEnd(D.groups[0]); return;
  }
  if(q.indexOf('demo2')>=0){        // 渲染「总成绩」用于自检
    D.groups.forEach(function(g){ g.main.forEach(function(it){ st.ans[it.id]={c:it.answer,ok:true,sec:48}; }); });
    st.done=true; summary(); return;
  }
  var mg=/[?&]g=(\d+)/.exec(q);      // 跳到第 N 组自检用
  if(mg){ st.gi=Math.min(D.groups.length-1,Math.max(0,parseInt(mg[1],10)-1)); st.qi=0; }
})();
render();
})();
</script>
</body></html>
