<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习模式 · 数量关系 · 浙江行测</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--sub:#5d6a7a;--line:#e3e8ee;--brand:#146b58;--warn:#b4530a;--chip:#eef5f3;--ok:#0f7b4f;--bad:#b3261e;--okbg:#e8f6ef;--badbg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1c2129;--ink:#e6ebf2;--sub:#93a1b3;--line:#2b333e;--brand:#4fc3a1;--warn:#f0a35e;--chip:#20322e;--ok:#5ed6a0;--bad:#ff8a80;--okbg:#1b2f26;--badbg:#33201e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
a{color:var(--brand)}
.top{display:flex;gap:10px;margin-bottom:10px}
.top a{font-size:13px;text-decoration:none;border:1px solid var(--line);padding:5px 10px;border-radius:8px;background:var(--card)}
h1{font-size:22px;margin:8px 0 4px}
.lead{color:var(--sub);font-size:13px;margin:0 0 14px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.bar .row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.pb{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:14px}
.gh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.gh b{font-size:17px}
.gh span{font-size:12px;color:var(--warn)}
.qno{font-size:12px;color:var(--sub);margin-bottom:8px}
.stem{font-size:15px;line-height:1.75}
.stem .qimg{max-width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
.opt{display:block;width:100%;text-align:left;margin:8px 0 0;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--chip);font-weight:600}
.opt.right{border-color:var(--ok);background:var(--okbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;opacity:1}
.opt em{font-style:normal;font-weight:700;margin-right:6px;color:var(--brand)}
.opt .lp{color:var(--sub);font-size:12.5px}
.opt.letteronly em{font-size:15px}
.act{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 18px;border-radius:10px;border:0;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.res{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.judge{font-size:14px;font-weight:700;margin-bottom:10px}
.judge.ok{color:var(--ok)} .judge.bad{color:var(--bad)}
.blk{margin:10px 0 0}
.blk h4{margin:0 0 5px;font-size:13px;color:var(--brand);letter-spacing:.5px}
.blk .bd{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px}
.blk .bd ol{margin:0;padding-left:20px}
.blk .bd li{margin:4px 0}
.rule{border-left:3px solid var(--line);padding:6px 0 6px 10px;margin:8px 0}
.rule.hot{border-left:3px solid var(--warn);background:#fff8ef;border-radius:0 8px 8px 0;padding:7px 10px 8px 10px}
@media (prefers-color-scheme:dark){.rule.hot{background:#2a2318}}
.rule .rt{margin-bottom:2px}
.rule b{font-size:13.5px}
.rule.hot b{background:linear-gradient(transparent 55%,#ffe08a 55%);padding:0 1px;border-radius:2px}
@media (prefers-color-scheme:dark){.rule.hot b{background:linear-gradient(transparent 55%,#6b5410 55%)}}
.rule.hot b{color:var(--ink)}
.rule b.hl{background:linear-gradient(transparent 55%,#ffe08a 55%);padding:0 1px;border-radius:2px}
@media (prefers-color-scheme:dark){.rule b.hl{background:linear-gradient(transparent 55%,#6b5410 55%)}}
.flag{display:inline-block;font-size:11px;background:var(--warn);color:#fff;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.rule p{margin:3px 0 0;font-size:13.5px;color:var(--sub)}
.rule.hot p{color:var(--ink)}
.meta{font-size:12px;color:var(--sub);margin-top:8px}
.sum{text-align:center;padding:24px 16px}
.sum .big{font-size:34px;font-weight:700;color:var(--brand)}
.sum p{color:var(--sub);font-size:14px}
.note{margin-top:22px;font-size:12px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px}
.hide{display:none}

.mat{background:#f2f5f8;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.75}
.mat .mt{font-size:12px;color:var(--sub);margin-bottom:4px}
.mat img{max-width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
@media (prefers-color-scheme:dark){.mat{background:#1a2330}}
.qimg{max-width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}

.res .meta.neg{display:block;margin:6px 0 2px;padding:7px 10px;border-radius:8px;background:#fff1f2;color:#9f1239;font-size:13px;line-height:1.55;font-weight:600}
body.markmap-dark .res .meta.neg,html[data-theme="dark"] .res .meta.neg{background:#3b0d16;color:#fda4af}
.opt img.qimg{max-width:100%;height:auto;display:block;margin:3px 0;background:#fff}
/* ============================================================
   学习模式 · UI v3 视觉增强层（2026-11-19）
   原则：只覆盖样式，不改 DOM 结构、不改 JS 逻辑；
   追加在基础 CSS 之后，同优先级由后出现的规则覆盖。
   ============================================================ */

/* ---------- 全局 ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:rgba(0,0,0,0);letter-spacing:.01em;
     text-rendering:optimizeLegibility}
.wrap{max-width:800px;padding:16px 14px calc(52px + env(safe-area-inset-bottom,0px))}
a{text-decoration:none}

/* ---------- 顶部科目导航（12–15 页用 .nav） ---------- */
.nav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 0 4px;
     scrollbar-width:none;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;font-size:13px;line-height:1;padding:9px 13px;border-radius:999px;
       border:1px solid var(--line);background:var(--card);color:var(--sub);
       white-space:nowrap;transition:background .15s,color .15s,border-color .15s,box-shadow .15s}
.nav a:hover{border-color:var(--brand);color:var(--brand)}
.nav a.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;
          box-shadow:0 4px 12px -6px rgba(20,107,88,.85)}
.nav a.on:hover{color:#fff}

/* 第 11 页用的是 .top，统一成同样的胶囊尺寸 */
.top{gap:8px;margin-bottom:12px;flex-wrap:wrap}
.top a{font-size:13px;line-height:1;padding:9px 13px;border-radius:999px;color:var(--sub);
       transition:background .15s,color .15s,border-color .15s}
.top a:hover{border-color:var(--brand);color:var(--brand)}
.top a.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;
          box-shadow:0 4px 12px -6px rgba(20,107,88,.85)}
.top a.on:hover{color:#fff}

/* ---------- 标题与说明 ---------- */
h1{font-size:20px;line-height:1.45;letter-spacing:.02em;margin:6px 0 10px}
.lead{font-size:12.5px;line-height:1.75;color:var(--sub);background:var(--chip);
      border-radius:12px;padding:10px 12px;margin:0 0 12px}
.lead b{color:var(--brand)}

/* ---------- 进度条 ---------- */
.bar{padding:10px 2px;margin-bottom:16px;border-bottom:1px solid var(--line);background:var(--bg)}
.bar .row{font-size:12.5px;gap:12px}
.pb{height:8px;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.pb i{background:linear-gradient(90deg,var(--brand) 0%,#2fa585 100%);border-radius:99px}

/* ---------- 题卡 ---------- */
.card{border-radius:16px;padding:18px 16px 16px;
      box-shadow:0 1px 2px rgba(16,24,40,.04),0 10px 28px -20px rgba(16,24,40,.45)}
.gh{gap:8px;margin-bottom:10px;align-items:center}
.gh::before{content:"";flex:0 0 3px;width:3px;height:15px;border-radius:2px;background:var(--brand)}
.gh b{font-size:16px;line-height:1.4;letter-spacing:.01em}
.gh span{font-size:11.5px;color:var(--warn);background:var(--chip);border-radius:999px;
         padding:2px 9px;line-height:1.6}
.qno{display:inline-block;font-size:11.5px;color:var(--sub);background:var(--chip);
     border-radius:999px;padding:3px 10px;margin:0 0 10px;line-height:1.6}

/* ---------- 题干 ---------- */
.stem{font-size:16px;line-height:1.85;text-align:justify}
.stem .meta{display:block;margin-top:8px;font-size:11.5px}

/* ---------- 选项 ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;min-height:46px;margin:10px 0 0;
     padding:11px 13px;border-radius:12px;background:var(--card);
     box-shadow:0 1px 0 rgba(16,24,40,.03);
     transition:border-color .15s,background .15s,transform .12s,box-shadow .15s}
.opt:hover{border-color:var(--brand);box-shadow:0 3px 12px -8px rgba(16,24,40,.55)}
.opt:active{transform:scale(.995)}
.opt em{display:inline-flex;align-items:center;justify-content:center;
        flex:0 0 24px;width:24px;height:24px;margin:1px 0 0;border-radius:50%;
        background:var(--chip);color:var(--brand);font-size:12.5px;font-weight:700;
        transition:background .15s,color .15s}
.opt.sel{border-color:var(--brand);background:var(--chip);font-weight:600}
.opt.sel em{background:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg);font-weight:600}
.opt.right em{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong em{background:var(--bad);color:#fff}
.opt.sel::after,.opt.right::after,.opt.wrong::after{
  margin-left:auto;flex:0 0 auto;padding-left:8px;line-height:24px;
  font-size:11.5px;font-weight:700;white-space:nowrap}
.opt.sel::after{content:"已选";color:var(--brand)}
.opt.right::after{content:"✓ 正确答案";color:var(--ok)}
.opt.wrong::after{content:"✗ 你选的";color:var(--bad)}
.opt.letteronly em{font-size:12.5px}

/* ---------- 按钮 ---------- */
.act{gap:10px;margin-top:16px}
.btn{flex:1 1 auto;min-width:132px;padding:12px 18px;border-radius:12px;font-size:15px;
     letter-spacing:.02em;box-shadow:0 6px 18px -10px rgba(20,107,88,.85);
     transition:transform .12s,box-shadow .15s,opacity .15s}
.btn:hover{box-shadow:0 8px 22px -10px rgba(20,107,88,.9)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{box-shadow:none;opacity:.4}
.btn.ghost{background:var(--card);border:1px solid var(--brand);color:var(--brand);box-shadow:none}
.btn.ghost[disabled]{opacity:.4}
.act .meta{font-size:11.5px;margin-top:0}

/* ---------- 答案与解析 ---------- */
.res{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.judge{display:flex;align-items:center;font-size:14px;line-height:1.6;margin:0 0 10px;
       padding:10px 12px;border-radius:10px;background:var(--okbg);color:var(--ok);
       letter-spacing:.02em}
.judge.bad{background:var(--badbg);color:var(--bad)}
.res>.meta{font-size:11.5px;margin:0 4px 2px}
.blk{margin:16px 0 0}
.blk h4{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12.5px;
        font-weight:700;color:var(--brand);letter-spacing:.08em}
.blk h4::before{content:"";flex:0 0 3px;width:3px;height:12px;border-radius:2px;
                background:currentColor;opacity:.6}
.blk .bd{background:transparent;border:1px solid var(--line);border-radius:12px;
         padding:12px 14px;font-size:14px;line-height:1.8}
.blk .bd ol{margin:0;padding-left:20px}
.blk .bd li{margin:0;padding:7px 0;border-bottom:1px dashed var(--line)}
.blk .bd li:first-child{padding-top:0}
.blk .bd li:last-child{border-bottom:0;padding-bottom:0}

/* ---------- 套路卡 ---------- */
.rule{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;
      padding:10px 12px;margin:10px 0 0;background:var(--card)}
.rule:first-child{margin-top:0}
.rule.hot{border-color:var(--warn);border-left-color:var(--warn);background:#fff8ef}
@media (prefers-color-scheme:dark){.rule.hot{background:#2a2318}}
.rule .rt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px}
.rule b{font-size:13px;line-height:1.6}
.rule.hot b{color:var(--ink)}
.rule p{margin:2px 0 0;font-size:13px;line-height:1.7;color:var(--sub)}
.rule.hot p{color:var(--ink)}
.flag{font-size:10.5px;padding:1px 6px;border-radius:4px;vertical-align:0}

/* ---------- 材料 ---------- */
.mat{background:var(--chip);border-radius:12px;padding:12px 14px;margin-bottom:14px;
     font-size:13.5px;line-height:1.8}
.mat .mt{font-size:11.5px;color:var(--sub);letter-spacing:.04em;margin-bottom:6px}

/* ---------- 本组小结 / 总成绩 ---------- */
.sum{text-align:center;padding:32px 20px}
.sum .big{font-size:44px;line-height:1.15;color:var(--brand);letter-spacing:.02em}
.sum p{color:var(--sub);font-size:13px;line-height:1.8;margin:8px 0 0}
.sum .act{justify-content:center}

/* ---------- 页脚说明 ---------- */
.note{font-size:11.5px;line-height:1.8;margin-top:24px}

/* ---------- 触控与窄屏 ---------- */
@media (max-width:420px){
  .wrap{padding-left:12px;padding-right:12px}
  .card{padding:16px 14px 14px;border-radius:14px}
  .opt{padding:10px 12px}
  .act{flex-direction:column;align-items:stretch}
  .act .btn{width:100%}
  .act .meta{text-align:center}
  .stem{font-size:15.5px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}</style></head><body>

, "rules": [{"t": "工程问题", "f": "<p>出现「完成一项工程需要…天」「效率」<\/p>给定时间型：赋总量 = 时间的公倍数；给<b class=\"hl\">效率<\/b>比型：直接设效率", "hot": 1}, {"t": "不定方程（组）", "f": "<p>未知数多于方程个数，且要求整数解<\/p><b class=\"hl\">用整除、奇偶、尾数、代入缩小范围<\/b>", "hot": 0}]}, {"id": "zj-2018-A-q64", "stem": "小王购买甲、乙两种特价商品。甲商品打八折后每件52 元，乙商品打八五折后每件34 元，小王购买这些<br>商品总共比打折前节省了83 元。问他购买这两种特价商品总共支出了多少元？", "options": ["544", "445", "427", "362"], "answer": 3, "neg": 0, "steps": ["第一步，甲商品打八折后每件52元，原价52÷0.8＝65（元），每件省65－52＝13（元）。", "第二步，乙商品打八五折后每件34元，原价34÷0.85＝40（元），每件省40－34＝6（元）。", "第三步，设买甲a件、乙b件，共省13a＋6b＝83（元），即不定方程。83为奇数，6b为偶数，故13a必为奇数，a为奇数：a＝1时b＝11.67不整；a＝3时b＝7.33不整；a＝5时b＝（83－65）÷6＝3，成立（题干为「特价商品」，取可行解）。", "第四步，实际支出52×5＋34×3＝260＋102＝362（元）。因此，选择D选项。"], "judge": "", "has_img": false, "paper": "zj-2018-A", "rules": [{"t": "经济利润", "f": "<p>成本、售价、利润、折扣、利润率<\/p><b class=\"hl\">利润<\/b> = 售价−成本；利润率 = 利润÷成本；打折售价 = 原价×折扣；设成本为 100 最好算", "hot": 1}, {"t": "方程法", "f": "<p>有等量关系、能设未知数<\/p><b class=\"hl\">设未知数<\/b> → 列等式 → 解；复杂时设中间量", "hot": 0}]}], "extra": [{"id": "gk-2026-zf-q66", "stem": "某商品每件售价100元，每天可售出若干件。若每件降价10%，日销量可提高25%，且单日利润与降价前相同。问该商品的成本为每件多少元？", "options": ["50", "60", "70", "80"], "answer": 0, "neg": 0, "steps": ["第一步，设该商品每件成本为x元，降价前日销量为m件。降价后每件售价为100×（1－10%）＝90（元），日销量为（1＋25%）m＝1.25m（件）。", "第二步，单日利润＝（售价－成本）×销量，降价前后单日利润相同：（100－x）×m＝（90－x）×1.25m。", "第三步，两边约去m：100－x＝112.5－1.25x，移项得0.25x＝12.5，解得x＝50（元/件）。", "第四步，另用比例验证：降价使每件利润少10元，总利润不变则单件利润与销量成反比，销量比1∶1.25＝4∶5，故单件利润比5∶4，相差1份即10元，降价前单件利润50元，成本100－50＝50（元/件）。因此，选择A选项。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "经济利润", "f": "<p>成本、售价、利润、折扣、利润率<\/p><b class=\"hl\">利润<\/b> = 售价−成本；利润率 = 利润÷成本；打折售价 = 原价×折扣；设成本为 100 最好算", "hot": 1}, {"t": "方程法", "f": "<p>有等量关系、能设未知数<\/p><b class=\"hl\">设未知数<\/b> → 列等式 → 解；复杂时设中间量", "hot": 0}]}, {"id": "gk-2026-zf-q68", "stem": "小王从甲地匀速前往乙地，到达后立刻匀速返回。已知他去程的用时比返程多3小时，去程的速度是返程的40%，且往返的平均速度为40千米/小时，问甲、乙两地相距多少千米？", "options": ["70", "140", "210", "280"], "answer": 1, "neg": 0, "steps": ["第一步，去程速度是返程的40%，即v去∶v返＝40∶100＝2∶5。", "第二步，路程相同，速度与时间成反比，故t去∶t返＝5∶2。设t去＝5x、t返＝2x，由「去程用时比返程多3小时」得5x－2x＝3，解得x＝1，故t去＝5小时、t返＝2小时，往返共用7小时。", "第三步，往返平均速度40千米/小时，往返总路程＝40×7＝280（千米）。", "第四步，甲、乙两地距离＝280÷2＝140（千米）。因此，选择B选项。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "行程问题", "f": "<p>路程、速度、时间三者关系<\/p>普通行程 s=vt；相遇 s=(v₁+v₂)t；追及 s=(v₁−v₂)t；平均<b class=\"hl\">速度<\/b> = 总路程÷总时间（不是速度平均）", "hot": 1}, {"t": "数字特性法", "f": "<p>出现比例、倍数、奇偶、尾数、整除字眼<\/p>用<b class=\"hl\">奇偶<\/b>性/整除性/倍数关系直接排除选项", "hot": 0}]}, {"id": "gk-2026-zf-q71", "stem": "某单位从所有职工中随机选3人参加某个会议，张立和李磊2人中只有1人被选中的概率，是2人均被选中概率的30倍。问该单位有职工多少人？", "options": ["15", "17", "29", "33"], "answer": 3, "neg": 0, "steps": ["第一步，设该单位有职工n人（n＞3，否则凑不出3人）。", "第二步，「2人中只有1人被选中」的情况数：先从张、李中选1人（2种），再从其余n－2人中选2人，即2×（n－2）（n－3）÷2＝（n－2）（n－3）。", "第三步，「2人均被选中」的情况数：从其余n－2人中再选1人，即n－2种。", "第四步，两者的概率分母同为从n人中选3人的C（n,3），故概率比等于情况数之比：（n－2）（n－3）∶（n－2）＝30∶1，约去n－2得n－3＝30，n＝33。", "第五步，代入验证：只有1人被选中的情况数31×30＝930，均被选中31种，930÷31＝30，符合。因此，选择D选项。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "工程问题", "f": "<p>出现「完成一项工程需要…天」「效率」<\/p>给定时间型：赋总量 = 时间的公倍数；给<b class=\"hl\">效率<\/b>比型：直接设效率", "hot": 1}, {"t": "不定方程（组）", "f": "<p>未知数多于方程个数，且要求整数解<\/p><b class=\"hl\">用整除、奇偶、尾数、代入缩小范围<\/b>", "hot": 0}]}]}, {"gid": "pl", "title": "计数 · 排列组合/概率/容斥/最值", "tag": "会一题赚一题", "think": "先判「有序还是无序」（排列 vs 组合），再看「分类还是分步」（加法 vs 乘法）；概率＝满足条件的数 ÷ 总数；最值看「最不利构造」。", "rules": [{"t": "排列组合", "f": "排列 A(n,m)=n!/(n−m)!；组合 C(n,m)；相邻用捆绑、不相邻用插空、相同元素用隔板", "when": "「多少种安排/选法」，有顺序要求或分组"}, {"t": "概率", "f": "古典概型 = 满足条件数 ÷ 总数；分步相乘、分类相加；对立事件 1−P", "when": "「概率是多少」"}, {"t": "容斥问题", "f": "两集合：A+B−AB = 总数−都不<br>三集合标准：A+B+C−AB−AC−BC+ABC = 总数−都不<br>三集合非标准：只满足两个的、只满足一个的分开算", "when": "「都参加」「只参加」「都不」"}, {"t": "最值问题", "f": "最不利构造：最坏情况 +1<br>数列构造：设最大/最小为 x，其余按条件列不等式", "when": "「至少…才能保证」「最多/最少是多少」"}, {"t": "数字特性法", "f": "用奇偶性/整除性/倍数关系直接排除选项", "when": "出现比例、倍数、奇偶、尾数、整除字眼"}], "main": [{"id": "zj-2015-A-q62", "stem": "野生动物保护机构考查某圈养动物的状态，在 n（n 为正整数）天中观察到：（1）有 7 个不活跃日（一天<br>中有出现不活跃的情况）；（2）有 5 个下午活跃;（3）有 6 个上午活跃；（4）当下午不活跃时，上午必活跃。<br>则 n 等于：", "options": ["7", "8", "9", "10"], "answer": 2, "neg": 0, "steps": ["第一步，本题考查二集合容斥。", "第二步，由条件④「当下午不活跃时，上午必活跃」可知，不存在上午、下午都不活跃的日子，n天中「至少有一个半天活跃」。", "第三步，总天数n中，7天不活跃，则上下午都活跃的天数为n－7。", "第四步，代入二集合容斥公式：上午活跃6天＋下午活跃5天－上下午都活跃（n－7）＝总天数n，即6＋5－（n－7）＝n，解得n＝9（天）。因此，选择C选项。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "排列组合", "f": "<p>「多少种安排/选法」，有顺序要求或分组<\/p>排列 A(n,m)=n!/(n−m)!；组合 C(n,m)；相邻用捆绑、不相邻用插空、相同元素用隔板", "hot": 1}, {"t": "数字特性法", "f": "<p>出现比例、倍数、奇偶、尾数、整除字眼<\/p>用<b class=\"hl\">奇偶<\/b>性/整除性/倍数关系直接排除选项", "hot": 0}]}, {"id": "zj-2015-A-q63", "stem": "每年三月某单位都要组织员工去 A、B 两地参加植树活动。已知去 A 地每人往返车费 20 元，人均植树 5 棵，<br>去 B 地每人往返车费 30 元，人均植树 3 棵，设到 A 地员工有 x 人，A、B 两地共植树 y 棵，y 与 x 之间满足 y=8x-15，<br>若往返车费总和不超过 3000 元，那么，最多可植树多少棵？", "options": ["489", "400", "498", "500"], "answer": 0, "neg": 0, "steps": ["第一步，A地有员工x人，人均植树5棵，则在A地植树5x棵；总植树y＝8x－15，故B地植树（8x－15）－5x＝3x－15棵，B地人均3棵，B地人数为（3x－15）÷3＝x－5（人）。", "第二步，总车费不超过3000元：20x＋30（x－5）≤3000，即50x≤3150，解得x≤63。", "第三步，y＝8x－15随x增大而增大，x＝63时y最大：y＝8×63－15＝489（棵）。", "第四步，另用数字特性：y＝8x－15必为奇数（偶数减奇数），四个选项中只有489为奇数，直接选A。因此，选择A选项。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "容斥问题", "f": "<p>「都参加」「只参加」「都不」<\/p><b class=\"hl\">两集合：A+B−AB = 总数−都不<\/b><br>三集合标准：A+B+C−AB−AC−BC+ABC = 总数−都不<br>三集合非标准：只满足两个的、只满足一个的分开算", "hot": 1}, {"t": "数字特性法", "f": "<p>出现比例、倍数、奇偶、尾数、整除字眼<\/p>用<b class=\"hl\">奇偶<\/b>性/整除性/倍数关系直接排除选项", "hot": 0}]}, {"id": "zj-2018-A-q51", "stem": "某班共有8 名战士，现在从中挑出4 人平均分成两个战斗小组分别参加射击和格斗考核，问共有多少种不<br>同的方案？", "options": ["210", "420", "630", "840"], "answer": 1, "neg": 0, "steps": ["第一步，先在8人中选2人参加射击考核：C（8,2）＝28（种）。", "第二步，再从剩下6人中选2人参加格斗考核：C（6,2）＝15（种）。", "第三步，两步相乘：28×15＝420（种）。", "第四步，另一算法验证：先从8人选4人C（8,4）＝70，再把4人分成射击2人、格斗2人C（4,2）＝6，70×6＝420（种）。因此，选择B选项。"], "judge": "", "has_img": false, "paper": "zj-2018-A", "rules": [{"t": "排列组合", "f": "<p>「多少种安排/选法」，有顺序要求或分组<\/p>排列 A(n,m)=n!/(n−m)!；组合 C(n,m)；相邻用捆绑、不相邻用插空、相同元素用隔板", "hot": 1}, {"t": "数字特性法", "f": "<p>出现比例、倍数、奇偶、尾数、整除字眼<\/p>用<b class=\"hl\">奇偶<\/b>性/整除性/倍数关系直接排除选项", "hot": 0}]}, {"id": "zj-2018-A-q54", "stem": "某测验包含10 道选择题，评分标准为答对得3 分，答错扣1 分，不答得0 分，且分数可以为负数。如所有<br>参加测验的人得分都不相同，问最多有多少名测验对象？", "options": ["38", "39", "40", "41"], "answer": 0, "neg": 0, "steps": ["第一步，设答对a题、答错b题、不答c题，a＋b＋c＝10，得分＝3a－b。", "第二步，固定a时，b可从0取到10－a，得分依次为3a、3a－1、…、3a－（10－a）＝4a－10，即每类得分为一段连续整数，区间为[4a－10，3a]。", "第三步，a从10降到0：a＝10得30；a＝9得27、26；a＝8得24、23、22；a＝7得21、20、19、18；a＝6得18到14……最高分21以下的各个a的区间首尾相接（因为4（a－1）－10≤3a恒成立），一路最低接到a＝0的0、－1、…、－10。", "第四步，合并区间得[－10，24]共35个整数分，再加上26、27、30三个分值，共35＋3＝38（种）不同得分。", "第五步，得分互不相同，故最多有38名测验对象。因此，选择A选项。"], "judge": "", "has_img": false, "paper": "zj-2018-A", "rules": [{"t": "容斥问题", "f": "<p>「都参加」「只参加」「都不」<\/p><b class=\"hl\">两集合：A+B−AB = 总数−都不<\/b><br>三集合标准：A+B+C−AB−AC−BC+ABC = 总数−都不<br>三集合非标准：只满足两个的、只满足一个的分开算", "hot": 1}, {"t": "数字特性法", "f": "<p>出现比例、倍数、奇偶、尾数、整除字眼<\/p>用<b class=\"hl\">奇偶<\/b>性/整除性/倍数关系直接排除选项", "hot": 0}]}], "extra": [{"id": "gk-2026-zf-q67", "stem": "某部门7人分两组到甲、乙两市进行调研。已知到甲市人数超过一半，老张和小王均到乙市，问共有多少种不同的分组方式？", "options": ["10", "8", "6", "5"], "answer": 2, "neg": 0, "steps": ["第一步，7人分甲乙两个市，甲市人数超过一半，即超过3.5人，故甲市取4人或5人。", "第二步，情形一：甲市4人、乙市3人。老张、小王都去乙市，乙市还需从其余7－2＝5人中选1人，共5种。", "第三步，情形二：甲市5人、乙市2人。老张、小王刚好占满乙市的2个名额，其余5人全去甲市，共1种。", "第四步，合计5＋1＝6（种）。因此，选择C选项。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "排列组合", "f": "<p>「多少种安排/选法」，有顺序要求或分组<\/p>排列 A(n,m)=n!/(n−m)!；组合 C(n,m)；相邻用捆绑、不相邻用插空、相同元素用隔板", "hot": 1}, {"t": "数字特性法", "f": "<p>出现比例、倍数、奇偶、尾数、整除字眼<\/p>用<b class=\"hl\">奇偶<\/b>性/整除性/倍数关系直接排除选项", "hot": 0}]}, {"id": "gk-2026-zf-q72", "stem": "甲、乙两个工程队单独完成A、B、C三个工程所需时间如下：甲队完成A、B、C分别需10天、15天、10天；乙队完成A、B、C分别需12天、9天、18天。问两队合作完成这3个工程至少需要多少天（不足1天算1天）？", "options": ["18", "17", "16", "15"], "answer": 3, "neg": 0, "steps": ["第一步，赋值三个工程的工程量，取甲、乙完成时间的最小公倍数：A工程60、B工程45、C工程90。", "第二步，求效率：甲队做A需10天，效率60÷10＝6；做B需15天，45÷15＝3；做C需10天，90÷10＝9。乙队做A需12天，60÷12＝5；做B需9天，45÷9＝5；做C需18天，90÷18＝5。", "第三步，比较相对效率：甲做C最快（效率9、10天完成），乙做B最快（效率5、9天完成）。让两人各做擅长的：甲做C用10天，乙先做B用9天；乙第10天转去做A，1天完成5×1＝5。", "第四步，A工程还剩60－5＝55，此时甲已完成C，两人合做A，合效率6＋5＝11，需55÷11＝5（天）。", "第五步，总用时10＋5＝15（天）。因此，选择D选项。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "最值问题", "f": "<p>「至少…才能保证」「最多/最少是多少」<\/p><b class=\"hl\">最不利<\/b>构造：最坏情况 +1<br>数列构造：设最大/最小为 x，其余按条件列不等式", "hot": 1}, {"t": "排列组合", "f": "<p>「多少种安排/选法」，有顺序要求或分组<\/p>排列 A(n,m)=n!/(n−m)!；组合 C(n,m)；相邻用捆绑、不相邻用插空、相同元素用隔板", "hot": 0}]}, {"id": "gk-2026-zf-q73", "stem": "某考试有30人参加，每人得分都是0~100之间的整数且互不相同。已知得分不低于90的人平均分为93.8分，小姜得了92分，问他的成绩排名最低可能是第几名？", "options": ["4", "5", "7", "8"], "answer": 0, "neg": 0, "steps": ["第一步，本题为最值问题。90～100分只有90、91、…、100共11个互不相同的整数分，故不低于90分的人数n≤11。", "第二步，这n人平均分为93.8分，总分93.8n必须是整数，n取1～11，只有n＝5（469分）和n＝10（938分）为整数。", "第三步，若n＝10，10个互不相同且不低于90的整数，最小和为90＋91＋…＋99＝945＞938，矛盾，故n＝5，前五名总分为93.8×5＝469（分）。", "第四步，问小姜（92分）排名最低，即让他前面的人尽可能多。若92分排第5，则前五名最低为92＋93＋94＋95＋96＝470＞469，不可能。", "第五步，若92分排第4（3人高于他），取93、94、100三人与92、90（第5名），和＝93＋94＋100＋92＋90＝469，恰好成立，故最低可为第4名。因此，选择A选项。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "容斥问题", "f": "<p>「都参加」「只参加」「都不」<\/p><b class=\"hl\">两集合：A+B−AB = 总数−都不<\/b><br>三集合标准：A+B+C−AB−AC−BC+ABC = 总数−都不<br>三集合非标准：只满足两个的、只满足一个的分开算", "hot": 1}, {"t": "数字特性法", "f": "<p>出现比例、倍数、奇偶、尾数、整除字眼<\/p>用<b class=\"hl\">奇偶<\/b>性/整除性/倍数关系直接排除选项", "hot": 0}]}]}, {"gid": "jh", "title": "几何 · 钟表 · 周期 · 计费", "tag": "多为小题型，套公式即得分", "think": "几何先画图找相似/等积；钟表算「分针相对时针」每分钟 5.5°；周期看「余数」；分段计费<b>分段列式<\/b>再加总。", "rules": [{"t": "几何问题", "f": "套公式；不规则图形用割补/平移；相似比 k → 面积比 k²、体积比 k³", "when": "周长、面积、体积、相似、三角形"}, {"t": "钟表问题", "f": "分针每分钟 6°，时针每分钟 0.5°，速度差 5.5°/分；夹角 = |30H − 5.5M| 取小", "when": "时针分针夹角、重合、成直角"}, {"t": "循环周期", "f": "先找周期长度 T，再看 n÷T 的余数；同时发生的题求最小公倍数", "when": "「每隔几天」「第 n 个是什么」"}, {"t": "星期日期问题", "f": "平年 365=52×7+1（星期+1），闰年 +2；一个月内星期几出现次数看该月天数", "when": "星期几、日期推算"}, {"t": "统筹优化", "f": "排队打水：短作业优先；烙饼/加工：两两配对；最短路径：找最小生成树思路", "when": "「最少用多少时间/最少花多少钱」"}, {"t": "植树问题", "f": "两端都栽：棵数 = 段数+1；只栽一端 = 段数；环形 = 段数；段数 = 总长÷间距", "when": "等距栽树、装路灯"}, {"t": "方阵问题", "f": "实心方阵总数 = n²；最外层 = 4n−4；相邻两层差 8", "when": "正方形阵列、每边 n 个"}], "main": [{"id": "zj-2015-A-q67", "stem": "一只挂钟的秒针长 30 厘米，分针长 20 厘米，当秒针的顶点走过的弧长约为 9.42 米时，分针的顶点约走过<br>的弧长为多少厘米？", "options": ["6.98", "10.47", "15.70", "23.55"], "answer": 1, "neg": 0, "steps": ["第一步，秒针长30厘米，顶点转1圈弧长为2×3.14×30＝188.4（厘米）。", "第二步，秒针顶点走过9.42米＝942厘米，转的圈数为942÷188.4＝5（圈），即走了5分钟。", "第三步，5分钟分针转5÷60＝1/12（圈），分针顶点弧长为2×3.14×20÷12＝125.6÷12≈10.47（厘米）。", "第四步，另用比例法：1小时内秒针转60圈、分针转1圈，半径30∶20，弧长比为（60×30）∶（1×20）＝90∶1，942÷90≈10.47（厘米）。因此，选择B选项。"], "judge": "", "has_img": false, "paper": "zj-2015-A", "rules": [{"t": "钟表问题", "f": "<p>时针分针夹角、重合、成直角<\/p>分针每分钟 6°，时针每分钟 0.5°，速度差 <b class=\"hl\">5.5<\/b>°/分；夹角 = |30H − 5.5M| 取小", "hot": 1}, {"t": "循环周期", "f": "<p>「每隔几天」「第 n 个是什么」<\/p>先找<b class=\"hl\">周期<\/b>长度 T，再看 n÷T 的余数；同时发生的题求最小公倍数", "hot": 0}]}, {"id": "zj-2018-A-q53", "stem": "某工厂员工周一到周五每天工作8 小时，周六工作5 小时，周日休息。小王某年6 月下旬到该工厂上班，<br>某天下班后算得已到该工厂上班500 小时。如当年7 月1 日是星期六，问小王到该工厂上班的日期是：", "options": ["6 月21 日", "6 月22 日", "6 月23 日", "6 月24 日"], "answer": 3, "neg": 0, "steps": ["第一步，每周工时＝5×8＋5＝45（小时）。", "第二步，500÷45＝11（周）余5（小时），余下的5小时恰为周六一天的工作时间，说明上班第一天是周六。", "第三步，当年7月1日是周六，则6月下旬的周六为6月24日（7月1日往前推7天）。", "第四步，小王到该工厂上班的日期为6月24日。因此，选择D选项。"], "judge": "", "has_img": false, "paper": "zj-2018-A", "rules": [{"t": "循环周期", "f": "<p>「每隔几天」「第 n 个是什么」<\/p>先找<b class=\"hl\">周期<\/b>长度 T，再看 n÷T 的余数；同时发生的题求最小公倍数", "hot": 1}, {"t": "星期日期问题", "f": "<p>星期几、日期推算<\/p><b class=\"hl\">平年 365=52×7+1（星期+1）<\/b>，闰年 +2；一个月内星期几出现次数看该月天数", "hot": 0}]}, {"id": "zj-2018-A-q57", "stem": "<img class=\"qimg\" src=\"../assets/data/real/img/zj2018-q57.webp\" />", "options": ["A", "B", "C", "D"], "answer": 1, "neg": 0, "steps": ["第一步，由「每8人坐一桌，最后多7人」「每7人一组，最后多6人」可知，人数n除以8余7、除以7余6，除数与余数之差同为1，用「差同减差」：n＋1同时被8、7整除，即n＋1＝56k，n＝56k－1。", "第二步，再满足「每5人坐一辆车，最后多2人」，即n除以5余2。k＝2时n＝111，111÷5余1，排除；k＝3时n＝167，167÷5余2，符合；k＝4时n＝223＞200，与题干「不超过200人」矛盾，排除。", "第三步，参赛人数为167人，对应选项B。因此，选择B选项。"], "judge": "", "has_img": true, "paper": "zj-2018-A", "rules": [{"t": "几何问题", "f": "<p>周长、面积、体积、相似、三角形<\/p>套公式；不规则图形用割补/平移；<b class=\"hl\">相似<\/b>比 k → 面积比 k²、体积比 k³", "hot": 1}, {"t": "代入排除法", "f": "<p>选项是具体数字、列式复杂或带不定条件<\/p>把选项<b class=\"hl\">代回题干<\/b>验条件，先从好算的选项代", "hot": 0}]}, {"id": "zj-2017-A-q40", "stem": "小张家距离工厂15 千米，乘坐班车20 分钟可到工厂。一天，他错过班车，改乘出租车上班。出租车出发时<br>间比班车晚4 分钟，送小张到工厂后出租车马上原路返回，在距离工厂1.875 千米处与班车相遇。如果班车和出<br>租车都是匀速运动且不计上下车时间，那么小张比班车早多少分钟到达工厂？", "options": ["3", "4", "5", "6"], "answer": 1, "neg": 0, "steps": ["第一步，班车全程15千米用20分钟，速度15÷20＝0.75（千米/分）。", "第二步，出租车晚出发4分钟，此时班车已走0.75×4＝3（千米），距工厂15－3＝12（千米）。", "第三步，出租车到工厂后又返回1.875千米与班车相遇，相遇点距工厂1.875千米，即距家15－1.875＝13.125（千米）。", "第四步，从出租车出发到相遇，班车走了13.125－3＝10.125（千米），用时10.125÷0.75＝13.5（分钟）。", "第五步，同一时间出租车走了15＋1.875＝16.875（千米），速度16.875÷13.5＝1.25（千米/分），全程15÷1.25＝12（分钟），加上晚出发的4分钟共16分钟，比班车的20分钟早4分钟。因此，选择B选项。"], "judge": "", "has_img": false, "paper": "zj-2017-A", "rules": [{"t": "钟表问题", "f": "<p>时针分针夹角、重合、成直角<\/p>分针每分钟 6°，时针每分钟 0.5°，速度差 <b class=\"hl\">5.5<\/b>°/分；夹角 = |30H − 5.5M| 取小", "hot": 1}, {"t": "循环周期", "f": "<p>「每隔几天」「第 n 个是什么」<\/p>先找<b class=\"hl\">周期<\/b>长度 T，再看 n÷T 的余数；同时发生的题求最小公倍数", "hot": 0}]}], "extra": [{"id": "gk-2026-zf-q74", "stem": "（本题为图形题，题干与选项见下图）<br><img class=\"qimg\" src=\"../assets/data/real/img/gk2026-q74.webp\" />", "options": ["20%", "25%", "40%", "50%"], "answer": 1, "neg": 0, "steps": ["第一步，抓比例。梯形ABCD中AB∥CD，对角线交于O，则AO∶OC＝BO∶OD＝AB∶CD。题面「OA＝0.6OD」是印刷笔误，O在AC上，应为「OA＝0.6OC」，据此AB∶CD＝0.6。", "第二步，赋值：设CD＝5、AB＝3，梯形高为h，梯形面积＝（3＋5）×h÷2＝4h。", "第三步，扩展成面积最小的长方形：以最长的底CD作长、高h作宽，长方形面积＝5h。", "第四步，面积至少增加（5h－4h）÷4h＝25%。因此，选择B选项。"], "judge": "", "has_img": true, "paper": "gk-2026-zf", "rules": [{"t": "几何问题", "f": "<p>周长、面积、体积、相似、三角形<\/p>套公式；不规则图形用割补/平移；<b class=\"hl\">相似<\/b>比 k → 面积比 k²、体积比 k³", "hot": 1}, {"t": "代入排除法", "f": "<p>选项是具体数字、列式复杂或带不定条件<\/p>把选项<b class=\"hl\">代回题干<\/b>验条件，先从好算的选项代", "hot": 0}]}, {"id": "gk-2026-zf-q75", "stem": "某社区干部每周一参加工作例会，每月10日、20日接访群众。已知8月与9月共有2次接访群众与工作例会在同一天，问当年9月1日是：", "options": ["周三", "周二", "周六", "周五"], "answer": 2, "neg": 0, "steps": ["第一步，8月10日、20日与9月10日、20日共4个接访日，其中恰有2天同时是周 ": "zj-2017-A-q46", "stem": "小明负责将某农场的鸡蛋运送到小卖部。按照规定，每送达1 枚完整无损的鸡蛋，可得运费0.1 元；若有鸡<br>蛋破损，不仅得不到该枚鸡蛋的运费，每破损一枚鸡蛋还要赔偿0.4 元。小明10 月份共运送鸡蛋25000 枚，获得<br>运费2480 元。那么，在运送过程中，鸡蛋破损了：", "options": ["20 枚", "30 枚", "40 枚", "50 枚"], "answer": 2, "neg": 0, "steps": ["第一步，设破损x枚，完好（25000－x）枚。", "第二步，完好鸡蛋得运费0.1元，破损的既不得运费还要赔0.4元，故总运费为0.1×（25000－x）－0.4x＝2480。", "第三步，化简：2500－0.1x－0.4x＝2480，即0.5x＝20，解得x＝40（枚）。", "第四步，即每破损1枚少收入0.5元，共少收入2500－2480＝20元，故破损20÷0.5＝40（枚）。因此，选择C选项。"], "judge": "", "has_img": false, "paper": "zj-2017-A", "rules": [{"t": "代入排除法", "f": "<p>选项是具体数字、列式复杂或带不定条件<\/p>把选项<b class=\"hl\">代回题干<\/b>验条件，先从好算的选项代", "hot": 1}, {"t": "数字特性法", "f": "<p>出现比例、倍数、奇偶、尾数、整除字眼<\/p>用<b class=\"hl\">奇偶<\/b>性/整除性/倍数关系直接排除选项", "hot": 0}]}], "extra": [{"id": "gk-2026-zf-q69", "stem": "2024年张和李年龄的平均值是刘的2倍；2028年张的年龄是李的1.5倍，比刘年龄的2倍大4岁。问张哪一年60岁？", "options": ["2036年", "2038年", "2040年", "2042年"], "answer": 2, "neg": 0, "steps": ["第一步，设2028年张、李、刘的年龄分别为3x、2x、y（由「张是李的1.5倍」得张∶李＝3∶2）。", "第二步，2028年张比刘的2倍大4岁：3x＝2y＋4……①", "第三步，2024年三人各小4岁，张、李年龄的平均值是刘的2倍：[（3x－4）＋（2x－4）]÷2＝2×（y－4），即5x－8＝4y－16……②", "第四步，联立①②：由①得4y＝6x－8，代入②得5x－8＝6x－8－16，解得x＝16，y＝22。", "第五步，2028年张3×16＝48岁，到60岁还需60－48＝12年，即2040年。（另解：张2028年年龄是3的倍数，过n年到60岁，n也是3的倍数，即「所求年份－2028」能被3整除，选项中只有2040满足。）因此，选择C选项。"], "judge": "", "has_img": false, "paper": "gk-2026-zf", "rules": [{"t": "年龄问题", "f": "<p>年龄差不变<\/p>两人<b class=\"hl\">年龄差<\/b>恒定；n 年后各加 n；用差不变列式或代入", "hot": 1}, {"t": "代入排除法", "f": "<p>选项是具体数字、列式复杂或带不定条件<\/p>把选项<b class=\"hl\">代回题干<\/b>验条件，先从好算的选项代", "hot": 0}]}, {"id": "gk-2026-zf-q70", "stem": "甲、乙和丙3个单位共有100多名职工，其中甲单位的职工人数占总数的24%，乙单位的职工比丙单位多50%。问丙单位的职工比甲单位多多少人？", "options": ["4", "8", "12", "16"], "answer": 1, "neg": 0, "steps": ["第一步，甲单位占总人数24%＝6/25，故总人数T必为25的倍数。", "第二步，乙比丙多50%，即乙∶丙＝3∶2，设丙2t人、乙3t人，乙＋丙＝5t。", "第三步，乙＋丙＝T×（1－24%）＝0.76T＝5t，故T＝125t/19；又T为25的倍数，且t为整数，得t＝19n、T＝125n。", "第四步，题干「共有100多名职工」，故n＝1，T＝125人。甲＝125×24%＝30（人），乙＝3×19＝57（人），丙＝2×19＝38（人），合计30＋57＋38＝125，吻合。", "第五步，丙比甲多38－30＝8（人）。因此，选择B选项。"], "judge": "", "has_img": false, "paper": " var cur=null, t0=0, chosen=-1, submitted=false, groupWrong=0, extraMode=false;

function $(s,r){return (r||document).querySelector(s);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function L(i){return 'ABCDEFGH'[i]||('选项'+(i+1));}
function totalMain(){var n=0;D.groups.forEach(function(g){n+=g.main.length;});return n;}
function doneMain(){var n=0;D.groups.forEach(function(g){g.main.forEach(function(q){if(st.ans[q.id])n++;});});return n;}

var wrap=$('#app');
function render(){
  if(st.done){return summary();}
  var g=D.groups[st.gi]; if(!g){st.done=true;save();return summary();}
  var list=extraMode?g.extra:g.main;
  var q=list[st.qi];
  if(!q){ // 本组主线结束
    if(!extraMode){ return groupEnd(g); }
    st.gi++;st.qi=0;extraMode=false;save();return render();
  }
  cur=q;chosen=-1;submitted=false;
  wrap.innerHTML='';
  var c=el('div','card');
  var head=el('div','gh');
  head.appendChild(el('b',null,'第 '+(st.gi+1)+' 组 · '+g.title));
  head.appendChild(el('span',null,g.tag));
  c.appendChild(head);
  c.appendChild(el('div','qno','第 '+(st.qi+1)+' / '+list.length+' 题'+(st.qi===0&&!extraMode?'（主讲题，先自己做，别急着看答案）':'（强化题）')));
  var sd=el('div','stem',q.stem);
  if(q.judge){ sd.appendChild(el('span','meta','题型判定：'+q.judge)); }
  c.appendChild(sd);
  var box=el('div','opts');
  q.options.forEach(function(o,i){
    var t=String(o).replace(/<[^>]+>/g,'').trim();
    var hasimg=/<img/i.test(String(o));var dup=(!hasimg)&&t===L(i);   /* 图推：选项就是题干图里的 A/B/C/D 四个图 */
    var b=el('button','opt'+(dup?' letteronly':''),'<em>'+L(i)+'</em>'+(dup?'<span class="lp">题干图中的 '+L(i)+' 选项</span>':o));
    b.onclick=function(){ if(submitted)return; chosen=i;
      Array.prototype.forEach.call(box.children,function(x,j){x.classList.toggle('sel',j===i);});
      sub.disabled=false; };
    box.appendChild(b);
  });
  c.appendChild(box);
  var act=el('div','act');
  var sub=el('button','btn','提交答案'); sub.disabled=true;
  sub.onclick=function(){ if(submitted||chosen<0)return; doSubmit(c,box,sub,q,g); };
  act.appendChild(sub);
  act.appendChild(el('span','meta','（计时中，提交后才显示用时）'));
  c.appendChild(act);
  wrap.appendChild(c);
  t0=Date.now();
  // 进度条
  $('#ptext').textContent='已做 '+doneMain()+' / '+totalMain()+' 题';
  $('#pfill').style.width=(doneMain()/totalMain()*100)+'%';
  window.scrollTo({top:0,behavior:'smooth'});
  if(location.search.indexOf('autotest')>=0){
    setTimeout(function(){var o=document.querySelector('.opt');if(o)o.click();
      var s=document.querySelector('.act .btn');if(s)s.click();},40);
  }
}

function doSubmit(card,box,sub,q,g){
  submitted=true;
  var ms=Date.now()-t0, sec=Math.round(ms/1000);
  var ok=(chosen===q.answer);
  st.ans[q.id]={c:chosen,ok:ok,sec:sec};
  save();
  $('#ptext').textContent='已做 '+doneMain()+' / '+totalMain()+' 题';
  $('#pfill').style.width=(doneMain()/totalMain()*100)+'%';
  Array.prototype.forEach.call(box.children,function(x,i){
    x.disabled=true; x.classList.remove('sel');
    if(i===q.answer)x.classList.add('right');
    if(i===chosen&&!ok)x.classList.add('wrong');
  });
  sub.style.display='none';
  card.querySelector('.act .meta').textContent='';
  if(!ok) groupWrong++;

  var res=el('div','res');
  var j=el('div','judge '+(ok?'ok':'bad'),
     (ok?'✔ 答对了':'✘ 答错了')+'　正确答案 '+L(q.answer)+(ok?'':' ｜ 你选了 '+L(chosen))+'');
  res.appendChild(j); if(q.neg){res.appendChild(el('div','meta neg','⚠ 本题是选非题：正确答案＝「不正确／不属于／不能／除外」的那一项。解析里说「正确」的选项都是干扰项，别按常识去选对的那个。'));}
  res.appendChild(el('div','meta','用时 '+sec+' 秒'+(sec>90?'（偏慢，本模块目标 ≤75 秒/题）':'')+'　·　题源 '+q.paper+' '+q.id));

  // 思路
  var b1=el('div','blk');
  b1.appendChild(el('h4',null,'一、这道题怎么想'));
  b1.appendChild(el('div','bd',g.think+(q.judge?'<br><b>本题判定：</b>'+q.judge:'')));
  res.appendChild(b1);

  // 分步
  var b2=el('div','blk');
  b2.appendChild(el('h4',null,'二、分步解法'));
  var ol=el('ol');
  (q.steps.length?q.steps:['官方解析缺失，请对照原卷']).forEach(function(s){ ol.appendChild(el('li',null,s)); });
  b2.appendChild(el('div','bd','')).appendChild(ol);
  res.appendChild(b2);

  // 本题用到的套路（只截这一题用得上的，主用的高亮）
  var b3=el('div','blk');
  b3.appendChild(el('h4',null,'三、这一题要用的套路（抄在题干旁，下次照这个做）'));
  var rw=el('div','bd');
  (q.rules||[]).forEach(function(r){
    var d=el('div','rule'+(r.hot?' hot':''));
    d.appendChild(el('div','rt',(r.hot?'<span class="flag">本题主用</span>':'')+'<b>'+r.t+'</b>'));
    d.appendChild(el('p','',r.f));
    rw.appendChild(d);
  });
  b3.appendChild(rw);
  res.appendChild(b3);

  var act=el('div','act');
  var nx=el('button','btn','下一题 →');
  nx.onclick=function(){ st.qi++; save(); groupWrong=0; render(); };
  act.appendChild(nx);
  res.appendChild(act);
  card.appendChild(res);
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function groupEnd(g){
  wrap.innerHTML='';
  var c=el('div','card sum');
  var total=g.main.length, right=0, secs=0;
  g.main.forEach(function(q){var a=st.ans[q.id];if(a){if(a.ok)right++;secs+=a.sec;}});
  c.appendChild(el('div','big',right+' / '+total));
  c.appendChild(el('p','','本组《'+g.title+'》对 '+right+' 题，平均每题 '+(secs?Math.round(secs/total):0)+' 秒'));
  var advice = right>=3 ? '达标（≥3/4）。可以进下一组。'
             : '没达标（'+right+'/4）。先用下面「再来 3 题」同考点加练，练完再进下一组。';
  c.appendChild(el('p','',advice));
  var act=el('div','act');
  if(right<3 && g.extra.length){
    var more=el('button','btn','再来 '+g.extra.length+' 题同考点加练');
    more.onclick=function(){ extraMode=true;st.qi=0;save();render();};
    act.appendChild(more);
  }
  var next=el('button','btn ghost',(st.gi+1<D.groups.length)?'进下一组：'+D.groups[st.gi+1].title:'看总成绩');
  next.onclick=function(){ st.gi++;st.qi=0;extraMode=false;groupWrong=0;save();render();};
  act.appendChild(next);
  c.appendChild(act);
  wrap.appendChild(c);
  $('#ptext').textContent='已做 '+doneMain()+' / '+totalMain()+' 题';
  $('#pfill').style.width=(doneMain()/totalMain()*100)+'%';
}

function summary(){
  wrap.innerHTML='';
  var c=el('div','card sum');
  var right=doneMain();
  c.appendChild(el('div','big',right+' / '+totalMain()));
  var secs=0;Object.keys(st.ans).forEach(function(k){secs+=st.ans[k].sec||0;});
  c.appendChild(el('p','','数量关系学习模式全部做完，总用时 '+Math.round(secs/60)+' 分钟'));
  var by={};
  D.groups.forEach(function(g){var r=0;g.main.forEach(function(q){if(st.ans[q.id]&&st.ans[q.id].ok)r++;});by[g.title]=r+'/'+g.main.length;});
  Object.keys(by).forEach(function(k){c.appendChild(el('p','',k+'：'+by[k]));});
  var act=el('div','act');
  var re=el('button','btn ghost','重新练一遍（清空本页记录）');
  re.onclick=function(){ if(confirm('确定清空本页记录？')){ localStorage.removeItem(KEY); st={gi:0,qi:0,ans:{},done:false}; save(); render(); } };
  act.appendChild(re);
  c.appendChild(act);
  wrap.appendChild(c);
}

window.__learn={render:render,state:st};
(function(){
  var q=location.search;
  if(q.indexOf('demo1')>=0){        // 渲染「本组小结」用于自检
    D.groups[0].main.forEach(function(it,i){ st.ans[it.id]={c:it.answer,ok:i===0,sec:55}; });
    st.gi=0; st.qi=D.groups[0].main.length; groupEnd(D.groups[0]); return;
  }
  if(q.indexOf('demo2')>=0){        // 渲染「总成绩」用于自检
    D.groups.forEach(function(g){ g.main.forEach(function(it){ st.ans[it.id]={c:it.answer,ok:true,sec:48}; }); });
    st.done=true; summary(); return;
  }
  var mg=/[?&]g=(\d+)/.exec(q);      // 跳到第 N 组自检用
  if(mg){ st.gi=Math.min(D.groups.length-1,Math.max(0,parseInt(mg[1],10)-1)); st.qi=0; }
})();
render();
})();
</script>
</body></html>
